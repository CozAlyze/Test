<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000f26">
<title>Your Vedic Reading · CozAlyze</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   COZALYZE · COMPLETE VEDIC READING · R3.4 · birth chart door
   Paid dashboard + reveal + six reading sections in ONE document
   (standing rule: no iframe, no page navigation between them).
   Design tokens and structure follow the supplied spec verbatim.
   ============================================================ */
:root {
  --vedic-navy: #000f26;
  --vedic-gold: #d4a178;
  --vedic-gold-muted: rgba(212, 161, 120, 0.65);
  --vedic-ivory: #e5d4c5;
  --vedic-ivory-muted: rgba(229, 212, 197, 0.88);
  --display-font: "Cormorant Garamond", Georgia, serif;
  --body-font: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --side-pad: 28px;
  --dash-zoom: 1;            /* opens showing the whole art, then eases to --dash-zoom-in */
  --dash-zoom-in: 1.3;
}
@media (max-width: 374px) { :root { --side-pad: 20px; } }

* { box-sizing: border-box; }
html { background: var(--vedic-navy); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--vedic-navy);
  color: var(--vedic-ivory);
  font-family: var(--body-font);
  -webkit-font-smoothing: antialiased;
}

/* Fixed background layer: iOS ignores background-attachment on body,
   so the image lives on its own fixed layer behind the scrolling content. */
.vedic-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background-color: var(--vedic-navy);
  background-image: url("vedic-moon-bg.png");
  background-size: cover;
  background-position: top center;
  background-repeat: no-repeat;
  pointer-events: none;
}

.vedic-reading-page {
  position: relative;
  z-index: 1;
  min-height: 100svh;
  padding:
    calc(env(safe-area-inset-top) + 24px)
    var(--side-pad)
    calc(env(safe-area-inset-bottom) + 24px);
}

.vedic-reading-content {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  animation: vedicFadeIn 240ms ease-out;
}
@keyframes vedicFadeIn {
  from { opacity: 0; transform: translateY(5px); }
  to   { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  .vedic-reading-content { animation: none; }
  .stage { transition: none; }
}

/* ---------- header ---------- */
.vedic-back-button {
  position: absolute;
  top: calc(env(safe-area-inset-top) + 10px);
  left: calc(var(--side-pad) - 10px);
  width: 44px;
  height: 44px;
  padding: 0;
  margin: 0;
  border: 0;
  background: transparent;
  color: var(--vedic-gold);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.vedic-back-button svg { width: 30px; height: 20px; display: block; }
.vedic-back-button:focus-visible { outline: 1px solid var(--vedic-gold-muted); outline-offset: 4px; border-radius: 4px; }

.vedic-header {
  text-align: center;
  padding-top: 6px;
}
/* His logo lockup (emblem + CozAlyze wordmark) as one image, white keyed out.
   Width is set so the wordmark reads at the spec's 28–30px display size. */
.vedic-logo {
  display: block;
  width: 140px;
  height: auto;
  margin: 0 auto;
}
.vedic-eyebrow {
  font-family: var(--body-font);
  font-size: clamp(13px, 3.5vw, 14.5px);
  font-weight: 500;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--vedic-ivory-muted);
  margin: 12px 0 0;
  padding-left: 0.28em; /* optical centre with the trailing tracking */
}
.vedic-counter {
  font-family: var(--display-font);
  font-size: clamp(27px, 7.2vw, 31px);
  font-weight: 500;
  letter-spacing: 0.06em;
  font-variant-numeric: lining-nums;
  color: var(--vedic-gold);
  margin: 40px 0 0;
}

/* ---------- ornamental divider ---------- */
.vedic-divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: min(100%, 420px);
  margin: 14px auto;
  color: var(--vedic-gold);
}
.vedic-divider::before,
.vedic-divider::after {
  content: "";
  flex: 1 1 auto;
  height: 1px;
  background: var(--vedic-gold-muted);
}
.vedic-divider svg { width: 16px; height: 16px; flex: 0 0 auto; display: block; }

/* ---------- title ---------- */
.vedic-title {
  font-family: var(--display-font);
  font-size: clamp(2.6rem, 11.5vw, 3.4rem);
  font-weight: 500;
  line-height: 0.98;
  color: var(--vedic-gold);
  text-align: center;
  text-wrap: balance;
  margin: 10px 0;
}
.vedic-title--long {
  font-size: clamp(2.35rem, 10vw, 2.9rem);
}

/* ---------- body ---------- */
.vedic-body {
  font-family: var(--body-font);
  font-size: clamp(1.25rem, 5.4vw, 1.4rem);
  line-height: 1.55;
  font-weight: 400;
  color: var(--vedic-ivory);
  margin-top: 24px;
}
.vedic-body p { margin: 0 0 1.35em; }
.vedic-body p:last-child { margin-bottom: 0; }
.vedic-subhead {
  font-family: var(--display-font);
  font-size: clamp(1.6rem, 6.4vw, 1.9rem);
  font-weight: 500;
  line-height: 1.12;
  color: var(--vedic-gold);
  text-align: left;
  margin: 1.6em 0 0.7em;
}
.vedic-body .vedic-subhead:first-child { margin-top: 0; }

/* ---------- bottom navigation ---------- */
.vedic-nav { margin-top: 34px; }
.vedic-nav-rule {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--vedic-gold);
}
.vedic-nav-rule::before,
.vedic-nav-rule::after {
  content: "";
  flex: 1 1 auto;
  height: 1px;
  background: var(--vedic-gold-muted);
}
.vedic-nav-rule svg { width: 14px; height: 14px; flex: 0 0 auto; display: block; }
.vedic-nav-links {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding-top: 6px;
}
.vedic-nav a,
.vedic-nav button {
  font-family: var(--body-font);
  font-size: clamp(16px, 4.3vw, 18px);
  font-weight: 400;
  color: var(--vedic-gold);
  text-decoration: none;
  background: transparent;
  border: 0;
  padding: 0;
  margin: 0;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  text-align: left;
}
.vedic-nav a:focus-visible,
.vedic-nav button:focus-visible { outline: 1px solid var(--vedic-gold-muted); outline-offset: 4px; border-radius: 4px; }
.vedic-nav .vedic-nav-next { text-align: right; justify-content: flex-end; }
.vedic-nav svg:not(.vedic-nav-rule svg) { width: 24px; height: 15px; flex: 0 0 auto; }

/* ============================================================
   PAID DASHBOARD  (his art = frame 0 of the reveal clip, so the
   dashboard and the video's first frame are pixel-identical)
   ============================================================ */
body[data-view="dashboard"] .vedic-reading-page,
body[data-view="dashboard"] .vedic-bg { display: none; }
body[data-view="reading"] .dash { display: none; }

.dash {
  position: fixed;
  inset: 0;
  z-index: 5;
  background: var(--vedic-navy);
  overflow: hidden;
}
/* one shared stage: contain-fit box with the clip's exact aspect, centred */
.stage {
  position: absolute;
  left: 50%;
  top: 50%;
  aspect-ratio: 1068 / 1940;
  width: min(100vw, calc(100svh * 1068 / 1940));   /* contain-fit: the whole art */
  /* --dash-zoom 1 = whole art; above 1 the stage scales up around its centre and
     crops evenly. Done with transform so iOS animates it smoothly. */
  transform: translate(-50%, -50%) scale(var(--dash-zoom, 1));
  transition: transform 1400ms cubic-bezier(0.22, 0.61, 0.36, 1);
  will-change: transform;
  container-type: inline-size;
  overflow: hidden;
}
.stage-art,
.stage video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  display: block;
  background: var(--vedic-navy);
}
.stage video { background: transparent; }   /* the art under it shows until the first frame paints */
.hot {
  position: absolute;
  margin: 0;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  color: transparent;
  font-size: 0;
}
.hot:focus-visible { outline: 1px solid var(--vedic-gold-muted); outline-offset: 2px; border-radius: 8px; }
.hot[disabled] { cursor: default; }
/* live ascendant: shown ONLY when the sign is not the sample Leo baked into the art */
.asc-patch, .asc-glyph, .asc-label { position: absolute; display: none; pointer-events: none; }
.stage[data-asc-live="1"] .asc-patch,
.stage[data-asc-live="1"] .asc-glyph,
.stage[data-asc-live="1"] .asc-label { display: block; }
/* geometry measured on the 1068-wide art, all in cqw so x and y share one scale:
   baked glyph centre (268,1228) inside a ring of outer radius ~40, baked "Leo" at x 377–427, y 1240–1270 */
.asc-patch-glyph {
  left: 22.49cqw; top: 112.38cqw;
  width: 5.2cqw; height: 5.2cqw;
  border-radius: 50%;
  background: radial-gradient(circle, rgb(3,14,28) 0 68%, rgba(3,14,28,0) 100%);
}
.asc-patch-text {
  left: 34.6cqw; top: 115.5cqw;
  width: 6.8cqw; height: 3cqw;
  background: radial-gradient(ellipse at center, rgb(3,14,28) 0 60%, rgba(3,14,28,0) 100%);
}
.asc-glyph {
  left: 22.49cqw; top: 112.38cqw;
  width: 5.2cqw; height: 5.2cqw;
  font: 400 3.5cqw/5.2cqw "Cormorant Garamond", "Apple Symbols", "Segoe UI Symbol", serif;
  text-align: center;
  color: #d9b48a;
}
.asc-label {
  left: 35.3cqw; top: 116.1cqw;
  font: 500 2.85cqw/1 var(--display-font);
  color: var(--vedic-ivory);
  white-space: nowrap;
}
.dash-preparing .hot-reading { opacity: 0.45; }

/* ============================================================
   REVEAL OVERLAY  (video plays once, then everything disappears
   and the reading emerges)
   ============================================================ */
.reveal {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: var(--vedic-navy);
  overflow: hidden;
  display: none;
}
.reveal.is-on { display: block; }
.reveal .asc-patch, .reveal .asc-glyph, .reveal .asc-label { transition: opacity 320ms ease-out; }
.reveal.asc-off .asc-patch, .reveal.asc-off .asc-glyph, .reveal.asc-off .asc-label { opacity: 0; }
.reveal-curtain {
  position: absolute;
  inset: 0;
  background: var(--vedic-navy);
  opacity: 0;
  transition: opacity 480ms ease-in;
  pointer-events: none;
}
.reveal.is-closing .reveal-curtain { opacity: 1; }
.reveal-back {
  position: absolute;
  top: calc(env(safe-area-inset-top) + 10px);
  left: 18px;
  width: 44px;
  height: 44px;
  border: 0;
  padding: 0;
  background: transparent;
  color: var(--vedic-gold);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.reveal-back svg { width: 30px; height: 20px; display: block; }
.sr-only {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}
body.scroll-locked { overflow: hidden; touch-action: none; }

/* ---------- build stamp (project standing rule) ---------- */
.vedic-stamp {
  position: fixed;
  right: 8px;
  bottom: calc(env(safe-area-inset-bottom) + 4px);
  z-index: 2;
  font: 9px/1 var(--body-font);
  letter-spacing: 0.08em;
  color: rgba(212, 161, 120, 0.35);
  pointer-events: none;
}

/* ============================================================
   ASCENDANT EMERGENCE (carried from VEDIC READING V2.5 "swell + unbroken field").
   Tapping the Ascendant door: black beat, the person's sign born small at the
   centre and swelling to full screen over 3s while it plays, then the reading
   rises beneath it and the sign pins to the top. Standing rule: the swell is
   part of every sign emergence and is never removed. Namespaced "asq".
   ============================================================ */
body[data-view="ascendant"] .dash,
body[data-view="ascendant"] .vedic-reading-page,
body[data-view="ascendant"] .vedic-bg,
body[data-view="ascendant"] .reveal { display: none !important; }
body:not([data-view="ascendant"]) .asq { display: none !important; }
body.asq-locked { overflow: hidden; height: 100dvh; }
body[data-view="ascendant"] { background: #0b0f16; }
.asq { --asq-bg:#0b0f16; --asq-gold:#c9a15e; --asq-champagne:#e9d7ae; --asq-ivory:#ddd3c2;
  --asq-hairline:rgba(201,161,94,.28); --asq-nav-h:64px; }
#asqVeil { position:fixed; inset:0; z-index:54; background:#000; opacity:0; pointer-events:none; transition:opacity .7s ease; }
#asqVeil.on { opacity:1; pointer-events:auto; }
#asqHero { position:fixed; top:0; left:0; right:0; height:100dvh; z-index:20; background:#000;
  display:flex; align-items:center; justify-content:center; overflow:hidden; will-change:height; transition:none; }
#asqHero.settling { transition:height 1.4s cubic-bezier(.22,.61,.21,1); }
#asqScale { width:100%; height:100%; transform-origin:center 46%; will-change:transform; }
#asqHero video { width:100%; height:100%; object-fit:contain; display:block; opacity:0; transition:opacity .9s ease; }
#asqHero.playing video { opacity:1; }
#asqHero.bloom #asqScale { transform:scale(.06); }
#asqHero.bloom.grown #asqScale { animation:asqBloom 3s linear forwards; }
@keyframes asqBloom { from { transform:scale(.06); } to { transform:scale(1); } }
#asqContent { position:fixed; top:0; left:0; right:0; z-index:19; background:var(--asq-bg); color:var(--asq-ivory);
  font-family:'EB Garamond', Georgia, serif; -webkit-font-smoothing:antialiased;
  transform:translateY(100dvh); will-change:transform; visibility:hidden; }
#asqContent.rising { visibility:visible; transition:transform 1.4s cubic-bezier(.22,.61,.21,1); }
body.asq-done #asqHero { position:fixed; top:0; left:0; right:0; height:var(--settled-h); z-index:20; background:#000; }
body.asq-done #asqContent { position:relative; z-index:1; margin-top:var(--settled-h); transform:none; visibility:visible; transition:none; }
#asqContent .wrap { max-width:640px; margin:0 auto; padding:34px 24px calc(var(--asq-nav-h) + env(safe-area-inset-bottom) + 72px); }
#asqContent .eyebrow { display:flex; align-items:center; gap:14px; justify-content:center; color:var(--asq-champagne);
  font-size:18px; letter-spacing:.38em; text-transform:uppercase; font-family:'Cormorant Garamond',serif; font-weight:600; padding-left:.38em; }
#asqContent .eyebrow::before, #asqContent .eyebrow::after { content:""; flex:0 0 44px; height:1px; background:linear-gradient(90deg,transparent,var(--asq-hairline)); }
#asqContent .eyebrow::after { background:linear-gradient(90deg,var(--asq-hairline),transparent); }
#asqContent h1 { font-family:'Cormorant Garamond',serif; font-weight:600; color:var(--asq-champagne); text-align:center; font-size:44px;
  line-height:1.05; letter-spacing:.10em; margin:10px 0 4px; padding-left:.10em; text-shadow:0 0 26px rgba(233,215,174,.18); }
#asqContent .subtitle { display:flex; align-items:center; justify-content:center; gap:10px; font-family:'Cormorant Garamond',serif;
  font-style:italic; font-weight:500; color:var(--asq-champagne); font-size:23px; }
#asqContent .subtitle .orn { color:var(--asq-gold); font-style:normal; font-size:.62em; transform:translateY(1px); }
#asqContent .head-rule { width:min(320px,72%); margin:20px auto 0; height:12px; position:relative; }
#asqContent .head-rule::before { content:""; position:absolute; left:0; right:0; top:5px; height:1px;
  background:linear-gradient(90deg,transparent,var(--asq-hairline) 18%,var(--asq-hairline) 82%,transparent); }
#asqContent .head-rule::after { content:"\25C6"; position:absolute; left:50%; top:0; transform:translateX(-50%); color:var(--asq-gold);
  font-size:9px; background:var(--asq-bg); padding:0 8px; line-height:12px; }
#asqContent section { margin-top:42px; }
#asqContent h2 { font-family:'Cormorant Garamond',serif; font-weight:700; color:var(--asq-gold); font-size:26px; line-height:1.25;
  letter-spacing:.14em; text-transform:uppercase; margin-bottom:16px; }
#asqContent .reading-copy p { font-size:22px; line-height:1.65; color:var(--asq-ivory); margin-bottom:18px; text-shadow:0 1px 2px rgba(0,0,0,.5); }
#asqContent .reading-copy p:last-child { margin-bottom:0; }
#asqContent .divider { margin:40px auto 0; width:100%; height:12px; position:relative; }
#asqContent .divider::before { content:""; position:absolute; left:0; right:0; top:5px; height:1px;
  background:linear-gradient(90deg,transparent,var(--asq-hairline) 20%,var(--asq-hairline) 80%,transparent); }
#asqContent .divider::after { content:"\25C6"; position:absolute; left:50%; top:0; transform:translateX(-50%); color:var(--asq-gold);
  font-size:9px; background:var(--asq-bg); padding:0 8px; line-height:12px; }
#asqNav { position:fixed; left:0; right:0; bottom:0; z-index:40; height:calc(var(--asq-nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom); background:rgba(8,11,17,.86); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-top:1px solid rgba(201,161,94,.18); display:flex; opacity:0; pointer-events:none; transition:opacity .8s ease; }
body.asq-done #asqNav { opacity:1; pointer-events:auto; }
#asqNav a { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; text-decoration:none;
  color:#8b8272; font-size:10.5px; letter-spacing:.06em; font-family:'EB Garamond',serif; }
#asqNav a svg { width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; }
#asqNav a.active { color:var(--asq-gold); }
@media (prefers-reduced-motion: reduce) { #asqHero.settling { transition:none; } #asqContent.rising { transition:none; } }

/* ---------- dashboard pinch zoom (Sep 1): the landing eases to --dash-zoom-in, which
   pushes the bottom nav pill below the screen; two fingers now zoom the art between
   the whole frame (1) and the landing (--dash-zoom-in) so Home, Saved and Account can
   always be reached. Native browser zoom stays off. ---------- */
.dash { touch-action: none; }
.dash.pinching .stage { transition: none; }

  /* skip-ahead (Sep 1 ruling): subtle gold text, never a button. Appears only on
     a device that has already been through the experience once. */
  .coz-skip { position:fixed; top:calc(env(safe-area-inset-top) + 16px); right:18px; z-index:9999;
    font-family:-apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; font-size:11px; letter-spacing:0.16em;
    text-transform:uppercase; color:rgba(201,161,94,0.55); background:transparent; border:0; padding:10px 6px;
    opacity:0; pointer-events:none; transition:opacity 0.9s ease; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .coz-skip.on { opacity:1; pointer-events:auto; }
  .coz-skip:active { color:rgba(233,215,174,0.9); }

/* one-finger pan (Sep 1): when the dashboard is zoomed in, dragging moves the art up
   and down within its edges so the bottom nav pill can be pulled into view */
.stage { transform: translate(-50%, calc(-50% + var(--dash-pan, 0px))) scale(var(--dash-zoom, 1)); }
.dash.panning .stage { transition: none; }
@keyframes cozPageIn { from { opacity: 0; } to { opacity: 1; } }
body[data-view="reading"] .vedic-reading-page { animation: none; }
.reveal-curtain { transition: opacity 1400ms ease-in-out; }

/* through the sun (Sep 1 ruling): after the burst the camera keeps going, the sun
   fills the screen with light and the reading emerges out of it */
/* the sun sits at 40.6% of the clip height (measured on the last frame): the drive scales about it */
.reveal.is-through .stage { transform-origin: 50% 40.6%; transition: transform 3200ms cubic-bezier(0.42, 0, 0.9, 0.35), transform-origin 0s;
  /* the sun is carried to the exact screen centre while the stage grows about it */
  transform: translate(-50%, calc(-50% + 9.4%)) scale(calc(var(--dash-zoom, 1) * 5.5)); }
.reveal.is-through .reveal-curtain { background: radial-gradient(circle at 50% 50%, #fff6df 0%, #f1d9a6 45%, #e4b978 100%); transition: opacity 1400ms ease-in; }
#cozLight { position: fixed; inset: 0; z-index: 90; pointer-events: none; opacity: 0;
  background: radial-gradient(circle at 50% 42%, #fff6df 0%, #f1d9a6 45%, #e4b978 100%); transition: opacity 1800ms ease-out; }
#cozLight.on { opacity: 1; transition: none; }
/* text zoom (Sep 1 ruling): wherever there is reading text, two fingers scale it up
   to 2x and back; the text reflows, nothing else on the page zooms */
#vedicContent, #asqContent .wrap { zoom: var(--coz-text-zoom, 1); }
</style>
</head>
<body data-view="dashboard">

<div class="vedic-bg" aria-hidden="true"></div>

<!-- ===== PAID DASHBOARD ===== -->
<div class="dash" id="dash" aria-label="Your Vedic reading dashboard">
  <div class="stage" id="dashStage">
    <img class="stage-art" src="vedic-dash.jpg?v=24" alt="" width="1068" height="1940">
    <div class="asc-patch asc-patch-glyph" aria-hidden="true"></div>
    <div class="asc-patch asc-patch-text" aria-hidden="true"></div>
    <div class="asc-glyph" aria-hidden="true"></div>

<script src="dev-review-engine.js?v=5"></script>
<script>
/* ============================================================
   SECTION DATA (spec, verbatim)
   ============================================================ */
const vedicReadingSections = [
  { id: "essential-nature",        number: 1, title: "Your Essential Nature & Guiding Planet",      nextLabel: "Your Mind, Intuition & Spiritual Patterning" },
  { id: "mind-intuition",          number: 2, title: "Your Mind, Intuition & Spiritual Patterning", nextLabel: "Relationships, Desire & Karmic Exchange" },
  { id: "relationships-karmic",    number: 3, title: "Relationships, Desire & Karmic Exchange",     nextLabel: "Dharma, Work & Life Direction" },
  { id: "dharma-direction",        number: 4, title: "Dharma, Work & Life Direction",               nextLabel: "Rahu & Ketu — Growth, Release & Balance" },
  { id: "rahu-ketu",               number: 5, title: "Rahu & Ketu — Growth, Release & Balance",     nextLabel: "Your Essential Takeaway" },
  { id: "essential-takeaway",      number: 6, title: "Your Essential Takeaway",                     nextLabel: null }
];
const SECTION_TOTAL = String(vedicReadingSections.length).padStart(2, "0");

/* ============================================================
   READING SOURCE — DEVELOPMENT-REVIEW BUILD (v20.0)
   No fixture, no localStorage, no server, no AI call. The chart
   computed by sidereal-reveal.html arrives via postMessage from the
   parent (index.html), which is the one document that survives the
   iframe swap and holds it only as a JS variable in memory. This
   page asks for it, matches it against the real Section 1 + Section
   2 application-claims records (dev-review-engine.js), and shows a
   plain calculated-fact placeholder for Sections 3-6 unless the
   chart's identity exactly matches one of the two hand-reviewed
   reference charts. Every reading from this build is a
   development-review draft, pending Nina's review -- never a
   production-verified reading.
   ============================================================ */
function requestChartData() {
  /* v20.1 fix: chart data arrives via the ?cd= URL parameter, set by index.html's
     GOTO_VEDIC handler directly from sidereal-reveal.html's GOTO_VEDIC message.
     (An earlier round also wired a postMessage round-trip for this, but nothing
     ever sent the COZ_CHART_READY message that path depended on, so it always
     resolved null. Reading the URL directly is the same reliable pattern already
     used for birth data between index.html and sidereal-reveal.html.) */
  let chartData = null;
  try {
    chartData = JSON.parse(localStorage.getItem('cozChartJSON') || 'null');
  } catch(_){}
  return Promise.resolve(chartData);
}


/* ============================================================
   LIVE DRAFT GENERATOR (development review only, Sep 15 2026)
   Sections 3-6 written by the model for any chart that has no hand-reviewed
   draft. Direct browser call to the Anthropic API using the person's own
   test key (stored only in this browser's localStorage by test-index.html).
   Output is labeled unverified development copy. Cached per chart so a
   reload never re-spends. Prompt + raw response kept in COZ_VEDIC_GEN_TRACE.
   ============================================================ */
var COZ_GEN_SYSTEM = [
"You write the Vedic reading for CozAlyze. You are writing Sections 3 through 6 of a six-section reading. Sections 1 and 2 are already written and given to you; continue them, do not restate them.",
"",
"VOICE. Sound like a person speaking, not a lecture. Establish the frame once with a phrase like 'your chart suggests' and then write with natural confidence; do not hedge every sentence. Roughly 7th to 8th grade reading level: familiar words, mostly short sentences (average well under 20 words), concrete human situations. No academic psychology, no vague filler ('a quieter thread underneath'), no sentence written only to fill space.",
"",
"PLAIN LANGUAGE. Planets appear only as influences ('Venus's influence', 'Saturn's influence'). Never house numbers, rulerships, aspects, 'sits in', sign relationships, or any technical mechanics. Do not name any nakshatra. Never use the word 'pada'. The reader never learns where a statement comes from.",
"",
"GROUNDING. Every claim must trace to the chart placements given. Every important conclusion needs two distinct chart factors behind it; single-factor conclusions take lighter language. Include contradicting or softening factors so the chart is not flattened. No biography, profession, or life events are known to you; never invent them. Never guarantee events; specificity comes from the nature of a pattern, where it operates, what strengthens or complicates it. No 6+ word phrase may repeat across sections.",
"",
"SECTION 3, Relationships, Desire & Karmic Exchange: discuss relationships directly, no mechanics lecture. Balanced framing: fairness and equal participation; shared values, money, family responsibilities, promises, communication as central; wanting problems addressed directly; honesty without needing to win; independence and closeness both needing room; practical commitment mattering as much as attraction. Never portray the person as selfish, controlling, manipulative, or careless. Do not moralize.",
"",
"SECTION 4, Dharma, Work & Life Direction: discuss purpose, abilities, working conditions and fields directly, no lecture. Must include: what kind of contribution feels purposeful; the person's strongest useful abilities; the working conditions those abilities need; specific reasonable fields (never guaranteed careers); the main work-related challenge; a practical direction for handling it.",
"",
"SECTION 5, Rahu & Ketu: OPEN by explaining what the nodes are: not physical bodies, the two points where the Moon's orbit crosses the Sun's path (the eclipse alignment); Rahu (North Node) and Ketu (South Node); in Vedic tradition Ketu points to gifts already carried into this life (familiar, available without much effort) and Rahu to what is being actively grown into (less familiar, more effort, real potential); one sentence on the push-pull is allowed. Then apply the specific placements without re-teaching. Use exactly two subheads, each as its own paragraph beginning with '## ': '## Rahu — Where Life Pulls You Forward' then '## Ketu — What You Already Carry'. Do not assert a universal growth-versus-release psychology as fact. No vague predictions like 'success may come'.",
"",
"SECTION 6, Your Essential Takeaway: pure synthesis of threads already in Sections 1 through 5. No new chart factor, no new technical explanation, not a repeat of earlier sentences. End with one practical direction.",
"",
"LENGTH. Sections 3, 4, 5: about 220 to 320 words each. Section 6: about 150 to 220 words. Do not pad.",
"",
"OUTPUT. Return ONLY a JSON object, no prose before or after, no code fences: {\"relationships-karmic\": [paragraph strings], \"dharma-direction\": [...], \"rahu-ketu\": [...], \"essential-takeaway\": [...]}. Each array holds plain paragraph strings; in rahu-ketu, the two subhead strings begin with '## '."
].join("\n");

function cozGenChartFacts(chart) {
  var S = ["Aries","Taurus","Gemini","Cancer","Leo","Virgo","Libra","Scorpio","Sagittarius","Capricorn","Aquarius","Pisces"];
  var H = ["1st","2nd","3rd","4th","5th","6th","7th","8th","9th","10th","11th","12th"];
  return (chart.planets || []).map(function (p) {
    return p.name + ": " + S[(p.signNumber || 1) - 1] + ", " + H[(p.house || 1) - 1] + " house" +
      (p.nakshatra ? ", nakshatra " + p.nakshatra + (p.pada ? " pada " + p.pada : "") : "");
  }).join("\n");
}
function cozGenUsageLine() {
  var t = window.COZ_VEDIC_GEN_TRACE; if (!t) return "";
  var c = (t.estimatedCostUSD != null) ? "$" + t.estimatedCostUSD.toFixed(4) : "n/a";
  return '<p style="text-align:center;font-size:12px;color:var(--vedic-gold-muted);margin:0 0 10px">' +
    esc(t.model) + " · in " + (t.inputTokens || 0) + " · out " + (t.outputTokens || 0) + " tokens · est. " + c +
    (t.fromCache ? " · from cache (no new charge)" : " · generated now") + "</p>";
}
function cozGenHash(s) { var h = 0; for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; } return (h >>> 0).toString(36); }

function generateSections3to6(chart, reading12, firstName) {
  var key = null, model = "claude-sonnet-4-6";
  try { key = localStorage.getItem("cozTestApiKey"); model = localStorage.getItem("cozTestModel") || model; } catch (_) {}
  if (!key) return Promise.reject(new Error("No API key set. Open test-index.html and enter your test key first."));

  var facts = cozGenChartFacts(chart);
  var cacheKey = "cozGenDraft:" + cozGenHash(facts + "|" + (firstName || "") + "|" + model);
  try {
    var cached = JSON.parse(localStorage.getItem(cacheKey) || "null");
    if (cached && cached.sections) { cached.trace.fromCache = true; return Promise.resolve(cached); }
  } catch (_) {}

  var userMsg = [
    "Chart (sidereal, Lahiri, whole sign):",
    facts,
    "",
    "Name for the reading: " + (firstName || "(none; do not use a name)") + ". Do not use the name in Sections 3 through 6.",
    "",
    "SECTION 1 (already written):",
    (reading12["essential-nature"] || []).join("\n\n"),
    "",
    "SECTION 2 (already written):",
    (reading12["mind-intuition"] || []).join("\n\n"),
    "",
    "Write Sections 3, 4, 5, 6 now. JSON only."
  ].join("\n");

  var body = { model: model, max_tokens: 4000, system: COZ_GEN_SYSTEM, messages: [{ role: "user", content: userMsg }] };
  try { window.COZ_VEDIC_READING_STATUS = "preparing"; window.dispatchEvent(new CustomEvent("COZ_VEDIC_READING_STATUS")); } catch (_) {}

  return fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "x-api-key": key,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
      "content-type": "application/json"
    },
    body: JSON.stringify(body)
  }).then(function (r) {
    return r.text().then(function (t) {
      if (!r.ok) throw new Error("API " + r.status + ": " + t.slice(0, 300));
      return JSON.parse(t);
    });
  }).then(function (data) {
    var text = (data.content || []).filter(function (b) { return b.type === "text"; }).map(function (b) { return b.text; }).join("\n");
    var clean = text.replace(/^```(?:json)?\s*/i, "").replace(/\s*```\s*$/, "").trim();
    var s = clean.indexOf("{"), e = clean.lastIndexOf("}");
    if (s < 0 || e < 0) throw new Error("Model did not return JSON. Raw: " + text.slice(0, 200));
    var sections = JSON.parse(clean.slice(s, e + 1));
    ["relationships-karmic","dharma-direction","rahu-ketu","essential-takeaway"].forEach(function (id) {
      if (!Array.isArray(sections[id]) || !sections[id].length) throw new Error("Model output missing section: " + id);
    });
    var u = data.usage || {}, inTok = u.input_tokens || 0, outTok = u.output_tokens || 0;
    var PRICE = { input: 3.00, output: 15.00 };   /* USD per million tokens, Sonnet 4.x list price */
    var cost = inTok / 1e6 * PRICE.input + outTok / 1e6 * PRICE.output;
    var out = { sections: sections, trace: { model: model, generatedAt: new Date().toISOString(), usage: data.usage || null,
      inputTokens: inTok, outputTokens: outTok, estimatedCostUSD: Math.round(cost * 10000) / 10000,
      chartFacts: facts, systemPrompt: COZ_GEN_SYSTEM, userMessage: userMsg, rawResponse: text, fromCache: false } };
    try { localStorage.setItem(cacheKey, JSON.stringify(out)); } catch (_) {}
    return out;
  }).finally(function () {
    try { window.COZ_VEDIC_READING_STATUS = "ready"; window.dispatchEvent(new CustomEvent("COZ_VEDIC_READING_STATUS")); } catch (_) {}
  });
}

function fetchJSON(path) {
  return fetch(path).then(function (r) {
    if (!r.ok) throw new Error("fetch failed (" + r.status + "): " + path);
    return r.text().then(function (t) {
      try { return JSON.parse(t); }
      catch (pe) { throw new Error("NOT JSON: " + path + " starts with: " + JSON.stringify(t.slice(0, 60))); }
    });
  });
}

var COZ_READING_READY = requestChartData().then(function (chart) {
  if (!chart || !chart.planets) { window.COZ_VEDIC_READING_UNAVAILABLE = true; window.COZ_VEDIC_DEBUG = "No chart in localStorage.cozChartJSON (got: " + JSON.stringify(chart).slice(0,80) + ")"; return; }
  var SECTION1_FILES = [
    "application-claims-s1-ascendant-lord-houses-batch2.json",
    "application-claims-s1-ascendant-signs-batch2.json",
    "application-claims-s1-guiding-planets-batch1.json",
    "application-claims-s1-hidden-role-fixture-batch1.json",
    "application-claims-s1-v26-compiled-overlay.json"
];
  var SECTION2_FILES = [
    "application-claims-chicago.json",
    "application-claims-denver.json",
    "application-claims-moon-houses-phase3-batch1.json",
    "application-claims-moon-signs-phase3-batch2.json",
    "application-claims-nakshatras-phase3-batch3a.json",
    "application-claims-nakshatras-phase3-batch3b.json",
    "application-claims-nakshatras-phase3-batch3c.json",
    "application-claims-nakshatras-phase3-batch3d.json",
    "application-claims-padas-batch4a.json",
    "application-claims-padas-batch4b.json",
    "application-claims-padas-batch4c.json",
    "application-claims-padas-batch4d.json",
    "application-claims.json"
];
  return Promise.all([
    Promise.all(SECTION1_FILES.map(function (f) { return fetchJSON(f); })),
    Promise.all(SECTION2_FILES.map(function (f) { return fetchJSON(f); })),
    fetchJSON("section3-6-review-drafts.json")
  ]).then(function (results) {
    var claimData = { section1Files: results[0], section2Files: results[1] };
    var snippets36 = results[2];
    if (!window.CozDevReview) throw new Error("dev-review-engine.js did not load (window.CozDevReview missing)");
    var firstName = chart.person && chart.person.name;
    var result = window.CozDevReview.generateDevReview(chart, claimData, snippets36, firstName);
    window.COZ_VEDIC_REVIEW_META = result.meta;
    var hasReviewed = !/no identity match/i.test(String(result.meta.sections3to6Source || ""));
    if (hasReviewed) { if (result.meta.sections3to6Unverified) result.reading._generated36 = true; window.COZ_VEDIC_READING = result.reading; return; }
    /* No hand-reviewed draft for this chart: generate Sections 3-6 as unverified
       development copy so every chart produces all six sections. */
    return generateSections3to6(chart, result.reading, firstName).then(function (gen) {
      var reading = Object.assign({}, result.reading, gen.sections);
      reading._generated36 = true;
      window.COZ_VEDIC_READING = reading;
      window.COZ_VEDIC_GEN_TRACE = gen.trace;
      try { console.log("[COZ GEN TRACE]", JSON.stringify(gen.trace)); } catch (_) {}
    });
  }).catch(function (e) {
    console.log("[EMERGE FLOW] dev-review generation failed:", e);
    window.COZ_VEDIC_READING_UNAVAILABLE = true;
    window.COZ_VEDIC_DEBUG = "Generation error: " + (e && ((e.message || String(e)) + " @ " + (e.stack || "")));
  });
});

function loadReading() {
  if (window.COZ_VEDIC_READING && typeof window.COZ_VEDIC_READING === "object") return window.COZ_VEDIC_READING;
  return null;
}

/* ============================================================
   NAVIGATION TARGETS
   The dashboard lives in THIS document at #/dashboard, so going
   back never leaves the page.
   ============================================================ */
const params = new URLSearchParams(location.search);
const DASHBOARD_HREF = "#/dashboard";

function goDashboard() {
  if (idFromHash() === "dashboard") showFromHash(); else location.hash = DASHBOARD_HREF;
}

function finishReading() {
  try { localStorage.setItem("cozVedicReadingComplete", new Date().toISOString()); } catch (e) {}
  try { window.dispatchEvent(new CustomEvent("COZ_VEDIC_READING_COMPLETE")); } catch (e) {}
  goDashboard();
}

/* ============================================================
   RENDER
   ============================================================ */
const STAR_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0 13.6 10.4 24 12 13.6 13.6 12 24 10.4 13.6 0 12 10.4 10.4Z"/></svg>';
const ARROW_L = '<svg viewBox="0 0 22 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 7H2M7 2 2 7l5 5"/></svg>';
const ARROW_R = '<svg viewBox="0 0 22 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 7h19M15 2l5 5-5 5"/></svg>';

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function sectionById(id) { return vedicReadingSections.find(s => s.id === id) || vedicReadingSections[0]; }

function renderSection(section) {
  const reading = loadReading();
  const paragraphs = Array.isArray(reading[section.id]) ? reading[section.id] : [];
  const sectionCounter = `${String(section.number).padStart(2, "0")} OF ${SECTION_TOTAL}`;
  const titleClass = section.title.length > 22 ? "vedic-title vedic-title--long" : "vedic-title";
  const next = section.nextLabel ? vedicReadingSections[section.number] : null;

  const nextControl = next
    ? `<a class="vedic-nav-next" href="#/${next.id}" data-next="${next.id}">Next: ${esc(section.nextLabel)} ${ARROW_R}</a>`
    : `<button class="vedic-nav-next" type="button" id="vedicFinish">Finish Reading ${ARROW_R}</button>`;

  const html = `
    <header class="vedic-header">
      <img class="vedic-logo" src="vedic-logo.png" alt="CozAlyze" width="1000" height="1055">
      <p class="vedic-eyebrow">Your Vedic Reading \u00B7 Development-Review Draft</p>
      <p class="vedic-counter">${sectionCounter}</p>
    </header>
    <div class="vedic-divider" aria-hidden="true">${STAR_SVG}</div>
    <h1 class="${titleClass}">${esc(section.title)}</h1>
    <div class="vedic-divider" aria-hidden="true">${STAR_SVG}</div>
    ${(section.number >= 3 && reading._generated36) ? '<p style="text-align:center;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--vedic-gold-muted);margin:0 0 6px">Unverified development copy · generated for review</p>' + cozGenUsageLine() : ''}
    <section class="vedic-body">
      ${paragraphs.map(p => p.startsWith("## ")
        ? `<h3 class="vedic-subhead">${esc(p.slice(3))}</h3>`
        : `<p>${esc(p)}</p>`).join("")}
    </section>
    <nav class="vedic-nav" aria-label="Reading navigation">
      <div class="vedic-nav-rule" aria-hidden="true">${STAR_SVG}</div>
      <div class="vedic-nav-links">
        <a href="#/dashboard" id="vedicNavBack">${ARROW_L} Back to Your Reading</a>
        ${nextControl}
      </div>
    </nav>`;

  const old = document.getElementById("vedicContent");
  const fresh = old.cloneNode(false);      // fresh node so the fade re-runs on every section
  fresh.innerHTML = html;
  old.replaceWith(fresh);

  document.title = `${section.title} · Your Vedic Reading · CozAlyze`;

  const finish = document.getElementById("vedicFinish");
  if (finish) finish.addEventListener("click", finishReading);
}

/* Shown instead of the six sections when no chart data reaches this page
   (e.g. the parent never received a calculated chart) or generation genuinely
   fails. Never populates any section content, never falls back to any fixed
   sample reading. */
function renderUnavailableNotice() {
  const html = `
    <header class="vedic-header">
      <img class="vedic-logo" src="vedic-logo.png" alt="CozAlyze" width="1000" height="1055">
      <p class="vedic-eyebrow">Your Vedic Reading \u00B7 Development Preview</p>
    </header>
    <div class="vedic-divider" aria-hidden="true">${STAR_SVG}</div>
    <section class="vedic-body">
      <p>This chart was calculated successfully. A full composed reading has not yet been generated for this development sample.</p>
      <p style="font-size:14px;opacity:.7;word-break:break-all">DEBUG: ${esc(window.COZ_VEDIC_DEBUG || "no debug info captured")}</p>
      <p><button type="button" id="vedicRetry" class="vedic-nav-next">Try again</button></p>

/* timers that depend on the clip actually running start only once it is playing */

  if (revealStarted || !revealActive) return;
  revealStarted = true;
  // the live ascendant overlay stays while the buttons are still on screen, then lets go before the burst
  revealTimers.push(setTimeout(() => revealEl.classList.add("asc-off"), 1450));
  /* Sep 1 ruling: ONE motion. The drive into the sun begins while the burst is still
     blooming, the light takes the screen while the stage is still growing, the page
     lands under the light and the light clears. No hold anywhere. */
  revealTimers.push(setTimeout(() => revealEl.classList.add("is-through"), 1500));
  revealTimers.push(setTimeout(() => revealEl.classList.add("is-closing"), 3100));
  revealTimers.push(setTimeout(() => finishReveal("through"), 4500));
  // hard cap a little past the clip's 2.5s so a stalled clip never traps anyone
  revealTimers.push(setTimeout(() => finishReveal(false), 5200));   /* stall guard only */   /* the clip ends first; this only catches a stall */
});

function finishReveal(immediate) {
  if (!revealActive || revealDone) return;   // ignore clip events while the reveal is not running
  revealDone = true;
  revealTimers.forEach(clearTimeout); revealTimers = [];
  const land = () => {
    const go = () => {
      location.hash = "#/essential-nature";          // its own history entry; renders via hashchange
      revealEl.classList.remove("is-on", "is-closing", "asc-off");
      try { revealVideo.pause(); } catch (e) {}
      lockScroll(false);
      revealActive = false;
      syncReadyState();
    };
    /* dev-review generation is async (chart request + local claim-file fetches);
       the reveal already runs several seconds so this normally resolves long
       before we get here, but we wait for it rather than risk a race. */
    if (COZ_READING_READY && typeof COZ_READING_READY.then === "function") {
      COZ_READING_READY.then(go).catch(go);
    } else {
      go();
    }
  };
  if (immediate === true) { land(); return; }
  /* Sep 1 ruling: through the sun. Hold on the burst, then the camera drives into it, the light
     fills the screen, the page lands underneath and the light clears to reveal the reading. */
  if (immediate === "through"){
    try { window.__cozLightIn(); } catch (e) {}
    land();
    revealEl.classList.remove("is-through");
    setTimeout(() => { try { window.__cozLightOut(); } catch (e) {} }, 350);
    return;
  }
  /* stall or error before the drive began: plain curtain */
  revealEl.classList.add("is-closing");
  setTimeout(land, 900);
}

function cancelReveal() {
  if (!revealActive || revealDone) return;
  revealDone = true;
  revealTimers.forEach(clearTimeout); revealTimers = [];
  try { revealVideo.pause(); revealVideo.currentTime = 0; } catch (e) {}
  revealEl.classList.remove("is-on", "is-closing", "is-through", "asc-off");
  lockScroll(false);
  revealActive = false;
  syncReadyState();
}

    } else {
      /* tropical: the sign emergence and title only; the Rising Sign copy for this
         page is not written yet (his lane), so no Lagna text is shown here */
      document.getElementById("asqEyebrow").textContent = "Your Rising Sign";
      document.getElementById("asqSub").textContent = "Your Conscious Expression";
    }
  }
  function enter(){
    if (entered) return; entered = true;
    try { window.parent !== window && window.parent.EMERGE_SOUND && window.parent.EMERGE_SOUND.loop("ambient"); } catch(_){}
    buildCopy();
    sVid.src = (MODE === "vedic" ? "sidereal-ascendant-" : "") + key + ".mp4";
    /* v1.2 correction: the tropical branch here was guessed as "tropical-ascendant-"
       before confirming what actually exists in the repo. It turns out the original
       bare-named files (aries.mp4, leo.mp4, etc., already in master) ARE the tropical
       set — they only ever collided with Vedic because vedic-reading.html used to read
       those same bare names too. Now that Vedic reads sidereal-ascendant-<sign>.mp4
       exclusively, the bare names are safely tropical-only, unchanged, no re-upload
       needed. */
    if (S && S.loop) sVid.loop = true; sVid.load();
    document.body.dataset.view = "ascendant";
    document.body.classList.add("asq-locked");
    window.scrollTo(0, 0);
    veil.classList.add("on");
    setTimeout(() => { playSign(); setTimeout(() => veil.classList.remove("on"), 150); }, 300);   // black beat, then the swell
  }
  function playSign(){
    hero.classList.add("bloom");
    void sVid.offsetWidth;                                    // commit scale .06 before growing
    requestAnimationFrame(() => { hero.classList.add("playing"); hero.classList.add("grown"); });
    const arm = once(scheduleSettle);
    sVid.addEventListener("loadedmetadata", arm);
    if (sVid.readyState >= 1) arm();
    sVid.addEventListener("error", () => settle());
    sVid.play().catch(() => settle());
    setTimeout(() => { if (!settled) settle(); }, 9000);
  }
  function scheduleSettle(){
    const dur = (sVid.duration && isFinite(sVid.duration)) ? sVid.duration : 5;
    if (S && S.loop){ setTimeout(settle, Math.max(1000, dur * 1000)); }
    else {
      sVid.addEventListener("ended", settle, { once:true });
      sVid.addEventListener("timeupdate", function te(){ if (sVid.currentTime >= dur - 1.0){ sVid.removeEventListener("timeupdate", te); settle(); } });
      setTimeout(() => { if (!settled) settle(); }, dur * 1000 + 1500);
    }
  }
  function settle(){
    if (settled) return; settled = true;
    const vw = document.documentElement.clientWidth;
    const ar = (sVid.videoWidth && sVid.videoHeight) ? sVid.videoWidth / sVid.videoHeight : 1.25;
    /* Sep 1 ruling: after the full-screen emergence the sign settles into the top third of the
       screen (never taller), so the reading beneath it is easy to read; the clip keeps playing */
    const settledH = Math.min(Math.round(vw / ar), Math.round(window.innerHeight * 0.36));
    document.documentElement.style.setProperty("--settled-h", settledH + "px");
    const finish = once(() => {
      document.body.classList.add("asq-done"); document.body.classList.remove("asq-locked");
      hero.classList.remove("settling"); content.classList.remove("rising");
      hero.style.height = ""; content.style.transform = "";
      try { window.dispatchEvent(new CustomEvent("EMERGE_ASCENDANT_SETTLED", { detail:{ sign:key } })); } catch(_){}
    });
    if (reduced){ finish(); return; }
    content.style.transform = "translateY(" + window.innerHeight + "px)";
    content.classList.add("rising");
    requestAnimationFrame(() => requestAnimationFrame(() => {
      hero.classList.add("settling"); hero.style.height = settledH + "px";
      content.style.transform = "translateY(" + settledH + "px)";
    }));
    content.addEventListener("transitionend", finish, { once:true });
    setTimeout(finish, 3000);
  }
  document.querySelector('.hot[data-dash="ascendant"]').addEventListener("click", enter);
  /* SKIP (Sep 1 ruling): from the second emergence on this device, a subtle Skip
     appears a moment into the swell and jumps to the settled reading */
  (function(){
    var KEY = "cozSeenAsc_" + MODE, seen = false;
    try { seen = localStorage.getItem(KEY) === "1"; } catch(_){}
    var el = document.createElement("button"); el.type = "button"; el.className = "coz-skip asq"; el.textContent = "Skip"; el.setAttribute("aria-label", "Skip to the reading");
    document.body.appendChild(el);
    window.addEventListener("EMERGE_ASCENDANT_SETTLED", function(){ try { localStorage.setItem(KEY, "1"); } catch(_){} el.classList.remove("on"); });
    el.addEventListener("click", function(){ el.classList.remove("on"); hero.classList.remove("bloom"); hero.classList.add("playing"); settle(); });
    document.querySelector('.hot[data-dash="ascendant"]').addEventListener("click", function(){ if (seen) setTimeout(function(){ if (!settled) el.classList.add("on"); }, 1800); });
  })();
  document.getElementById("asqHome").addEventListener("click", function(e){
    e.preventDefault();
    location.hash = "#/dashboard";
    location.reload();                                        // back to the dashboard; the frame's bed is untouched
  });
})();

/* ---------- dashboard pinch zoom (Sep 1) ---------- */
(function(){
  const dash = document.getElementById("dash"), root = document.documentElement;
  let active = false, startD = 0, startZ = 1, maxZ = 1.3;
  const cur = () => parseFloat(getComputedStyle(root).getPropertyValue("--dash-zoom")) || 1;
  const dist = e => Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  dash.addEventListener("touchstart", e => {
    if (e.touches.length !== 2) return;
    active = true; startD = dist(e) || 1; startZ = cur();
    maxZ = parseFloat(getComputedStyle(root).getPropertyValue("--dash-zoom-in")) || 1.3;
    dash.classList.add("pinching"); window.__dashZoomed = true;
  }, { passive:true });
  dash.addEventListener("touchmove", e => {
    if (!active || e.touches.length !== 2) return;
    e.preventDefault();
    const z = Math.min(maxZ, Math.max(1, startZ * (dist(e) / startD)));
    root.style.setProperty("--dash-zoom", z.toFixed(3));
  }, { passive:false });
  const end = () => { if (!active) return; active = false; dash.classList.remove("pinching"); };
  dash.addEventListener("touchend", end); dash.addEventListener("touchcancel", end);
})();

/* ---------- reveal sound (Sep 1): the reading tap fires the app's harmony cue through
   the living frame's engine and re-asserts the bed, the same way the old Vedic page did ---------- */
document.getElementById("hotReading").addEventListener("click", function(){
  try {
    const snd = (window.parent !== window) ? window.parent.EMERGE_SOUND : null;
    if (snd){ snd.loop("ambient"); snd.play("harmony"); }
  } catch(_){}
});


/* zoom lock (Sep 1): iOS lets a two-finger pinch zoom the whole page even with
   user-scalable=no, and that zoom survives a reload, which is what threw the globe
   off on the second run. Native page zoom is refused here; the dashboards keep
   their own two-finger art zoom. */
(function(){
  ['gesturestart','gesturechange','gestureend'].forEach(function(t){ document.addEventListener(t, function(e){ e.preventDefault(); }, { passive:false }); });
  document.addEventListener('touchmove', function(e){ if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive:false });
})();

/* ---------- one-finger pan on the zoomed dashboard (Sep 1) ---------- */
(function(){
  const dash = document.getElementById("dash"), stage = document.getElementById("dashStage"), root = document.documentElement;
  let panning = false, startY = 0, startPan = 0, moved = false;
  const zoom = () => parseFloat(getComputedStyle(root).getPropertyValue("--dash-zoom")) || 1;
  const pan = () => parseFloat(getComputedStyle(root).getPropertyValue("--dash-pan")) || 0;
  const limit = () => Math.max(0, (stage.offsetHeight * zoom() - window.innerHeight) / 2);
  dash.addEventListener("touchstart", e => {
    if (e.touches.length !== 1 || zoom() <= 1.001) return;
    panning = true; moved = false; startY = e.touches[0].clientY; startPan = pan();
  }, { passive:true });
  dash.addEventListener("touchmove", e => {
    if (!panning || e.touches.length !== 1) return;
    const dy = e.touches[0].clientY - startY;
    if (Math.abs(dy) > 6) moved = true;
    if (!moved) return;
    e.preventDefault(); dash.classList.add("panning");
    const L = limit(); const y = Math.max(-L, Math.min(L, startPan + dy));
    root.style.setProperty("--dash-pan", y.toFixed(1) + "px");
  }, { passive:false });
  const end = () => { panning = false; dash.classList.remove("panning"); };
  dash.addEventListener("touchend", end); dash.addEventListener("touchcancel", end);
  /* a real drag must not count as a tap on the hotspot underneath */
  dash.addEventListener("click", e => { if (moved){ e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
})();


/* ---------- through the sun + text zoom (Sep 1) ---------- */
(function(){
  const light = document.createElement("div"); light.id = "cozLight"; document.body.appendChild(light);
  window.__cozLightIn  = () => { light.classList.add("on"); };
  window.__cozLightOut = () => { requestAnimationFrame(() => requestAnimationFrame(() => light.classList.remove("on"))); };
})();
(function(){
  const root = document.documentElement;
  let active = false, startD = 0, startZ = 1;
  const inText = () => document.body.dataset.view === "reading" || document.body.dataset.view === "ascendant";
  const cur = () => parseFloat(getComputedStyle(root).getPropertyValue("--coz-text-zoom")) || 1;
  const dist = e => Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  document.addEventListener("touchstart", e => { if (!inText() || e.touches.length !== 2) return; active = true; startD = dist(e) || 1; startZ = cur(); }, { passive:true });
  document.addEventListener("touchmove", e => {
    if (!active || e.touches.length !== 2) return;
    e.preventDefault();
    const z = Math.min(2, Math.max(1, startZ * (dist(e) / startD)));
    root.style.setProperty("--coz-text-zoom", z.toFixed(3));
  }, { passive:false });
  const end = () => { active = false; };
  document.addEventListener("touchend", end); document.addEventListener("touchcancel", end);
})();

</script>
