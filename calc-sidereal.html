<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>EMERGE — Sidereal v4.8</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%;
    height:100dvh;
    overflow:hidden;
    background:#04060d;
    position:fixed; inset:0;
    touch-action:none;
    overscroll-behavior:none;
    font-family:Georgia, "Times New Roman", serif;
  }
  #stage { position:fixed; inset:0; width:100%; height:100dvh; z-index:0; }
  canvas { display:block; }

  #whisper {
    position:fixed;
    left:50%; top:42%;
    transform:translate(-50%,-50%);
    z-index:15;
    color:rgba(226,196,122,0.85);
    font-family:-apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
    font-size:clamp(17px, 4.7vw, 20px); font-weight:300;   /* v18.51: was 15px */
    letter-spacing:0.28em;
    text-transform:lowercase;
    text-align:center; width:92vw;
    opacity:0;
    transition:opacity 2.2s ease;
    pointer-events:none;
  }
  #whisper.show { opacity:1; }

  /* v-sound-gate: the page arrives dark and still; a tap begins the drawing */
  #soundGate {
    position:fixed;
    left:50%; top:50%;
    transform:translate(-50%,-50%);
    z-index:16;
    color:rgba(226,196,122,0.9);
    font-family:-apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
    font-size:clamp(17px, 4.7vw, 20px); font-weight:300;   /* v18.51: was 15px */
    letter-spacing:0.28em;
    text-transform:lowercase;
    text-align:center; width:92vw;
    opacity:0;
    pointer-events:none;
    transition:opacity 1.1s ease;
  }
  #soundGate.armed {
    animation:gateIn 2.4s ease 0.6s forwards, gateBreathe 4.2s ease-in-out 3s infinite;
  }
  #soundGate.gone { opacity:0 !important; animation:none; }
  @keyframes gateIn { to { opacity:1; } }
  @keyframes gateBreathe { 0%,100% { opacity:1; } 50% { opacity:0.55; } }

  /* locate beat */
  #locate {
    position:fixed; inset:0; z-index:12;
    pointer-events:none;
  }
  #locate .h, #locate .v {
    position:absolute;
    background:linear-gradient(90deg, transparent, rgba(224,180,100,0.75), transparent);
    opacity:0;
  }
  #locate .h { left:0; width:100%; height:1px; top:50%; }
  #locate .v { top:0; height:100%; width:1px; left:50%;
    background:linear-gradient(180deg, transparent, rgba(224,180,100,0.75), transparent); }
  #locate .ring {
    position:absolute; left:50%; top:50%;
    width:180px; height:180px;
    margin:-90px 0 0 -90px;
    border:1px solid rgba(224,180,100,0.65);
    border-radius:50%;
    opacity:0;
    transform:scale(2.4);
  }
  #coords {
    position:fixed;
    left:50%; top:calc(50% + 120px);
    transform:translateX(-50%);
    z-index:13;
    color:rgba(232,214,170,0.9);
    font-family:-apple-system, "SF Pro Text", sans-serif;
    font-size:12.5px; font-weight:300;
    letter-spacing:0.28em;
    text-align:center;
    line-height:2.1;
    opacity:0;
    transition:opacity 1.4s ease;
    pointer-events:none;
    white-space:nowrap;
  }
  #coords.show { opacity:1; }
  #coords .place { font-size:11px; color:rgba(217,180,91,0.75); }

  /* chart */
  #chartWrap {
    position:fixed; inset:0; z-index:10;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none;
  }
  #chartWrap svg {
    width:min(94vw, 74dvh);
    height:min(94vw, 74dvh);
    overflow:visible;
  }

  /* QA */
  #qaToggle {
    position:fixed;
    left:10px;
    bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
    z-index:40;
    width:30px; height:30px;
    border-radius:50%;
    border:1px solid rgba(217,180,91,0.3);
    background:transparent;
    color:rgba(217,180,91,0.45);
    font-size:13px; line-height:1;
  }
  #qaToggle.err { border-color:#e0654f; color:#e0654f; }
  #qa {
    display:none;
    position:fixed;
    top:calc(env(safe-area-inset-top,0px) + 8px);
    left:8px; z-index:41;
    font-family:"SF Mono", Menlo, monospace;
    font-size:10px; line-height:1.5;
    color:#d9b45b;
    background:rgba(0,0,8,0.85);
    border:1px solid rgba(217,180,91,0.35);
    border-radius:8px;
    padding:8px 10px;
    max-width:86vw; white-space:pre;
    pointer-events:none;
  }
  #qa.open { display:block; }
  #qa .pass { color:#7fd98b; }
  #qa .fail { color:#e0654f; font-weight:bold; }

  #fatal {
    display:none;
    position:fixed; top:40%; left:50%;
    transform:translate(-50%,-50%);
    z-index:60;
    background:rgba(40,4,4,0.95);
    border:1px solid #e0654f;
    color:#ffd9d2;
    font-family:-apple-system, sans-serif;
    font-size:14px; line-height:1.5;
    padding:16px 20px; border-radius:10px;
    max-width:84vw; text-align:center;
  }
  #stamp { position:fixed; right:10px;
    bottom:calc(env(safe-area-inset-bottom,0px) + 12px); z-index:40;
    font-family:-apple-system, sans-serif; font-size:10px; letter-spacing:0.14em;
    color:rgba(217,180,91,0.5); pointer-events:none; }

  /* ============================================================
     NEW: 3D CHART SUMMARY REVEAL — styles
     ============================================================ */

  /* chart tilts back into space (transform on the existing svg only) */
  #chartWrap svg {
    transform: perspective(1400px) rotateX(0deg) translateY(0) translateZ(0) scale(1);
    transition: transform 1.5s cubic-bezier(0.22, 1, 0.36, 1);
  }
  body.tilt3d #chartWrap svg {
    transform: perspective(1400px) rotateX(52deg) translateY(-16vh) translateZ(-180px) scale(0.78);
  }
  @media (max-width:700px){
    body.tilt3d #chartWrap svg {
      transform: perspective(1200px) rotateX(44deg) translateY(-23vh) translateZ(-140px) scale(0.68);
    }
  }
  body.pulse #chartWrap svg { filter:brightness(1.28); }
  #chartWrap svg { transition: transform 1.5s cubic-bezier(0.22,1,0.36,1), filter 0.8s ease; }

  /* the room darkens */
  #dim {
    position:fixed; inset:0; z-index:6; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 50% 28%, rgba(2,4,9,0.15), rgba(1,2,6,0.55) 80%);
    transition:opacity 1.5s ease;
  }
  body.tilt3d #dim { opacity:1; }

  /* prompt: "Your chart is revealed." + REVEAL MY CHART */
  #revealPrompt {
    position:fixed; left:0; right:0; z-index:22;
    bottom:calc(env(safe-area-inset-bottom,0px) + 96px);   /* v19.73: raised well clear of the Safari toolbar */
    display:flex; flex-direction:column; align-items:center; gap:14px;
    opacity:0; pointer-events:none;
    transition:opacity 1.1s ease;
  }
  #revealPrompt.show { opacity:1; pointer-events:auto; }
  #revealPrompt.hide { opacity:0; pointer-events:none; transition:opacity 0.35s ease; }
  #revealPrompt .line {
    color:rgba(232,214,170,0.92);
    font-family:Georgia, serif; font-size:17px;
    letter-spacing:0.13em; text-align:center;
  }
  #revealBtn {
    position:relative; overflow:hidden; cursor:pointer;
    font-family:-apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
    font-size:14.5px; font-weight:400;
    letter-spacing:0.34em; text-indent:0.34em;
    color:#e6c887;
    background:rgba(8,10,16,0.55);
    border:1px solid rgba(214,181,104,0.75);
    border-radius:10px;
    padding:15px 30px 14px;
    box-shadow:0 0 22px rgba(201,168,76,0.14), inset 0 0 14px rgba(201,168,76,0.06);
    transition:transform 0.25s ease, box-shadow 0.45s ease;
    -webkit-user-select:none; user-select:none;
  }
  #revealBtn:active { transform:scale(1.01); box-shadow:0 0 30px rgba(201,168,76,0.22), inset 0 0 14px rgba(201,168,76,0.08); }
  #revealBtn:focus-visible { outline:2px solid rgba(230,200,135,0.85); outline-offset:3px; }
  #revealBtn .sweep {
    position:absolute; top:-0.5px; left:-40%; width:38%; height:1.5px;
    background:linear-gradient(90deg, transparent, rgba(255,232,177,0.95), transparent);
    opacity:0; pointer-events:none;
  }
  #revealBtn:hover .sweep, #revealBtn.touched .sweep { opacity:1; animation:borderSweep 1.5s ease-in-out; }
  @keyframes borderSweep { from { left:-40%; } to { left:105%; } }

  /* shaft of light from the Ascendant down to the field */
  #beam {
    position:fixed; z-index:9; left:50%; top:12%; height:52%;
    width:3px; transform:translateX(-50%);
    pointer-events:none; opacity:0;
    background:linear-gradient(180deg,
      rgba(255,236,190,0), rgba(255,231,178,0.85) 20%,
      rgba(224,180,100,0.5) 72%, rgba(224,180,100,0));
    filter:drop-shadow(0 0 6px rgba(255,225,160,0.8));
    transition:opacity 1.3s ease;
  }
  #beam::before {
    content:''; position:absolute; inset:0 -14px;
    background:linear-gradient(180deg,
      rgba(255,231,178,0), rgba(255,231,178,0.15) 30%,
      rgba(224,180,100,0.09) 72%, transparent);
    filter:blur(6px);
  }
  body.beamOn #beam { opacity:1; }
  body.rest #beam { opacity:0.26; }

  /* circular energy field beneath the chart */
  #field {
    position:fixed; z-index:7; left:50%; top:61%;
    width:min(86vw, 440px); aspect-ratio:1;
    transform:translate(-50%,-50%) perspective(900px) rotateX(72deg);
    pointer-events:none; opacity:0;
    transition:opacity 1.4s ease;
  }
  body.fieldOn #field { opacity:1; }
  body.rest #field { opacity:0.45; }
  #field .ring { position:absolute; border-radius:50%; border:1px solid rgba(224,180,100,0.5); }
  #field .r1 { inset:0;   animation:spinCW 26s linear infinite; box-shadow:0 0 18px rgba(201,168,76,0.18); }
  #field .r2 { inset:11%; border-color:rgba(224,180,100,0.34); animation:spinCCW 38s linear infinite; }
  #field .r3 { inset:24%; border-color:rgba(255,231,178,0.28); animation:spinCW 18s linear infinite; }
  #field .r1::before, #field .r3::before {
    content:''; position:absolute; left:50%; top:-2.5px;
    width:4px; height:4px; margin-left:-2px; border-radius:50%;
    background:#ffe9b0; box-shadow:0 0 8px rgba(255,231,178,0.9);
  }
  #field .glow {
    position:absolute; inset:6%; border-radius:50%;
    background:radial-gradient(circle, rgba(224,180,100,0.20), rgba(224,180,100,0.05) 46%, transparent 70%);
  }
  #field .sliver {
    position:absolute; left:50%; top:50%;
    width:min(56vw, 300px); height:2px;
    transform:translate(-50%,-50%) scaleX(0); opacity:0;
    background:linear-gradient(90deg, transparent, rgba(255,236,195,0.95), transparent);
    filter:blur(0.4px) drop-shadow(0 0 8px rgba(255,225,160,0.9));
  }
  body.sliver #field .sliver { animation:sliverFlash 1.1s ease-out forwards; }
  @keyframes sliverFlash {
    0%   { transform:translate(-50%,-50%) scaleX(0); opacity:0; }
    35%  { transform:translate(-50%,-50%) scaleX(1); opacity:1; }
    100% { transform:translate(-50%,-50%) scaleX(1); opacity:0; }
  }
  @keyframes spinCW  { to { transform:rotate(360deg); } }
  @keyframes spinCCW { to { transform:rotate(-360deg); } }

  /* gold particle canvas */
  #fx { position:fixed; inset:0; z-index:8; pointer-events:none; display:none; }
  body.fieldOn #fx { display:block; }

  /* the summary card */
  #summaryStage {
    position:fixed; inset:0; z-index:20;
    display:flex;
    padding:calc(env(safe-area-inset-top,0px) + 15vh) 5vw calc(env(safe-area-inset-bottom,0px) + 4vh);
    pointer-events:none;
  }
  #cardEmerge {
    opacity:0;
    transform:perspective(1200px) translateY(140px) translateZ(-260px) rotateX(72deg) scale(0.28);
    transition:transform 1.6s cubic-bezier(0.34, 1.22, 0.42, 1), opacity 1.1s ease;
    pointer-events:none;
  }
  body.cardUp #cardEmerge {
    opacity:1;
    transform:perspective(1200px) translateY(0) translateZ(0) rotateX(0deg) scale(1);
    pointer-events:auto;
  }
  #cardFloat.settled { animation:cardFloat 6.5s ease-in-out infinite; }
  @keyframes cardFloat { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-5px); } }

  .chart-summary-card {
    position:relative;
    width:min(620px, 72vw);
    border-radius:27px;
    padding:38px 42px 34px;
    text-align:center;
    border:1px solid rgba(214,181,104,0.72);
    background:
      radial-gradient(circle at 50% 0%, rgba(201,168,76,0.09), transparent 36%),
      linear-gradient(145deg, rgba(14,17,23,0.97), rgba(4,7,12,0.985));
    box-shadow:
      0 35px 90px rgba(0,0,0,0.72),
      0 0 36px rgba(201,168,76,0.13),
      inset 0 1px 0 rgba(255,232,177,0.16),
      inset 0 -22px 45px rgba(0,0,0,0.34);
    transform-style:preserve-3d;
  }
  .chart-summary-card::before {   /* faint topographic surface */
    content:''; position:absolute; inset:0; border-radius:inherit;
    background:
      repeating-radial-gradient(circle at 30% 18%, rgba(230,200,135,0.55) 0 1px, transparent 1px 27px),
      repeating-radial-gradient(circle at 80% 88%, rgba(230,200,135,0.45) 0 1px, transparent 1px 35px);
    opacity:0.04; pointer-events:none;
    animation:topoDrift 80s linear infinite alternate;
  }
  @keyframes topoDrift {
    from { background-position:0 0, 0 0; }
    to   { background-position:28px 16px, -22px -12px; }
  }
  .chart-summary-card::after {    /* reflected gold light beneath */
    content:''; position:absolute; left:8%; right:8%; bottom:-26px; height:26px;
    background:radial-gradient(ellipse at center, rgba(224,180,100,0.22), transparent 70%);
    filter:blur(8px); pointer-events:none;
  }

  .summary-star {
    width:18px; height:18px; margin:0 auto 16px;
    clip-path:polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%);
    background:#f2d9a0;
    filter:drop-shadow(0 0 9px rgba(255,231,178,0.95));
  }
  .chart-summary-card h2 {
    font-family:Georgia, serif; font-weight:400;
    font-size:24px; letter-spacing:0.06em;
    color:#e8ce96;
  }
  .summary-divider {
    height:1px; width:0; margin:16px auto 20px;
    background:linear-gradient(90deg, transparent, rgba(224,180,100,0.85), transparent);
    transition:width 0.9s cubic-bezier(0.22,1,0.36,1);
  }
  .summary-divider.in { width:132px; }
  .summary-copy p {
    font-family:-apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
    font-size:16.5px; font-weight:300; line-height:1.66;
    color:rgba(236,228,210,0.92);
    margin-bottom:16px;
  }
  .summary-copy p:last-child { margin-bottom:6px; }
  .complete-reading-cta {
    display:inline-block; margin-top:14px; cursor:pointer;
    background:none; border:none;
    border-bottom:1px solid rgba(214,181,104,0.45);
    padding:4px 2px 7px;
    color:#e0bd7d;
    font-family:-apple-system, "SF Pro Text", sans-serif;
    font-size:16px; font-weight:300; letter-spacing:0.06em;
    transition:color 0.4s ease, border-color 0.4s ease;
  }
  .complete-reading-cta:hover, .complete-reading-cta:active { color:#f4dda4; border-color:rgba(244,221,164,0.8); }
  .complete-reading-cta:focus-visible { outline:2px solid rgba(230,200,135,0.85); outline-offset:4px; }
  .complete-reading-cta span { display:inline-block; margin-left:6px; transition:transform 0.4s ease; }
  .complete-reading-cta:hover span { transform:translateX(4px); }

  /* staged text entrance */
  .chart-summary-card .t { opacity:0; transform:translateY(13px); transition:opacity 0.85s ease, transform 0.85s ease; }
  .chart-summary-card .t.in { opacity:1; transform:translateY(0); }
  .chart-summary-card .summary-divider.t { transform:none; }

  @media (max-width:700px){
    .chart-summary-card { width:88vw; padding:30px 26px 28px; border-radius:24px; }
    .chart-summary-card h2 { font-size:21px; }
    .summary-copy p { font-size:16px; line-height:1.62; }
    #summaryStage { padding-top:calc(env(safe-area-inset-top,0px) + 20vh); }
    #field { top:63%; }
    #beam { top:9%; height:56%; }
  }

  /* reduced motion: no journey, gentle fade to the final composition */
  @media (prefers-reduced-motion: reduce){
    #chartWrap svg, #cardEmerge, #dim, #beam, #field { transition:none !important; }
    #cardEmerge { transition:opacity 0.3s ease !important; transform:none !important; }
    #field .ring, #field .r1::before, #field .r3::before,
    #cardFloat.settled, .chart-summary-card::before { animation:none !important; }
    .chart-summary-card .t { transition:opacity 0.3s ease !important; transform:none !important; }
  }
  /* v4.5: four-paragraph reading */
  .summary-copy { text-align:left; }
  .summary-copy p { font-size:16px; line-height:1.62; margin-bottom:14px; }
  .chart-summary-card { text-align:center; }
  body.cardUp #summaryStage {
    pointer-events:auto; overflow-y:auto;
    touch-action:pan-y; -webkit-overflow-scrolling:touch;
  }
  #summaryStage { display:flex; }
  #summaryStage[hidden] { display:none !important; }   /* ghost card fix: hidden must beat display:flex */
  #cardEmerge { margin:auto; }   /* centered when it fits, scrollable when it does not */
  @media (max-width:700px){
    #summaryStage { padding-top:calc(env(safe-area-inset-top,0px) + 26vh); }
    .summary-copy p { font-size:16px; }
  }


  /* ============================================================
     NEW: COMBINED CHART RESULT PAGE — styles
     ============================================================ */
  body.result-leaving #chartWrap,
  body.result-leaving #revealPrompt {
    opacity:0 !important;
    transform:translateY(-18px);
    transition:opacity 650ms ease, transform 650ms cubic-bezier(.22,1,.36,1);
    pointer-events:none;
  }
  /* v18.6: the restored reveal transition ends by dissolving the whole
     cinematic scene (card, rings, beam, particles, dim) into the report */
  body.result-leaving #summaryStage,
  body.result-leaving #beam,
  body.result-leaving #field,
  body.result-leaving #fx,
  body.result-leaving #dim {
    opacity:0 !important;
    transition:opacity 650ms ease;
    pointer-events:none;
  }
  /* v19.50: ANIMATION RESULT PAGE — the sidereal twin of TROPICAL v18.51.
     Same structure, same behaviour, his own Vedic art and the locked master-
     template palette: black page, rose-gold #C2A481 rules and glyphs, cream
     #EBE5D0 body, gold #CCA466 headings, #CCA466->#6D4706 on the ascendant. */
  #chartResultPage {
    position:fixed; inset:0; z-index:30;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    touch-action:pan-y; overscroll-behavior:contain;
    background:#000000;
    padding:0 0 calc(44px + env(safe-area-inset-bottom,0px));
    opacity:0; transform:translateY(24px);
    transition:opacity 900ms ease, transform 900ms cubic-bezier(.22,1,.36,1);
  }
  .sd-page { width:100%; max-width:800px; margin:0 auto; position:relative;
    background:#000000; }
  /* the sky locks to the top and the page scrolls up behind it */
  #sdHero { display:block; width:100%; aspect-ratio:1500 / 834; object-fit:cover;
    background:#000000; position:sticky; top:0; z-index:4; }
  .sd-details, .sd-frame { position:relative; z-index:1; }

  .sd-details { display:flex; align-items:center; justify-content:space-between;
    padding:22px 2.5% 18px; background:#000000; }
  .sd-dcell { flex:1 1 0; min-width:0; text-align:center;
    font-family:-apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
    color:#EBE5D0; font-size:clamp(8.5px, 2.4vw, 15px); letter-spacing:0.1em;
    line-height:1.45; padding:0 5px; }
  .sd-dcell + .sd-dcell { border-left:1px solid rgba(194,164,129,0.6); }

  .sd-frame { position:relative; margin:0 1.5% 3.2%;
    padding:clamp(16px, 4vw, 32px) clamp(12px, 3.5vw, 34px);
    border:18px solid transparent;
    border-image:url('sid-frame.png?v=3') 48 stretch;   /* v19.53: slice 48 matches the flourish; ?v=3 defeats the cached copy */
    /* v19.51: opaque under the art, and clipped to the padding box so the black
       never tints the ornament. Without this the frame is fully transparent and
       iOS leaves stale text painted behind it as the sticky sky scrolls. */
    background:#000000; background-clip:padding-box;
    overflow:hidden;
    -webkit-transform:translateZ(0); transform:translateZ(0); }
  @media (max-width:700px){ .sd-frame { border-width:14px; margin:0 1% 3.2%;
    padding:clamp(14px, 3.6vw, 26px) clamp(3px, 1vw, 10px); } }

  /* the Sun sits alone on top, then four to a side with the rose-gold arrow */
  .sd-sun { display:flex; align-items:baseline; justify-content:center;
    gap:clamp(8px, 2.4vw, 22px); margin-bottom:clamp(12px, 3vw, 22px); }
  /* v19.81: minmax(0,1fr) so a long row can never push the arrow into the other column */
  .sd-table { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
    gap:clamp(8px, 2.2vw, 20px); align-items:center; }
  .sd-tcol { overflow:hidden; }   /* v19.86: a row can shrink its tracks but never cross the arrow */
  /* one grid per column, rows are display:contents, so every row shares ONE set
     of max-content tracks sized to the longest name and sign — nothing can run
     into its neighbour. space-between spreads the leftover full width. */
  .sd-tcol { display:grid;
    grid-template-columns:1.35em max-content max-content max-content;
    justify-content:space-between;
    column-gap:0.6em; row-gap:clamp(11px, 2.9vw, 20px);

function fmtLon(lon){
  lon = norm360(lon);
  var s = Math.floor(lon/30), d = lon - s*30;
  var dd = Math.floor(d), mm = Math.round((d - dd)*60);
  if (mm === 60){ dd++; mm = 0; }
  return dd + '\u00B0' + (mm<10?'0':'') + mm + '\u2032 ' + SIGNS[s];

/* v19.62: Lahiri CUBIC fitted to seven Deva Guru anchor rows (1932, 1945, 1962, 1985,
   1990, 2010, 2025). Max residual 17 arcsec, RMS ~10 arcsec, extrapolation tracks the
   classical polynomial at 1920 and 2040. Validated span 1932-2025. */
var AYAN = 22.4881406 + 1.2025810*T19 + 0.2622463*T19*T19 - 0.1101570*T19*T19*T19;

            AYAN.toFixed(4) + '°');

var EPS = 23.4392911 - 0.0130042*T20;

var LST = norm24(GAST + BIRTH.lon/15);
var RAMC = LST*15;

function eclToHor(lonDeg){
  var L = lonDeg*DEG, e = EPS*DEG;
  var ra = norm24(Math.atan2(Math.sin(L)*Math.cos(e), Math.cos(L))*RAD/15);
  var dec = Math.asin(Math.sin(L)*Math.sin(e))*RAD;
  var h = Astronomy.Horizon(time, observer, ra, dec, 'normal');
  return { alt: h.altitude, az: h.azimuth };
}
var ascNote = '';
var ascTrop = (function(){
  var r = RAMC*DEG, e = EPS*DEG, phi = BIRTH.lat*DEG;
  var lon = norm360(Math.atan2(-Math.cos(r), Math.sin(r)*Math.cos(e) + Math.tan(phi)*Math.sin(e))*RAD);
  var h = eclToHor(lon);
  if (h.az > 180){ lon = norm360(lon + 180); ascNote = 'quadrant corrected +180\u00B0'; }
  return lon;
})();
var ascSid = norm360(ascTrop - AYAN);

var ascSign = Math.floor(ascSid/30);

function sidLonOf(body){
  var v = Astronomy.GeoVector(body, time, true);
  var e = Astronomy.Ecliptic(v);
  TROP_LON[body] = norm360(e.elon);
  return norm360(TROP_LON[body] - AYAN);
}

var NODE_REGRESSION = (function(){
  var F = REGRESSION_FIXTURE;

  var ay = 22.4881406 + 1.2025810*T + 0.2622463*T*T - 0.1101570*T*T*T;
  var rt = norm360(125.04452 - 0.05295377*(jd - 2451545.0));
  var rs = norm360(rt - ay), ks = norm360(rs + 180);
  var got = { jd:jd, tropical_rahu_deg:rt, ayanamsha_deg:ay, sidereal_rahu_deg:rs, sidereal_ketu_deg:ks,
              rahu_nakshatra: SIX_NAK_NAMES_EARLY[Math.floor(rs/(360/27))], rahu_pada: Math.floor(rs/(360/108))%4+1,
              ketu_nakshatra: SIX_NAK_NAMES_EARLY[Math.floor(ks/(360/27))], ketu_pada: Math.floor(ks/(360/108))%4+1 };
  var fails = [];
  if (Math.abs(got.jd - F.expected_jd) > 1e-6) fails.push('jd');
  if (Math.abs(got.tropical_rahu_deg - F.expected_tropical_rahu_deg) > F.tolerance_deg) fails.push('tropical_rahu');

  if (Math.abs(got.sidereal_ketu_deg - F.expected_sidereal_ketu_deg) > F.tolerance_deg) fails.push('sidereal_ketu');
  if (got.rahu_nakshatra !== F.expected_rahu_nakshatra || got.rahu_pada !== F.expected_rahu_pada) fails.push('rahu_nakshatra_pada');
  if (got.ketu_nakshatra !== F.expected_ketu_nakshatra || got.ketu_pada !== F.expected_ketu_pada) fails.push('ketu_nakshatra_pada');

  var r = { pass: fails.length === 0, failed_fields: fails, computed: got, deva_guru_comparison: ref,

  return r;
})();

var BAND_N = new THREE.Vector3(0.42, 1, 0.12).normalize();  // milky-way plane normal
function randSphere(r){
  var u = Math.random()*2 - 1, az = Math.random()*Math.PI*2, ca = Math.sqrt(1 - u*u);
  return new THREE.Vector3(r*ca*Math.cos(az), r*u, r*ca*Math.sin(az));
}
function starLayer(n, size, color, opacity, bandOnly){
  var pts = [];
  var tries = 0;
  while (pts.length/3 < n && tries < n*40){
    tries++;
    var p = randSphere(300);
    var d = Math.abs(p.clone().normalize().dot(BAND_N));
    if (bandOnly && d > 0.16) continue;
    if (!bandOnly && Math.random() < 0.25 && d < 0.2) continue; // slight thinning off-band double-count
    pts.push(p.x, p.y, p.z);
  }
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pts), 3));
  var mat = new THREE.PointsMaterial({ color:color, size:size, sizeAttenuation:false, transparent:true, opacity:opacity });
  scene.add(new THREE.Points(geo, mat));
}

(function dust(){
  function soft(rgb, size, op){
    var c = document.createElement('canvas'); c.width = c.height = 128;
    var g = c.getContext('2d');
    var grd = g.createRadialGradient(64,64,0,64,64,64);
    grd.addColorStop(0, 'rgba(' + rgb + ',' + op + ')');
    grd.addColorStop(1, 'rgba(' + rgb + ',0)');
    g.fillStyle = grd; g.fillRect(0,0,128,128);
    var m = new THREE.SpriteMaterial({ map:new THREE.CanvasTexture(c), transparent:true, depthWrite:false });
    var s = new THREE.Sprite(m);
    s.scale.set(size, size*0.55, 1);
    return s;
  }
  // dust hugs the band plane: pick vectors near the band circle
  var t1 = new THREE.Vector3(1,0,0).cross(BAND_N).normalize();
  var t2 = BAND_N.clone().cross(t1).normalize();
  for (var i = 0; i < 9; i++){
    var a = Math.random()*Math.PI*2;
    var p = t1.clone().multiplyScalar(Math.cos(a)).add(t2.clone().multiplyScalar(Math.sin(a))).multiplyScalar(280);
    p.add(BAND_N.clone().multiplyScalar((Math.random()-0.5)*40));
    var warm = Math.random() < 0.3;
    var s = soft(warm ? '150,135,115' : '120,135,165', 190 + Math.random()*180, 0.10 + Math.random()*0.07);
    s.position.copy(p);
    scene.add(s);
  }
  // faint dark rift feel: two near-black overlays on the band
  for (var k = 0; k < 3; k++){
    var a2 = Math.random()*Math.PI*2;
    var p2 = t1.clone().multiplyScalar(Math.cos(a2)).add(t2.clone().multiplyScalar(Math.sin(a2))).multiplyScalar(275);
    var d = soft('5,7,14', 220, 0.5);
    d.position.copy(p2);
    scene.add(d);
  }
})();

function texCanvas(w, h, draw){
  var c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  return c;
}
function speckle(g, w, h, n, colors, rMin, rMax, alpha){
  for (var i = 0; i < n; i++){
    g.fillStyle = colors[(Math.random()*colors.length)|0];
    g.globalAlpha = alpha*(0.4 + Math.random()*0.6);
    var r = rMin + Math.random()*(rMax - rMin);
    g.beginPath(); g.arc(Math.random()*w, Math.random()*h, r, 0, Math.PI*2); g.fill();
  }
  g.globalAlpha = 1;
}
function banded(palette, wobble){
  return texCanvas(512, 256, function(g,w,h){
    var y = 0, i = 0;
    while (y < h){
      var bh = 8 + Math.random()*26;
      g.fillStyle = palette[i % palette.length];
      g.fillRect(0, y, w, bh + 2);
      y += bh; i++;
    }
    if (wobble){
      g.globalAlpha = 0.22;
      for (var k = 0; k < 40; k++){
        g.strokeStyle = palette[(Math.random()*palette.length)|0];
        g.lineWidth = 2 + Math.random()*5;
        g.beginPath();
        var yy = Math.random()*h; g.moveTo(0, yy);
        for (var x = 0; x <= w; x += 32) g.lineTo(x, yy + Math.sin(x*0.02 + k)*6);
        g.stroke();
      }
      g.globalAlpha = 1;
    }
    speckle(g, w, h, 260, palette, 1, 3, 0.25);
  });
}

function discURL(name, px){
  var pad = name === 'Sun' ? 0.9 : 0.25;
  var W = Math.round(px*(1 + pad*2)), H = W;
  var c = texCanvas(W, H, function(g){
    var cx = W/2, cy = H/2, r = px/2;
    if (name === 'Sun'){
      var halo = g.createRadialGradient(cx,cy,r*0.5, cx,cy,r*2.6);
      halo.addColorStop(0,'rgba(255,190,90,0.55)');
      halo.addColorStop(0.4,'rgba(255,160,60,0.18)');
      halo.addColorStop(1,'rgba(255,150,50,0)');
      g.fillStyle = halo; g.fillRect(0,0,W,H);
    }
    g.save();
    g.beginPath(); g.arc(cx,cy,r,0,Math.PI*2); g.clip();
    g.drawImage(SURF[name], cx-r, cy-r, r*2, r*2);
    // limb + light from upper-left
    var sh = g.createRadialGradient(cx - r*0.45, cy - r*0.45, r*0.1, cx, cy, r*1.15);
    sh.addColorStop(0, 'rgba(255,255,245,0.16)');
    sh.addColorStop(0.55, 'rgba(0,0,0,0)');
    sh.addColorStop(1, 'rgba(2,3,10,0.88)');
    g.fillStyle = sh; g.fillRect(0,0,W,H);
    g.restore();
    // hairline gold limb
    g.strokeStyle = 'rgba(224,180,100,0.22)';
    g.lineWidth = 1;
    g.beginPath(); g.arc(cx,cy,r,0,Math.PI*2); g.stroke();
  });
  return c.toDataURL('image/png');
}
function saturnURL(px){
  var W = Math.round(px*2.1), H = Math.round(px*1.35);
  var c = texCanvas(W, H, function(g){
    var cx = W/2, cy = H/2, r = px/2;
    var tilt = -16*DEG;
    g.translate(cx, cy); g.rotate(tilt); g.translate(-cx, -cy);
    function ringArc(a0, a1){
      for (var i = 0; i < 3; i++){
        var rr = r*(1.45 + i*0.22), rh = rr*0.30;
        g.strokeStyle = 'rgba(224,203,158,' + (0.55 - i*0.14) + ')';
        g.lineWidth = r*0.11;
        g.beginPath(); g.ellipse(cx, cy, rr, rh, 0, a0, a1); g.stroke();
      }
    }
    ringArc(Math.PI*0.02, Math.PI*0.98);            // back half
    g.translate(cx, cy); g.rotate(-tilt); g.translate(-cx, -cy);
    // planet
    g.save();
    g.beginPath(); g.arc(cx,cy,r,0,Math.PI*2); g.clip();
    g.drawImage(SURF.Saturn, cx-r, cy-r, r*2, r*2);
    var sh = g.createRadialGradient(cx - r*0.45, cy - r*0.45, r*0.1, cx, cy, r*1.15);
    sh.addColorStop(0, 'rgba(255,255,245,0.15)');
    sh.addColorStop(0.55, 'rgba(0,0,0,0)');
    sh.addColorStop(1, 'rgba(2,3,10,0.88)');
    g.fillStyle = sh; g.fillRect(0,0,W,H);
    g.restore();
    g.translate(cx, cy); g.rotate(tilt); g.translate(-cx, -cy);
    ringArc(-Math.PI*0.98, -Math.PI*0.02);          // front half
  });
  return c.toDataURL('image/png');
}
function nodeURL(px, tint){
  var W = Math.round(px*1.5), H = W;
  var c = texCanvas(W, H, function(g){
    var cx = W/2, cy = H/2, r = px/2;
    g.shadowColor = 'rgba(' + tint + ',0.8)'; g.shadowBlur = px*0.12;
    for (var i = 0; i < 7; i++){
      var a0 = Math.random()*Math.PI*2;
      var rr = r*(0.25 + i*0.11);
      g.strokeStyle = 'rgba(235,238,245,' + (0.5 - i*0.055) + ')';
      g.lineWidth = 1.4 + Math.random()*1.6;
      g.beginPath();
      g.arc(cx + Math.cos(a0)*r*0.06, cy + Math.sin(a0)*r*0.06, rr, a0, a0 + Math.PI*(1.1 + Math.random()*0.5));
      g.stroke();
    }
    g.shadowBlur = 0;
    var core = g.createRadialGradient(cx,cy,0,cx,cy,r*0.5);
    core.addColorStop(0,'rgba(' + tint + ',0.5)');
    core.addColorStop(1,'rgba(' + tint + ',0)');
    g.fillStyle = core;
    g.beginPath(); g.arc(cx,cy,r*0.5,0,Math.PI*2); g.fill();
  });
  return c.toDataURL('image/png');
}

/* the Rising emblem: the EMERGE four-pointed spark, gold, softly haloed */
function risingURL(px){
  var W = Math.round(px*1.5), H = W;
  var c = texCanvas(W, H, function(g){
    var cx = W/2, cy = H/2, r = px/2;
    var halo = g.createRadialGradient(cx,cy,0, cx,cy,r*1.35);
    halo.addColorStop(0,'rgba(255,228,155,0.55)');
    halo.addColorStop(0.5,'rgba(242,200,110,0.18)');
    halo.addColorStop(1,'rgba(242,200,110,0)');
    g.fillStyle = halo; g.fillRect(0,0,W,H);
    g.fillStyle = '#F2DFAE';
    g.shadowColor = 'rgba(240,209,138,0.9)'; g.shadowBlur = px*0.16;
    g.beginPath();
    g.moveTo(cx, cy - r);
    g.quadraticCurveTo(cx + r*0.10, cy - r*0.10, cx + r, cy);
    g.quadraticCurveTo(cx + r*0.10, cy + r*0.10, cx, cy + r);
    g.quadraticCurveTo(cx - r*0.10, cy + r*0.10, cx - r, cy);
    g.quadraticCurveTo(cx - r*0.10, cy - r*0.10, cx, cy - r);
    g.fill();
    g.shadowBlur = 0;
  });
  return c.toDataURL('image/png');
}

var NS = 'http://www.w3.org/2000/svg';

var LINES = [
  // outer square
  [A,A, B,A], [B,A, B,B], [B,B, A,B], [A,B, A,A],
  // diagonals
  [A,A, B,B], [B,A, A,B],

  [mid,A, B,mid], [B,mid, mid,B], [mid,B, A,mid], [A,mid, mid,A]

var linePaths = [];
for (var li = 0; li < LINES.length; li++){
  var L = LINES[li];
  var p = el('line', { x1:L[0], y1:L[1], x2:L[2], y2:L[3] }, lineGroup);
  var len = Math.hypot(L[2]-L[0], L[3]-L[1]);
  p.style.strokeDasharray = len;
  p.style.strokeDashoffset = len;
  linePaths.push({ e:p, len:len });
}

/* fixed house anchor points for the graha clusters (template geometry — permanent).
   Every anchor is placed inside its house's real triangle/diamond bounds,
   beneath the header. KIND drives how multiple grahas arrange:
   'd' diamonds (1,4,7,10) — grid; 'h' edge triangles (2,6,8,12) — row;
   'v' side triangles (3,5,9,11) — vertical stack in the corner pocket. */
var q = (B - A)/4;                            // quarter of square
var KIND = { 1:'d', 4:'d', 7:'d', 10:'d',
             2:'h', 6:'h', 8:'h', 12:'h',
             3:'v', 5:'v', 9:'v', 11:'v' };

   direction each stack tucks so grahas follow the house's own shape */
var TAPER = { 3:[-1,-1], 5:[-1,1], 9:[1,1], 11:[1,-1] };

   are widest away from their inner tip, so crowds shift toward the edge) */
var HOUSE = {
  1:  { x:mid,  y:335 },            // top center diamond
  2:  { x:265,  y:196, my:178 },    // top left triangle
  3:  { x:95,   y:158, my:168 },    // left upper — corner pocket
  4:  { x:265,  y:575 },            // left center diamond
  5:  { x:95,   y:845, my:832 },    // left lower — corner pocket
  6:  { x:265,  y:800, my:828 },    // bottom left triangle
  7:  { x:mid,  y:812 },            // bottom center diamond
  8:  { x:735,  y:800, my:828 },    // bottom right triangle
  9:  { x:905,  y:845, my:832 },    // right lower — corner pocket
  10: { x:735,  y:575 },            // right center diamond
  11: { x:905,  y:158, my:168 },    // right upper — corner pocket
  12: { x:735,  y:196, my:178 }     // top right triangle
};

   even the longest sign name (Sagittarius) fits its house. */
var HDR = {
  1:  { x:mid, y:118 },  2:  { x:265, y:82  },  3:  { x:122, y:252 },
  4:  { x:265, y:384 },  5:  { x:122, y:706 },  6:  { x:265, y:906 },
  7:  { x:mid, y:668 },  8:  { x:735, y:906 },  9:  { x:878, y:706 },
  10: { x:735, y:384 },  11: { x:878, y:252 },  12: { x:735, y:82  }

  st.textContent = SIGNS[(ascSign + hn - 1) % 12];

var SIZE = { Sun:118, Jupiter:104, Saturn:100, Moon:92, Venus:84, Mars:76, Mercury:66, Rahu:86, Ketu:86, Rising:96 };
/* group by house for layout */
var byHouse = {};
for (var b = 0; b < GRAHAS.length; b++){
  (byHouse[GRAHAS[b].house] = byHouse[GRAHAS[b].house] || []).push(GRAHAS[b]);
}
/* the Rising: the lagna announces itself first, in House 1 */
var RISING = { key:'Rising', ab:'AC', label: SIGNS[ascSign] + ' Rising',
               sid: ascSid, sign: ascSign, house: 1 };
byHouse[1] = byHouse[1] || [];
byHouse[1].unshift(RISING);
function houseOffsets(n, kind, hh){
  if (n === 1) return [[0,0]];
  if (kind === 'v'){                       // side triangles: compact vertical stack
    var tp = TAPER[hh];                    // labels sit beside, so slots are tight
    if (n === 2) return [[-tp[0]*8, -44],[tp[0]*8, 44]];
    var vout = [];
    for (var vi = 0; vi < n; vi++) vout.push([0, (vi - (n-1)/2)*66]);
    return vout;
  }
  if (kind === 'h'){                       // top/bottom triangles: single row
    if (n === 2) return [[-48,0],[48,0]];
    if (n === 3) return [[-96,0],[0,0],[96,0]];
    var hout = [];
    for (var hi = 0; hi < n; hi++){
      var hc = hi % 2, hr = (hi/2)|0;
      hout.push([ (hc ? 52 : -52), (hr - (Math.ceil(n/2)-1)/2)*92 ]);
    }
    return hout;
  }
  if (n === 2) return [[-62,0],[62,0]];    // diamonds: the roomy houses
  if (n === 3) return [[-84,20],[0,-34],[84,20]];
  var out = [];
  for (var i = 0; i < n; i++){
    var col = i % 2, row = (i/2)|0;
    out.push([ (col ? 66 : -66), (row - (Math.ceil(n/2)-1)/2)*104 ]);
  }
  return out;
}
var grahaGroup = el('g', {});
var grahaEls = [];
for (var hh = 1; hh <= 12; hh++){
  var list = byHouse[hh];
  if (!list) continue;
  var anchor = HOUSE[hh];
  var kind = KIND[hh];
  var anchorY = (list.length > 1 && anchor.my) ? anchor.my : anchor.y;
  var offs = houseOffsets(list.length, kind, hh);
  var crowd = list.length > 1
    ? (kind === 'v' ? (list.length > 2 ? 0.72 : 0.85)
                    : (list.length > 2 ? 0.5 : (kind === 'h' ? 0.62 : 0.78)))
    : 1;
  var scale = (kind === 'd' ? 0.98 : kind === 'h' ? 0.72 : 0.62) * crowd;
  for (var ii = 0; ii < list.length; ii++){
    var gg = list[ii];
    var px = SIZE[gg.key]*scale;
    var url = gg.key === 'Saturn' ? saturnURL(px)
            : gg.key === 'Rising' ? risingURL(px)
            : gg.key === 'Rahu'   ? RAHU_ART
            : gg.key === 'Ketu'   ? KETU_ART
            : discURL(gg.key, px);
    var iw = gg.key === 'Saturn' ? px*2.1 : (gg.key === 'Sun' ? px*2.8 : (gg.key==='Rahu'||gg.key==='Ketu' ? px*1.5 : px*1.5));
    var ih = gg.key === 'Saturn' ? px*1.35 : iw;
    var cx2 = anchor.x + offs[ii][0], cy2 = anchorY + offs[ii][1] - 8;
    var node = el('g', { opacity:'0' }, grahaGroup);
    node.setAttribute('transform', 'translate(' + cx2 + ' ' + (cy2 + 26) + ') scale(0.7)');
    el('image', { href:url, x:-iw/2, y:-ih/2, width:iw, height:ih }, node);
    var fsz = Math.max(scale, 0.75);
    if (kind === 'v'){
      /* side triangles: labels sit beside the graha, toward the interior */
      var lside = (hh === 3 || hh === 5) ? 1 : -1;
      var lx = lside*(px*0.62 + 12);
      var lanchor = lside > 0 ? 'start' : 'end';

        'font-family':'Georgia, serif', 'font-size':String(26*fsz), fill:'#f0e8d6' }, node);
      lbl.textContent = gg.label || gg.key;
      /* v19.73: abbreviation line removed, matches TROPICAL v18.67 */
    } else {
      var lbl = el('text', { x:0, y:px*0.62 + 34, 'text-anchor':'middle',
        'font-family':'Georgia, serif', 'font-size':String(30*fsz), fill:'#f0e8d6' }, node);
      lbl.textContent = gg.label || gg.key;
      /* v19.73: abbreviation line removed, matches TROPICAL v18.67 */
    }

  var lIn = sstep((t - T.locA)/0.9);

    var fam = i < 4 ? T.sq : (i < 6 ? T.diag : T.diam);
    var stagger = (i % 4)*0.22;

  var sp = (t - T.sweepA)/T.sweepDur;
  if (sp > 0 && sp < 1){

  renderer.render(scene, camera);
}

/* ============================================================
   STEP 2 + 3 — rank, merge overlaps, resolve redundancy
   ============================================================ */
function selectThemes(T){
  /* merge: if two themes share a tag, keep the stronger, absorb sources */
  var byTag = {};
  T.forEach(function(t){ t.tags.forEach(function(tag){ (byTag[tag] = byTag[tag] || []).push(t); }); });
  Object.keys(byTag).forEach(function(tag){
    if (tag === 'integration' || tag === 'edge') return;
    var cats = {};
    byTag[tag].forEach(function(t){ (cats[t.category] = cats[t.category] || []).push(t); });
    Object.keys(cats).forEach(function(cat){
      var group = cats[cat].slice().sort(function(a,b){ return b.strength - a.strength; });
      for (var k = 1; k < group.length; k++){
        group[0].sources = group[0].sources.concat(group[k].sources);
        group[k].dropped = true;
      }
    });
  });
  /* merge gifts that live in the same house so the arena is named once */
  var giftPlanets = T.filter(function(t){ return /^gift-(mercury|venus|jupiter|mars|saturn)$/.test(t.id) && !t.dropped; });
  var byHouse = {};
  giftPlanets.forEach(function(t){
    var m = t.sources[0].match(/house (\d+)/);
    if (m) (byHouse[m[1]] = byHouse[m[1]] || []).push(t);
  });
  var GIFT_QUALITY = { mercury:'clear words and quick understanding', venus:'warmth and a feel for beauty',
    jupiter:'wisdom and encouragement', mars:'drive and courage', saturn:'steadiness and follow-through' };
  Object.keys(byHouse).forEach(function(h){
    if (byHouse[h].length >= 2){
      var g = byHouse[h].sort(function(a,b){ return b.strength - a.strength; });
      var quals = g.map(function(t){ return GIFT_QUALITY[t.id.replace('gift-','')]; });
      g[0].statement = 'You bring ' + (quals.length === 2 ? quals[0] + ' together with ' + quals[1]
        : quals.slice(0,-1).join(', ') + ', together with ' + quals[quals.length-1]) +
        ' into ' + ARENA_HUMAN[+h - 1] + ', a combination people remember.';
      for (var k = 1; k < g.length; k++){ g[0].sources = g[0].sources.concat(g[k].sources); g[k].dropped = true; }
      g[0].strength += 0.08;
    }
  });

  var pick = function(cat, n){
    return T.filter(function(t){ return t.category === cat && !t.dropped; })
            .sort(function(a,b){ return b.strength - a.strength; })
            .slice(0, n);
  };
  return {
    identity:  pick('identity', 6),
    innerWorld:pick('innerWorld', 6),
    gifts:     pick('gifts', 4),
    direction: pick('direction', 6)
  };
}

/* ============================================================
   STEP 4 — write the visible summary + hidden trace
   ============================================================ */
function buildHumanSummary(MODE){
  var T = deriveThemes(MODE);
  var S = selectThemes(T);
  var trace = [];
  var usedArenas = {};

  function compose(sectionName, themes, order){
    var ordered = order
      ? order.map(function(id){ return themes.filter(function(t){ return t.id === id; })[0]; }).filter(Boolean)
        .concat(themes.filter(function(t){ return order.indexOf(t.id) === -1; }))
      : themes;
    var text = ordered.map(function(t){ return t.statement; }).join(' ');
    trace.push({ section: sectionName,
      themesUsed: ordered.map(function(t){ return t.id; }),
      sourcePlacements: ordered.reduce(function(a,t){ return a.concat(t.sources); }, []) });
    return { text: text, themes: ordered };
  }

  var one   = compose('WHO YOU ARE', S.identity, ['temperament','as-others-see-you','core-drive','engagement','temperament-edge']);
  var two   = compose('YOUR INNER WORLD', S.innerWorld,
                ['emotional-nature','emotional-need','integration-harmony-honesty','emotional-arena','emotional-style','emotional-texture']);
  var three = compose('YOUR NATURAL GIFTS', S.gifts, ['gift-lead']);
  var four  = compose('YOUR DIRECTION AND GROWTH', S.direction,
                ['growth-familiar','growth-direction','integration-private-public','concentration','relationship-pattern','career-focus','direction-contribution','growth-takeaway']);

  /* word budget 450-650: trim the lowest-strength optional themes first */
  function words(s){ return s.split(/\s+/).filter(Boolean).length; }
  var total = words(one.text) + words(two.text) + words(three.text) + words(four.text);
  var optional = ['emotional-texture','core-drive','engagement'];
  var sections = [one, two, three, four];
  for (var oi = 0; oi < optional.length && total > 650; oi++){
    for (var si = 0; si < sections.length; si++){
      var idx = sections[si].themes.findIndex(function(t){ return t.id === optional[oi]; });
      if (idx >= 0){
        total -= words(sections[si].themes[idx].statement);
        sections[si].themes.splice(idx, 1);
        sections[si].text = sections[si].themes.map(function(t){ return t.statement; }).join(' ');
      }
    }
  }
  try { console.log('[EMERGE TRACE]', JSON.stringify(trace)); } catch(e){}
  return { one: one.text, two: two.text, three: three.text, four: four.text, __trace: trace };
}

/* ---------- particles: a small 2d canvas, no second WebGL renderer ---------- */
var fx = document.getElementById('fx');
var fxc = null, dots = [], DOT_MAX = (window.innerWidth < 700 ? 42 : 90);
var fieldPt = { x:0, y:0 };
function fxResize(){
  var d = Math.min(window.devicePixelRatio || 1, 2);
  fx.width = window.innerWidth * d;
  fx.height = window.innerHeight * d;
  fx.getContext('2d').setTransform(d, 0, 0, d, 0, 0);
  fieldPt.x = window.innerWidth/2;
  fieldPt.y = window.innerHeight * (window.innerWidth < 700 ? 0.63 : 0.61);
}
function spawnDot(gather){
  var a = Math.random()*Math.PI*2;
  var r = (Math.min(window.innerWidth, 440)*0.42) * (0.55 + Math.random()*0.5);
  var x = fieldPt.x + Math.cos(a)*r;
  var y = fieldPt.y + Math.sin(a)*r*0.28;
  return {
    x:x, y:y,
    vx: gather ? (fieldPt.x - x)*0.006 : (Math.random()-0.5)*0.12,
    vy: gather ? (fieldPt.y - y)*0.006 - 0.15 : -0.12 - Math.random()*0.2,
    life: 0, span: 2.4 + Math.random()*3.2,
    r: 0.6 + Math.random()*1.3
  };
}

/* ---------- state machine ---------- */

var phaseT0 = 0;
var parallax = { tx:0, ty:0, rx:0, ry:0 };

    setTimeout(function(){ bodyEl.classList.remove('pulse'); }, 1100);
  }, 350);
  setTimeout(function(){ bodyEl.classList.add('beamOn'); bodyEl.classList.add('fieldOn'); phase = 'tilting'; }, 800);
  setTimeout(function(){ bodyEl.classList.add('sliver'); }, 1900);
  setTimeout(function(){ bodyEl.classList.add('cardUp'); }, 2300);
  setTimeout(function(){ stageText(); }, 3950);
  setTimeout(function(){ completeSummaryReveal(); }, 4600);
}

/* per-frame work, driven by the existing render loop */
function tickReveal(now){
  var s = (now - phaseT0)/1000;

  /* Ascendant star awakens as the chart begins its tilt */
  var g = sstep((s - 0.55)/1.4);
  var breathe = phase === 'resting' ? 0.86 + 0.1*Math.sin(now*0.0012) : 1;
  ascGlow.setAttribute('opacity', String(0.95*g*breathe));

  /* particles */
  if (fxc){
    var gather = phase !== 'resting';
    if (dots.length < DOT_MAX && Math.random() < (gather ? 0.7 : 0.25)) dots.push(spawnDot(gather));
    fxc.clearRect(0, 0, window.innerWidth, window.innerHeight);
    fxc.globalCompositeOperation = 'lighter';
    for (var i = dots.length - 1; i >= 0; i--){
      var d = dots[i];
      d.life += 1/60;
      d.x += d.vx; d.y += d.vy;
      d.vx *= 0.985; d.vy *= 0.992;
      var a = Math.sin(Math.PI*clamp01(d.life/d.span)) * 0.55;
      if (d.life >= d.span){ dots.splice(i, 1); continue; }
      fxc.beginPath();
      fxc.arc(d.x, d.y, d.r, 0, Math.PI*2);
      fxc.fillStyle = 'rgba(240, 210, 140,' + a.toFixed(3) + ')';
      fxc.fill();
    }
    fxc.globalCompositeOperation = 'source-over';
  }

  /* restrained dimensional response on the card */
  if (bodyEl.classList.contains('cardUp')){
    var rx, ry;
    if (IS_COARSE){
      ry = 2.0*Math.sin(now*0.00023);
      rx = 1.2*Math.sin(now*0.00017 + 1.4);
    } else {
      ry = parallax.ty; rx = parallax.tx;
      parallax.ry += (ry - parallax.ry)*0.06;
      parallax.rx += (rx - parallax.rx)*0.06;
      ry = parallax.ry; rx = parallax.rx;
    }
    cardEl.style.transform = 'rotateY(' + ry.toFixed(2) + 'deg) rotateX(' + rx.toFixed(2) + 'deg)';
  }
}

if (!IS_COARSE){
  window.addEventListener('pointermove', function(e){
    parallax.ty = ((e.clientX / window.innerWidth) - 0.5) * 5;    /* max ±2.5deg */
    parallax.tx = (0.5 - (e.clientY / window.innerHeight)) * 3;   /* max ±1.5deg */
  });
}


/* ================== NEW: COMBINED CHART RESULT PAGE ==================
   Reveal My Chart now opens one scrollable result page:
   official eMERGE logo -> complete chart reference -> person-first

function rpHouse(h){
  var s = (h % 10 === 1 && h !== 11) ? 'st' : (h % 10 === 2 && h !== 12) ? 'nd'
        : (h % 10 === 3 && h !== 13) ? 'rd' : 'th';
  return h + s + ' House';

function rpDegIn(lon){
  var d = lon - Math.floor(lon/30)*30;
  var dd = Math.floor(d), mm = Math.round((d - dd)*60);
  if (mm === 60){ dd++; mm = 0; }
  return dd + '\u00B0' + (mm<10?'0':'') + mm + '\u2032';
}

function rpBodies(){
  var list = [], i;
  if (RP_MODE === 'sidereal'){
    var order = ['Sun','Moon','Mars','Mercury','Jupiter','Venus','Saturn','Rahu','Ketu'];
    for (i = 0; i < order.length; i++){
      for (var j = 0; j < GRAHAS.length; j++){
        if (GRAHAS[j].key === order[i]){
          list.push({ key:GRAHAS[j].key, label:GRAHAS[j].key,
                      sign:GRAHAS[j].sign, house:GRAHAS[j].house });
        }
      }
    }
  } else {
    for (i = 0; i < BODIES.length; i++){
      var b = BODIES[i];
      if (b.key === 'Rising') continue;
      list.push({ key:b.key, label:b.label || b.key,
                  sign:Math.floor(b.trop/30), house:b.house });
    }
  }
  return list;
}
function rpFind(list, key){

/* v19.50: the result page owns its own zoom.
   #chartResultPage is position:fixed inside a fixed parent and iOS does not pan
   fixed layers with the visual viewport, so browser pinch would push the
   reading off screen with no way back. The viewport stays locked at scale 1;
   the page transforms its own content instead. Pinch 1x-4x, one finger to pan
   while zoomed, pinch back to 1x for normal scrolling. A zoom holds until the
   reader ends it. At exactly 1x the transform is cleared so the sticky sky
   keeps working. */
var SD_ZMIN = 1, SD_ZMAX = 4;
var sdZ = 1, sdTX = 0, sdTY = 0, sdPinch = null, sdPan = null;

function sdZoomApply(){
  var page = document.getElementById('chartResultPage');
  var inner = page && page.querySelector('.sd-page');
  if (!inner) return;
  if (sdZ <= 1.001){
    sdZ = 1;
    inner.style.transform = '';
    inner.style.transformOrigin = '';
    page.style.overflowY = 'auto';
    page.style.touchAction = 'pan-y';
    if (sdTY){ page.scrollTop = -sdTY; sdTX = 0; sdTY = 0; }
  } else {
    inner.style.transformOrigin = '0 0';
    inner.style.transform = 'translate(' + sdTX.toFixed(2) + 'px,' + sdTY.toFixed(2) + 'px) scale(' + sdZ.toFixed(4) + ')';
    page.style.overflowY = 'hidden';
    page.style.touchAction = 'none';
  }
}
function sdZoomClamp(){
  var page = document.getElementById('chartResultPage');
  var inner = page && page.querySelector('.sd-page');
  if (!inner) return;
  var vw = page.clientWidth, vh = page.clientHeight;
  var cw = inner.offsetWidth * sdZ, ch = inner.offsetHeight * sdZ;
  var left = inner.offsetLeft * sdZ;
  sdTX = (cw <= vw) ? (vw - cw)/2 - left : Math.min(-left, Math.max(vw - cw - left, sdTX));
  sdTY = (ch <= vh) ? 0 : Math.min(0, Math.max(vh - ch, sdTY));
}
function sdMid(a, b, page){
  var r = page.getBoundingClientRect();
  return { x:(a.clientX + b.clientX)/2 - r.left, y:(a.clientY + b.clientY)/2 - r.top };
}
function sdDist(a, b){ return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) || 1; }
function sdZoomWire(){
  var page = document.getElementById('chartResultPage');
  if (!page || page.__zoomWired) return;
  page.__zoomWired = true;

  page.addEventListener('touchstart', function(e){
    if (e.touches.length === 2){
      if (sdZ === 1){ sdTY = -page.scrollTop; sdTX = 0; }
      sdPinch = { d:sdDist(e.touches[0], e.touches[1]), z:sdZ, tx:sdTX, ty:sdTY, m:sdMid(e.touches[0], e.touches[1], page) };
      sdPan = null;
      e.preventDefault();
    } else if (e.touches.length === 1 && sdZ > 1){
      sdPan = { x:e.touches[0].clientX, y:e.touches[0].clientY, tx:sdTX, ty:sdTY };
    }
  }, { passive:false });

  page.addEventListener('touchmove', function(e){
    if (sdPinch && e.touches.length === 2){
      var k = sdDist(e.touches[0], e.touches[1]) / sdPinch.d;
      var nz = Math.max(SD_ZMIN, Math.min(SD_ZMAX, sdPinch.z * k));
      var cx = (sdPinch.m.x - sdPinch.tx) / sdPinch.z;
      var cy = (sdPinch.m.y - sdPinch.ty) / sdPinch.z;
      var m = sdMid(e.touches[0], e.touches[1], page);
      sdZ = nz; sdTX = m.x - cx*nz; sdTY = m.y - cy*nz;
      sdZoomClamp(); sdZoomApply();
      e.preventDefault();
    } else if (sdPan && e.touches.length === 1 && sdZ > 1){
      sdTX = sdPan.tx + (e.touches[0].clientX - sdPan.x);
      sdTY = sdPan.ty + (e.touches[0].clientY - sdPan.y);
      sdZoomClamp(); sdZoomApply();
      e.preventDefault();
    }
  }, { passive:false });

  function sdEnd(e){
    if (e.touches.length < 2) sdPinch = null;
    if (e.touches.length === 0) sdPan = null;
    sdZoomClamp(); sdZoomApply();
  }
  page.addEventListener('touchend', sdEnd);
  page.addEventListener('touchcancel', sdEnd);
  window.addEventListener('resize', function(){ sdZoomClamp(); sdZoomApply(); });
}

    }, 3000);

  var pending = imgs.filter(function(i){ return !i.complete; }).length;
  if (!pending){ run(); return; }
  imgs.forEach(function(i){
    if (i.complete) return;

    i.addEventListener('load', done, { once:true });
    i.addEventListener('error', done, { once:true });
  });

    var sunSid = findGraha('Sun').sid, moonSid = findGraha('Moon').sid;
    var elong = norm360(moonSid - sunSid);
    var panchanga = [];

    /* Vara: local sunrise-to-sunrise Jyotish day; omitted cleanly if sunrise is unavailable */
    if (Astronomy.SearchRiseSet){
      try {
        var midnightLocalUtcMs = Date.UTC(by, bmo - 1, bd, 0, 0) - offsetMin * 60000;
        var sr = Astronomy.SearchRiseSet('Sun', observer, +1, Astronomy.MakeTime(new Date(midnightLocalUtcMs)), 1);
        if (sr && sr.date){
          var preSunrise = BIRTH.utc.getTime() < sr.date.getTime();
          var wd = new Date(Date.UTC(by, bmo - 1, bd) - (preSunrise ? 86400000 : 0)).getUTCDay();
          panchanga.push({ label: 'Vara \u00B7 Birth Weekday', value: WEEKDAYS[wd] + ' \u00B7 ' + WEEKDAY_LORDS[wd] });
        }
      } catch(_){}
    }

    var ti = Math.floor(elong / 12);
    var tithiValue = ti === 14 ? 'Purnima' : ti === 29 ? 'Amavasya'
                   : (ti < 15 ? 'Shukla ' : 'Krishna ') + TITHI_NAMES[ti % 15];
    panchanga.push({ label: 'Tithi \u00B7 Lunar Day', value: tithiValue,
                     meta: TITHI_ORDINALS[ti % 15] + ' lunar day \u00B7 ' + (ti < 15 ? 'Waxing' : 'Waning') + ' Moon' });

    var mNP = nakPada(moonSid);
    panchanga.push({ label: 'Birth Star', value: FULL_NAK[mNP.idx] + ' \u00B7 Pada ' + mNP.pada,
                     meta: 'Ruled by ' + SIX_VIM_LORDS[mNP.idx % 9] });

    panchanga.push({ label: 'Yoga \u00B7 Sun\u2013Moon Pattern', value: YOGA_NAMES[Math.floor(norm360(moonSid + sunSid) / (360 / 27)) % 27] });

    var k1 = Math.floor(elong / 6) + 1;
    var karanaValue = k1 === 1 ? 'Kimstughna' : k1 <= 57 ? KARANA_CYCLE[(k1 - 2) % 7]
                    : ['Shakuni','Chatushpada','Naga'][k1 - 58];
    panchanga.push({ label: 'Karana \u00B7 Half Lunar Day', value: karanaValue });

    /* Vimshottari — major periods only, straight from the engine's own math */
    var V = sixVimshottari(moonSid, BIRTH.utc.getTime(), READING_AS_OF_MS);
    var balY = Math.floor(V.birth_mahadasha_balance_years);
    var balM = Math.round((V.birth_mahadasha_balance_years - balY) * 12);
    if (balM === 12){ balY++; balM = 0; }
    var mahadasha = [{
      label: 'Mahadasha at Birth',
      value: V.birth_mahadasha_lord + ' \u00B7 ' + balY + 'y ' + balM + 'm remaining',
      explanation: "The Moon's birth nakshatra determines the first Vimshottari major period and the proportion of that period remaining at birth.",
      meta: 'Calculated from ' + FULL_NAK[mNP.idx] + ' \u00B7 Pada ' + mNP.pada
    }];
    if (V.current_mahadasha){
      var cs = new Date(V.current_mahadasha.start), ce = new Date(V.current_mahadasha.end), ao = new Date(READING_AS_OF_MS);
      mahadasha.push({
        label: 'Current Mahadasha',
        value: V.current_mahadasha.lord + ' \u00B7 ' + MONTHS_SHORT[cs.getUTCMonth()] + ' ' + cs.getUTCFullYear() + '\u2013' + MONTHS_SHORT[ce.getUTCMonth()] + ' ' + ce.getUTCFullYear(),
        explanation: 'This is the major Vimshottari period active on the report date. Subperiods and their interpretation remain within Current Life Cycle.',
        meta: 'Calculated as of ' + MONTHS[ao.getUTCMonth()] + ' ' + ao.getUTCDate() + ', ' + ao.getUTCFullYear() + ' \u00B7 No subperiods shown'
      });
    }

    var ay = AYAN, ayd = Math.floor(ay), aym = Math.floor((ay - ayd) * 60), ays = Math.round(((ay - ayd) * 60 - aym) * 60);
    if (ays === 60){ ays = 0; aym++; }
    if (aym === 60){ aym = 0; ayd++; }

    var payload = {
      version: 1,
      generatedAt: GENERATED_AT_ISO,
      reportId: 'COZ-D1-' + BIRTH.utc.getTime().toString(36).toUpperCase(),
      birth: { date: dateDisplay, time: timeDisplay, location: locName, timezone: tzDisplay },
      calculation: { ayanamsha: 'Lahiri \u00B7 ' + ayd + '\u00B0' + ('0' + aym).slice(-2) + '\u2032' + ('0' + ays).slice(-2) + '\u2033',
                     houses: 'Whole Sign', nodes: 'Mean Rahu & Ketu' },
      ascendantSignNumber: ascSign + 1,
      planets: planets,
      panchanga: panchanga,
      mahadasha: mahadasha
      /* alignments intentionally absent until approved interpretation content exists */
    };
    /* v19.93: full name onto the printable chart's identity block (BC2.1 renders
       person.name when present, omits the block cleanly when absent) */
    if (SAVED.name && String(SAVED.name).trim()) payload.person = { name: String(SAVED.name).trim() };
    localStorage.setItem('cozChartJSON', JSON.stringify(payload));
    try { if (window.parent !== window) window.parent.postMessage({ coz: 'CHART_READY', chart: payload }, '*'); } catch(_){}
    console.log('[EMERGE FLOW] 8. birth-chart export written: cozChartJSON', payload.reportId, '\u00B7', planets.length, 'bodies \u00B7 panchanga', panchanga.length, 'rows');
  } catch (e) {
    try { localStorage.removeItem('cozChartJSON'); } catch(_){}
    try { if (window.parent !== window) window.parent.postMessage({ coz: 'CHART_ERROR', message: (e && e.message) || 'export failed' }, '*'); } catch(_){}
    console.log('[EMERGE FLOW] 8. birth-chart export failed safely, stale chart cleared, nothing written:', e && e.message);
  }
})();

})();

/* zoom lock (Sep 1): iOS lets a two-finger pinch zoom the whole page even with
   user-scalable=no, and that zoom survives a reload, which is what threw the globe
   off on the second run. Native page zoom is refused here; the dashboards keep
   their own two-finger art zoom. */
(function(){
  ['gesturestart','gesturechange','gestureend'].forEach(function(t){ document.addEventListener(t, function(e){ e.preventDefault(); }, { passive:false }); });
  document.addEventListener('touchmove', function(e){ if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive:false });
})();

/* ============================================================
   SKIP (Sep 1 ruling): the chart drawing can be skipped from the second time on.
   ?skip=1 (Go to my chart from the opening) lands on the result page at once;
   otherwise, on a device that has seen this reveal, a subtle Skip appears once
   the tap-to-reveal gate is up. Same result page, same sound handoff.
   ============================================================ */
(function(){
  var KEY = 'cozSeenReveal_sidereal';
  var seen = false; try { seen = localStorage.getItem(KEY) === '1'; } catch(_){}
  var auto = false; try { auto = new URLSearchParams(location.search).get('skip') === '1'; } catch(_){}
  var el = document.createElement('button'); el.type = 'button'; el.className = 'coz-skip'; el.textContent = 'Skip'; el.setAttribute('aria-label', 'Skip to your chart');
  document.body.appendChild(el);
  window.addEventListener('EMERGE_FREE_SUMMARY_COMPLETE', function(){ try { localStorage.setItem(KEY, '1'); } catch(_){} });
  function skipToChart(){
    if (resultOpened) return;
    el.classList.remove('on');
    revealGateArmed = false;
    var g = document.getElementById('soundGate'); if (g){ try { g.remove(); } catch(_){} }
    window.__numPulsed = 12;
    t0 = performance.now() - 600000;                 /* every timeline beat is in the past */
    window.EMERGE_HOLD_AMBIENT = false;
    try { EMERGE_SOUND.stopLoop('voidatm', 1.0); EMERGE_SOUND.loop('ambient', 1.4); } catch(_){}
    if (!resultBuilt){ try { buildResultPage(); resultBuilt = true; } catch(e){ console.log('[EMERGE FLOW] result page build error:', e); } }
    try { promptEl.classList.remove('show'); } catch(_){}
    finishRevealTransition(REDUCED ? 0 : 400);
    console.log('[EMERGE FLOW] skip -> result page');
  }
  el.addEventListener('click', skipToChart);
  if (auto) setTimeout(skipToChart, 500);
  else if (seen) setTimeout(function(){ if (!resultOpened) el.classList.add('on'); }, 5800);
})();


/* ============================================================
   PRICING PAGE ZOOM (Sep 1 ruling): two fingers scale the pricing art 1x-3x
   about the pinch point, one finger pans while zoomed, pinch back to 1x for
   normal scrolling. The tap targets live inside the art, so they scale with it.
   ============================================================ */
(function(){
  var z = 1, tx = 0, ty = 0, pinch = null, pan = null;
  function wrapEl(){ var d = document.getElementById('unlockDash'); return d && d.querySelector('.dash-art'); }
  function dist(a, b){ return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); }
  function mid(a, b){ return { x:(a.clientX + b.clientX)/2, y:(a.clientY + b.clientY)/2 }; }
  function apply(){
    var d = document.getElementById('unlockDash'), w = wrapEl(); if (!d || !w) return;
    if (z <= 1.001){ z = 1; tx = 0; ty = 0; w.style.transform = ''; w.style.transformOrigin = ''; d.style.overflowY = 'auto'; }
    else { w.style.transformOrigin = '0 0'; w.style.transform = 'translate(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px) scale(' + z.toFixed(4) + ')'; d.style.overflowY = 'hidden'; }
  }
  function clamp(){
    var d = document.getElementById('unlockDash'), w = wrapEl(); if (!d || !w) return;
    var vw = d.clientWidth, vh = d.clientHeight, cw = w.offsetWidth * z, ch = w.offsetHeight * z;
    tx = Math.min(0, Math.max(vw - cw, tx));
    ty = Math.min(0, Math.max(vh - ch, ty));
  }
  function wire(){
    var d = document.getElementById('unlockDash'); if (!d || d.__pzWired) return; d.__pzWired = true;
    d.addEventListener('touchstart', function(e){
      var w = wrapEl(); if (!w || d.__introLock) return;
      if (e.touches.length === 2){
        if (z === 1){ ty = -d.scrollTop; tx = 0; }
        var m = mid(e.touches[0], e.touches[1]);
        pinch = { d:dist(e.touches[0], e.touches[1]) || 1, z:z, tx:tx, ty:ty, m:m }; pan = null;
        e.preventDefault();
      } else if (e.touches.length === 1 && z > 1){
        pan = { x:e.touches[0].clientX, y:e.touches[0].clientY, tx:tx, ty:ty, moved:false };
      }
    }, { passive:false });
    d.addEventListener('touchmove', function(e){
      if (pinch && e.touches.length === 2){
        var k = dist(e.touches[0], e.touches[1]) / pinch.d;
        var nz = Math.max(1, Math.min(3, pinch.z * k));
        var cx = (pinch.m.x - pinch.tx) / pinch.z, cy = (pinch.m.y - pinch.ty) / pinch.z;
        var m = mid(e.touches[0], e.touches[1]);
        z = nz; tx = m.x - cx * nz; ty = m.y - cy * nz;
        if (z <= 1.001){ z = 1; }
        clamp(); apply(); e.preventDefault();
      } else if (pan && e.touches.length === 1 && z > 1){
        tx = pan.tx + (e.touches[0].clientX - pan.x); ty = pan.ty + (e.touches[0].clientY - pan.y);
        if (Math.abs(e.touches[0].clientX - pan.x) + Math.abs(e.touches[0].clientY - pan.y) > 8) pan.moved = true;
        clamp(); apply(); e.preventDefault();
      }
    }, { passive:false });
    function end(e){ if (e.touches.length < 2) pinch = null; if (e.touches.length === 0){ if (pan && pan.moved) d.__pzSwallow = true; pan = null; } clamp(); apply(); }
    d.addEventListener('touchend', end); d.addEventListener('touchcancel', end);
    /* a pan must not fire the button underneath when the finger lifts */
    d.addEventListener('click', function(e){ if (d.__pzSwallow){ d.__pzSwallow = false; e.stopPropagation(); e.preventDefault(); } }, true);
  }
  window.addEventListener('EMERGE_UNLOCK_READING_REQUESTED', function(){ setTimeout(wire, 50); });
  var mo = new MutationObserver(function(){ if (document.getElementById('unlockDash')) { wire(); mo.disconnect(); } });
  mo.observe(document.body, { childList:true });
})();

/* ============================================================
   RESULT PAGE ZOOM, reflow version (Sep 1): replaces the transform zoom, which
   could slide the page into black. Two fingers scale the text 1x-2.2x with CSS
   zoom, so it reflows to the screen width and the page keeps scrolling normally.
   ============================================================ */
function sdZoomWire(){
  var page = document.getElementById('chartResultPage');
  if (!page || page.__zoomWired) return;
  page.__zoomWired = true;
  var inner = page.querySelector('.sd-page');
  var z = 1, pinch = null;
  function dist(a, b){ return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); }
  page.addEventListener('touchstart', function(e){
    if (e.touches.length === 2){ pinch = { d:dist(e.touches[0], e.touches[1]) || 1, z:z }; e.preventDefault(); }
  }, { passive:false });
  page.addEventListener('touchmove', function(e){
    if (!pinch || e.touches.length !== 2 || !inner) return;
    z = Math.max(1, Math.min(2.2, pinch.z * dist(e.touches[0], e.touches[1]) / pinch.d));
    inner.style.zoom = z.toFixed(3);
    e.preventDefault();
  }, { passive:false });
  function end(e){ if (e.touches.length < 2) pinch = null; }
  page.addEventListener('touchend', end); page.addEventListener('touchcancel', end);
}
