        names = ["v", "t", "c"].filter(function(k){ return st.own.indexOf(k) >= 0; }).map(function(k){ return NAME[k]; }).concat(st.x ? [NAME.x] : []),

    if (st.nw) note = "Simulated: " + NAME[st.nw] + " added. Nothing was purchased or unlocked.";
    var h = '<main class="page">' +
      '<div class="top"><img class="art" src="/Demo/sc-top.jpg?v=1" alt=""><div class="head">' +
      '<h1>Add-ons</h1><p class="lead">Preview only. No payment or unlock.</p>' +
      '<div class="div" aria-hidden="true">' + STAR + '</div></div></div>' + (owned ? '<section class="panel" data-simulated>' + (st.nw ? '<p class="sub" data-note>' + esc(note) + '</p>' : '') +
      '<p class="sub">Simulated: you own ' + esc(owned) + '.</p></section>' : '');
    list.forEach(function(o, n){
      var p = priceOf(st.own, o.add), m = kind(st.own, o.add);
      h += '<section class="panel" data-offer="' + o.add + '">' + (n || owned ? '<div class="div" aria-hidden="true">' + STAR + '</div>' : '') +   /* no second divider under the heading's */
        '<div class="ttlrow"><img class="ico" src="' + ICON[o.add] + '" alt=""><p class="ttl">' + esc(o.ttl) + '</p></div>' +
        (o.later ? '<p class="price">$' + COMPAT + '</p><p class="save">Available after you own a reading</p>' + more(o) + '</section>' :
        '<p class="price">$' + p + '</p>' + (m.save ? '<p class="save">' + m.save + '</p>' : '') + '<p class="mark">' + m.mark + '</p>' + more(o) +
        '<button type="button" class="pill solid" data-add="' + o.add + '" aria-label="Add ' + esc(NAME[o.add]) + ' for $' + p + ', preview only, no payment">Add</button></section>');
    });
    h += '<section class="panel"><div class="div" aria-hidden="true">' + STAR + '</div>' +
      '<a class="pill solid" href="' + back(st) + '">Not Now</a>' +
      '<div class="stamp">ADD-ONS · A1.4 · NO PAYMENT</div></section></main>';
    app.innerHTML = h;
    Array.prototype.forEach.call(app.querySelectorAll("[data-add]"), function(b){
      b.addEventListener("click", function(){ step(st, b.getAttribute("data-add")); });
    });
    Array.prototype.forEach.call(app.querySelectorAll(".more"), function(b){
      b.addEventListener("click", function(){
        var open = b.getAttribute("aria-expanded") !== "true";
        b.setAttribute("aria-expanded", String(open)); document.getElementById(b.getAttribute("aria-controls")).classList.toggle("open", open);
      });
    });
  }
  function render(){
    var st = parse(), y = window.scrollY, kept = render.st && render.st.nw === st.nw && !st.nw;
    screen(st); render.st = st;
    window.scrollTo(0, kept ? y : 0);   /* a selector tap keeps the place; Add starts at the top */
  }
  window.addEventListener("hashchange", render);
  render();
})();
</script>
</body>
</html>
