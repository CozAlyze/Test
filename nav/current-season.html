   test-setup.html, so it cannot fail to load (a missing or late separate file would let a page run on the
   Demo's own storage). This copy is the readable source; no page loads it as a separate file.
   The Test and the Demo are on the same site (cozalyze.github.io), so they share the phone's storage.
   This keeps the test pages away from the Demo's data and from the reading servers.

   1. STORAGE. Every localStorage and sessionStorage read and write made on a test page, including by
      the scripts these pages load, goes to keys that start with "cozTEST:". A test page never sees or
      changes a Demo key (saved charts, the current chart, readings, the tester password). The build
      refuses any page or script that uses storage any other way (property-style access, another
      window's or frame's storage, IndexedDB, cookies, workers) and every script is a pinned copy in
      this folder. Storage events from Demo writes (another tab) never reach the test pages.
   2. ROOM FOR THE DEMO. A test write that would take the site's stored data past about 4 MB is refused
      (QuotaExceededError, which the pages already handle as "not enough space"), so the test can never
      crowd the Demo out of the phone's storage.
   3. NETWORK. A test page may request files from this site and from the font and script hosts the pages
      already use. Anything else is refused before it is sent: the reading servers (*.netlify.app) and the
      model (api.anthropic.com) included. No reading can be started, continued or paid for from a test page.
      The build refuses any page or script that names another host.
   4. FRAMES AND WINDOWS. A frame or a new window may only open one of this folder's own pages (PAGES
      below; a refused frame shows a blank page). Never a Demo page, the setup page, a missing page, or
      an inline (srcdoc) frame, any of which could run without this guard.
   5. FAIL CLOSED. If any part of this guard cannot be installed, the page stops before anything else runs
      and says so.

   Anything refused is listed in window.__cozTestBlocked and the console. */

    "vedic-reading.html", "vedic-birth-chart.html", "saved-vedic-document.html", "current-life-cycle.html",
    "current-season.html", "key-time-windows.html", "what-comes-next.html",
    "tropical-reading.html", "tropical-birth-chart.html", "tropical-current-transits.html", "saved-tropical-document.html",
    "compare-reading.html", "combined-reading.html", "your-ascendants.html", "ascendant-reading.html",
    "compare-current-timing.html", "compare-current-timing-reading.html", "compare-birth-charts.html",
    "compare-system.html", "saved-compare-document.html",

      return out;

    /* ---------- 2. room for the Demo (localStorage is shared with it; sessionStorage is per tab) ---------- */
    var CAP = 4.0 * 1048576;                                          /* estimated bytes, 2 per character */

      return new TypeError("The CozAlyze test refused a request to " + where + ".");

    var pageOK = function (u) {
      var a = abs(u); if (!a || a.origin !== location.origin || a.pathname.indexOf(DIR) !== 0) return false;
      return PAGES.indexOf(a.pathname.slice(DIR.length)) >= 0;

<div class="cs-stamp" aria-hidden="true">CURRENT SEASON · CS2.3 · NAV TEST N2.0</div>

<script src="coz-graha.js"></script>
<script>
(function () {
  'use strict';
  var G = window.COZ_GRAHA;
  var panel = document.getElementById('csPanel');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  var DISCLAIMER = 'These are themes that may be present during this period, not predictions of what will happen.';

  /* Nakshatra modifiers: motivation/direction only, connected back to the
     graha and its house by the composer. Never rendered as standalone
     encyclopedia text, no mythology or deities. */
  var NAK = {
    'Ashwini':'a quick, initiating quality and a pull toward fresh starts',
    'Bharani':'a pattern of carrying something through to its conclusion',
    'Krittika':'a clarifying, cutting-through quality that separates what matters from what does not',
    'Rohini':'a steady, cultivating quality that wants something to grow and last',
    'Mrigashira':'a searching quality that keeps looking for the thing not yet found',
    'Ardra':'a quality of necessary upheaval that clears the ground',
    'Punarvasu':'themes of renewal, restoration, and returning to what feels essential',
    'Pushya':'a nourishing, protective quality that steadies what it holds',
    'Ashlesha':'a close-held, perceptive quality attentive to undercurrents',
    'Magha':'an awareness of lineage, inheritance, and what was handed down',
    'P.Phalguni':'a pull toward ease, pleasure, and shared enjoyment',
    'U.Phalguni':'a preference for steady arrangements and dependable commitments',
    'Hasta':'a practical, skilled quality that wants to shape things by hand',
    'Chitra':'an eye for form and design, and a wish to make something well',
    'Swati':'an independent, self-directed quality that resists being held',
    'Vishakha':'a focused, goal-directed quality that pursues one aim at a time',
    'Anuradha':'a loyal, cooperative quality that builds through relationship',
    'Jyeshtha':'a protective, senior quality that takes responsibility',
    'Mula':'an instinct to reach the root and remove what is unnecessary',
    'P.Ashadha':'an invigorating quality that revives momentum',
    'U.Ashadha':'a persistent quality oriented toward lasting results',
    'Shravana':'a listening, learning quality that gathers understanding',
    'Dhanishta':'a rhythmic, capable quality suited to sustained effort',
    'Shatabhisha':'a private, investigative quality drawn to what is hidden',
    'P.Bhadrapada':'an intense quality willing to sit with difficulty',
    'U.Bhadrapada':'a deep, settling quality that seeks calm beneath the surface',
    'Revati':'a pattern of completion, transition, and carrying forward what remains meaningful at the end of a cycle'
  };
  /* Full names used by the birth-chart record map onto the short forms above. */
  var NAK_ALIAS = {
    'Purva Phalguni':'P.Phalguni','Uttara Phalguni':'U.Phalguni',
    'Purva Ashadha':'P.Ashadha','Uttara Ashadha':'U.Ashadha',
    'Purva Bhadrapada':'P.Bhadrapada','Uttara Bhadrapada':'U.Bhadrapada'
  };
  function nakText(n) { if (!n) return null; return NAK[n] || NAK[NAK_ALIAS[n]] || null; }

  /* Pada modifiers: manner of expression only. */
  var PADA = {
    1: 'Its first pada adds an initiating, self-starting emphasis',
    2: 'Its second pada adds a practical emphasis on what can actually be built or kept',
    3: 'Its third pada adds a thoughtful, communicative quality and a willingness to consider more than one possibility',
    4: 'Its fourth pada adds an emphasis on emotional meaning and on what feels settled'
  };

  /* ---------------- Evidence ledger (developer-only) ---------------- */
  var ledger = [];
  function claim(text, factors, note) {
    var unique = {}, n = 0;
    for (var i = 0; i < factors.length; i++) { if (!unique[factors[i]]) { unique[factors[i]] = 1; n++; } }
    var ok = n >= 2;
    ledger.push({ claim: text.slice(0, 74) + (text.length > 74 ? '\u2026' : ''),
                  factors: Object.keys(unique), count: n,
                  result: ok ? 'included' : 'omitted (under two independent factors)',
                  note: note || '' });
    return ok ? text : null;
  }

  function failClosed(reason) {
    panel.innerHTML =
      '<div class="cs-empty">' +
        '<h2>Your season reading is not ready yet</h2>' +
        '<p>Your chart is saved to this device when your reading is prepared. Open your reading first, then return here.</p>' +
      '</div>';
    if (window.console) console.warn('[CURRENT SEASON] fail-closed: ' + reason);
  }

  /* ---------------- Load and validate ---------------- */
  var chart = G.readChart();
  if (!chart) { failClosed('no cozChartJSON on this device'); return; }
  var lc = chart.lifeCycle;
  if (!lc || !lc.mahadasha || !lc.antardasha) { failClosed('timing data incomplete'); return; }

  var md = lc.mahadasha, ad = lc.antardasha;
  var mdP = G.planet(chart, md.lord), adP = G.planet(chart, ad.lord);

  /* Core requirements from the specification: verified sign, house,
     nakshatra and pada for BOTH active lords. Missing any one fails closed. */
  function complete(p) {
    return p && p.signNumber >= 1 && p.signNumber <= 12 &&
           p.house >= 1 && p.house <= 12 && p.nakshatra && p.pada >= 1 && p.pada <= 4;
  }
  if (!complete(mdP)) { failClosed('Mahadasha lord ' + md.lord + ' lacks verified sign/house/nakshatra/pada'); return; }
  if (!complete(adP)) { failClosed('Antardasha lord ' + ad.lord + ' lacks verified sign/house/nakshatra/pada'); return; }

  /* ---------------- Compose ---------------- */
  var paras = [];

  /* 1. The larger chapter. Factors: active MD status + verified house. */
  var mdArea = G.HOUSE_AREAS[mdP.house], mdOrd = G.ordinal(mdP.house);
  var p1 = claim(
    'Your larger ' + esc(md.lord) + ' chapter can bring ' + esc(G.THEMES[md.lord]) +
    ' into longer-term focus. Because ' + esc(md.lord) + ' occupies the ' + esc(mdOrd) +
    ' house of your birth chart, that emphasis may settle most noticeably around ' + esc(mdArea) +
    '. What receives attention here tends to develop over years rather than weeks.',
    ['md_active', 'md_house_' + mdP.house]
  );
  if (p1) paras.push(p1);

  /* 2. Nakshatra and pada of the MD lord, tied back to graha and house. */
  var mdNak = nakText(mdP.nakshatra);
  if (mdNak) {
    var p2 = claim(
      esc(md.lord) + '\u2019s placement in ' + esc(mdP.nakshatra) + ' adds ' + esc(mdNak) +
      '. ' + esc(PADA[mdP.pada]) + ', which may shape how this longer chapter is approached rather than what it concerns.',
      ['md_nakshatra_' + mdP.nakshatra, 'md_pada_' + mdP.pada, 'md_active']
    );
    if (p2) paras.push(p2);
  }

  /* 3. The current season. Factors: active AD status + verified house. */
  var adArea = G.HOUSE_AREAS[adP.house], adOrd = G.ordinal(adP.house);
  var p3 = claim(
    esc(ad.lord) + ' now shapes the current season within that larger chapter. ' + esc(ad.lord) +
    ' brings ' + esc(G.THEMES[ad.lord]) + ' into focus. In your chart ' + esc(ad.lord) +
    ' occupies the ' + esc(adOrd) + ' house, the area connected with ' + esc(adArea) +
    '. This may place nearer-term attention there than the wider chapter alone would suggest.',
    ['ad_active', 'ad_house_' + adP.house]
  );
  if (p3) paras.push(p3);

  /* 4. Nakshatra and pada of the AD lord. */
  var adNak = nakText(adP.nakshatra);
  if (adNak) {
    var p4 = claim(
      esc(ad.lord) + '\u2019s placement in ' + esc(adP.nakshatra) + ' adds ' + esc(adNak) +
      '. ' + esc(PADA[adP.pada]) + '. During this season these may describe the manner in which those themes come forward.',
      ['ad_nakshatra_' + adP.nakshatra, 'ad_pada_' + adP.pada, 'ad_active']
    );
    if (p4) paras.push(p4);
  }

  /* 5. Verified co-presence. Optional modifier: omitted entirely when absent,
     never inferred. Factors: AD house + another graha verified in that house. */
  var mates = G.coTenants(chart, ad.lord);
  if (mates.length) {
    var names = mates.length === 1 ? mates[0]
              : mates.slice(0, -1).join(', ') + ' and ' + mates[mates.length - 1];
    var themeBits = [];
    for (var m = 0; m < mates.length && m < 2; m++) if (G.THEMES[mates[m]]) themeBits.push(G.THEMES[mates[m]]);
    if (themeBits.length) {
      var p5 = claim(
        esc(names) + (mates.length > 1 ? ' also occupy' : ' also occupies') +
        ' this area of your birth chart, adding questions of ' + esc(themeBits.join('; and ')) +
        ' to ' + esc(adOrd) + '-house matters. You may find these threads harder to separate than usual during this season.',
        ['ad_house_' + adP.house, 'cotenancy_' + mates.join('_')]
      );
      if (p5) paras.push(p5);
    }
  }

  /* 6. Lord-to-lord synthesis. Same house, same sign, or contrast. This is
     the paragraph that must explain a pattern rather than append two others. */
  var sameHouse = (mdP.house === adP.house), sameSign = (mdP.signNumber === adP.signNumber);
  var syn;
  if (sameHouse) {
    syn = claim(
      esc(md.lord) + ' and ' + esc(ad.lord) + ' occupy the same house in your chart, so the season and the chapter point at the same part of life rather than pulling apart. That can concentrate attention: what the longer chapter has been slowly reshaping may become more immediate now, in the area of ' + esc(adArea) + '.',
      ['md_house_' + mdP.house, 'ad_house_' + adP.house, 'md_active', 'ad_active']
    );
  } else if (sameSign) {
    syn = claim(
      esc(md.lord) + ' and ' + esc(ad.lord) + ' share a sign in your chart, which can give the season and the wider chapter a similar manner even though they activate different areas of life. The style may feel consistent while the subject changes.',
      ['md_sign_' + mdP.signNumber, 'ad_sign_' + adP.signNumber, 'md_active']
    );
  } else {
    syn = claim(
      esc(md.lord) + ' and ' + esc(ad.lord) + ' work on different areas of your chart, so this season may involve holding two emphases at once: the longer concern of ' + esc(mdArea) + ', and the nearer one of ' + esc(adArea) +
      '. The work of the period may be less about choosing between them than about letting each have its proper place.',
      ['md_house_' + mdP.house, 'ad_house_' + adP.house, 'md_active', 'ad_active']
    );
  }
  if (syn) paras.push(syn);

  /* ---------------- Render ---------------- */
  var lede = 'A season of ' + esc(G.THEMES[ad.lord].split(',')[0]) + ' within a longer chapter of ' +
             esc(G.THEMES[md.lord].split(',')[0]) + '.';

  panel.innerHTML =
    '<p class="cs-eyebrow">Your Current Season</p>' +
    '<p class="cs-pair">' + esc(md.lord) + ' \u2013 ' + esc(ad.lord) + '</p>' +
    '<div class="cs-pairmark">' + G.medallion(md.lord, 68) + '<span class="cs-join"></span>' + G.medallion(ad.lord, 68) + '</div>' +
    '<p class="cs-dates">' + esc(ad.displayStartDate) + ' \u2013 ' + esc(ad.displayEndDate) + '</p>' +
    '<div class="cs-rule" aria-hidden="true"><i></i><b></b><i></i></div>' +
    '<p class="cs-lede">' + lede + '</p>' +
    '<div class="cs-rule" aria-hidden="true"><i></i><b></b><i></i></div>' +

    '<h1 class="cs-h1">Understanding<br>Your Current Season</h1>' +
    '<div class="cs-intro">' +
      '<p>Vimshottari Dasha is a Vedic timing system that maps your life through a sequence of planetary periods calculated from the Moon\u2019s position at birth. The Mahadasha describes the larger chapter unfolding over several years, while the Antardasha describes the shorter season operating within that chapter.</p>' +
      '<p>These periods do not determine exactly what will happen. Instead, they indicate themes and areas of life that may receive greater attention. Your reading combines the active Mahadasha and Antardasha with their placements in your birth chart to explore how this particular season may express itself for you.</p>' +
    '</div>' +
    '<div class="cs-rule" aria-hidden="true"><i></i><b></b><i></i></div>' +

    '<div class="cs-reading">' + paras.map(function (t) { return '<p>' + t + '</p>'; }).join('') + '</div>' +

    '<div class="cs-rule" aria-hidden="true"><i></i><b></b><i></i></div>' +
    '<p class="cs-disclaimer">' + DISCLAIMER + '</p>' +

    '<div class="cs-explore">' +
      '<div class="cs-nav">' +
        '<a href="current-life-cycle.html">\u2190 Back to Life Cycle Overview</a>' +
        '<a href="key-time-windows.html">Next: Key Time Windows \u2192</a>' +
      '</div>' +
    '</div>';

  /* ---------------- Developer-only output ---------------- */
  if (window.console) {
    var words = panel.querySelector('.cs-reading').textContent.trim().split(/\s+/).length;
    console.log('[CURRENT SEASON] mode=' + lc.mode + ' year=' + lc.yearLengthDays + 'd status=' + lc.validationStatus);
    console.log('[CURRENT SEASON] MD ' + md.lord + ' h' + mdP.house + ' ' + mdP.nakshatra + ' p' + mdP.pada +
                ' | AD ' + ad.lord + ' h' + adP.house + ' ' + adP.nakshatra + ' p' + adP.pada +
                ' | personalised words=' + words);
    if (console.table) console.table(ledger); else console.log(ledger);
    console.log('[CURRENT SEASON] NOT IMPLEMENTED (absent from cozChartJSON): house rulerships, graha drishti, dispositor links, dignity. Claims depending on these were never drafted.');
  }
})();
</script>
