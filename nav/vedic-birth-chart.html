<!-- NAV TEST N2.0 (CozAlyze/Test only): the test storage guard (test-storage.js), pasted first so it runs before
     any other script: storage under cozTEST:, no reading servers, art and data from /Demo/ -->
<script>
/* COZ TEST STORAGE · NAV TEST N2.0 (Oct 15 2026; N1.1 r2's guard, hardened after the N2 isolation review)
   CozAlyze/Test/nav only, never the Demo.
   The build pastes this file, unchanged, as the first script inside every page in this folder except
   test-setup.html, so it cannot fail to load (a missing or late separate file would let a page run on the
   Demo's own storage). This copy is the readable source; no page loads it as a separate file.
   The Test and the Demo are on the same site (cozalyze.github.io), so they share the phone's storage.
   This keeps the test pages away from the Demo's data and from the reading servers.

   1. STORAGE. Every localStorage and sessionStorage read and write made on a test page, including by
      the scripts these pages load, goes to keys that start with "cozTEST:". A test page never sees or
      changes a Demo key (saved charts, the current chart, readings, the tester password). The build
      refuses any page or script that uses storage any other way (property-style access, another
      window's or frame's storage, IndexedDB, cookies, workers) and every script is a pinned copy in
      this folder. Storage events from Demo writes (another tab) never reach the test pages.
   2. ROOM FOR THE DEMO. A test write that would take the site's stored data past about 4 MB is refused
      (QuotaExceededError, which the pages already handle as "not enough space"), so the test can never
      crowd the Demo out of the phone's storage.
   3. NETWORK. A test page may request files from this site and from the font and script hosts the pages
      already use. Anything else is refused before it is sent: the reading servers (*.netlify.app) and the
      model (api.anthropic.com) included. No reading can be started, continued or paid for from a test page.
      The build refuses any page or script that names another host.
   4. FRAMES AND WINDOWS. A frame or a new window may only open one of this folder's own pages (PAGES
      below; a refused frame shows a blank page). Never a Demo page, the setup page, a missing page, or
      an inline (srcdoc) frame, any of which could run without this guard.
   5. FAIL CLOSED. If any part of this guard cannot be installed, the page stops before anything else runs
      and says so.

   Art, video, styles and data files load from the Demo folder on the same site (window.COZ_TEST_ASSETS).
   Anything refused is listed in window.__cozTestBlocked and the console. */
(function () {
  if (window.__cozTestStorage) return;
  window.__cozTestStorage = "N2.0";
  var P = "cozTEST:";
  /* this folder's own pages (the build checks this list against the pages it builds) */
  var PAGES = ["account.html", "saved-charts.html",
    "vedic-reading.html", "vedic-birth-chart.html", "saved-vedic-document.html", "current-life-cycle.html",
    "current-season.html", "key-time-windows.html", "what-comes-next.html",
    "tropical-reading.html", "tropical-birth-chart.html", "tropical-current-transits.html", "saved-tropical-document.html",
    "compare-reading.html", "combined-reading.html", "your-ascendants.html", "ascendant-reading.html",
    "compare-current-timing.html", "compare-current-timing-reading.html", "compare-birth-charts.html",
    "compare-system.html", "saved-compare-document.html"];
  try {
    /* ---------- 1. storage ---------- */
    var proto = Storage.prototype;
    var g = proto.getItem, s = proto.setItem, r = proto.removeItem, k = proto.key;
    var lenDesc = Object.getOwnPropertyDescriptor(proto, "length");
    var rawLen = function (st) { return lenDesc.get.call(st); };
    var testKeys = function (st) {
      var out = [], n = rawLen(st), i, key;
      for (i = 0; i < n; i++) { key = k.call(st, i); if (key && key.indexOf(P) === 0) out.push(key.slice(P.length)); }
      return out;
    };
    /* ---------- 2. room for the Demo (localStorage is shared with it; sessionStorage is per tab) ---------- */
    var CAP = 4.0 * 1048576;                                          /* estimated bytes, 2 per character */
    var LOCAL = null; try { LOCAL = window.localStorage; } catch (e) {}
    var usedBytes = function (st) {
      var n = rawLen(st), t = 0, i, key, v;
      for (i = 0; i < n; i++) { key = k.call(st, i); v = key == null ? null : g.call(st, key); t += ((key ? key.length : 0) + (v ? v.length : 0)) * 2; }
      return t;
    };
    proto.getItem = function (key) { return g.call(this, P + key); };
    proto.setItem = function (key, v) {
      var pk = P + key;
      if (this === LOCAL) {
        var old = g.call(this, pk), add = (pk.length + String(v).length) * 2 - (old != null ? (pk.length + old.length) * 2 : 0);
        if (add > 0 && usedBytes(this) + add > CAP) {
          try { console.warn("[COZ TEST] write refused: it would crowd the Demo's storage (" + key + ")"); } catch (e) {}
          throw new DOMException("The CozAlyze test keeps room free for the Demo.", "QuotaExceededError");
        }
      }
      return s.call(this, pk, v);
    };
    proto.removeItem = function (key) { return r.call(this, P + key); };
    proto.key = function (i) { var a = testKeys(this); i = Math.floor(Number(i)); return i >= 0 && i < a.length ? a[i] : null; };
    proto.clear = function () { var st = this; testKeys(st).forEach(function (key) { r.call(st, P + key); }); };
    Object.defineProperty(proto, "length", { configurable: true, enumerable: true, get: function () { return testKeys(this).length; } });
    /* a Demo page writing in another tab fires "storage" events here; they never reach the test pages */
    window.addEventListener("storage", function (ev) { if (!ev.key || ev.key.indexOf(P) !== 0) ev.stopImmediatePropagation(); }, true);

    /* ---------- 3. network ---------- */
    var blocked = window.__cozTestBlocked = [];
    var HOSTS = /^https:\/\/(fonts\.googleapis\.com|fonts\.gstatic\.com|cdn\.jsdelivr\.net|cdnjs\.cloudflare\.com|unpkg\.com)\//;
    var abs = function (u) { try { return new URL(String(u), location.href); } catch (e) { return null; } };
    var allowed = function (u) {
      var a = abs(u); if (!a) return false;
      if (a.protocol === "data:" || a.protocol === "blob:") return true;
      return a.origin === location.origin || HOSTS.test(a.href);
    };
    var refuse = function (u, via) {
      var a = abs(u), where = a ? a.origin + a.pathname : String(u);
      blocked.push({ via: via, url: where, at: new Date().toISOString() });
      try { console.warn("[COZ TEST] refused " + via + " to " + where + " (test pages never contact the reading servers or open a Demo page)"); } catch (e) {}
      return new TypeError("The CozAlyze test refused a request to " + where + ".");
    };
    if (window.fetch) {
      var nf = window.fetch;
      window.fetch = function (input, init) {
        var u = typeof input === "string" ? input : (input && input.url) || String(input);
        if (!allowed(u)) return Promise.reject(refuse(u, "fetch"));
        return nf.apply(this, arguments);
      };
    }
    if (window.XMLHttpRequest) {
      var xo = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function (m, u) { if (!allowed(u)) throw refuse(u, "xhr"); return xo.apply(this, arguments); };
    }
    if (window.EventSource) {
      var ES = window.EventSource;
      var ESW = function (u, o) { if (!allowed(u)) throw refuse(u, "eventsource"); return new ES(u, o); };
      ESW.prototype = ES.prototype; window.EventSource = ESW;
    }
    if (window.WebSocket) {
      var WS = window.WebSocket;
      var WSW = function (u) { throw refuse(u, "websocket"); };
      WSW.prototype = WS.prototype; window.WebSocket = WSW;
    }
    if (navigator.sendBeacon) {
      var sb = navigator.sendBeacon.bind(navigator);
      navigator.sendBeacon = function (u, d) { if (!allowed(u)) { refuse(u, "beacon"); return false; } return sb(u, d); };
    }

    /* ---------- 4. frames and windows: this folder's own pages only ---------- */
    var DIR = location.pathname.replace(/[^\/]*$/, "");              /* this test folder, /Test/nav/ */
    var pageOK = function (u) {
      var a = abs(u); if (!a || a.origin !== location.origin || a.pathname.indexOf(DIR) !== 0) return false;
      return PAGES.indexOf(a.pathname.slice(DIR.length)) >= 0;
    };
    var frameOK = function (u) { var a = abs(u); return !!a && (a.href === "about:blank" || pageOK(u)); };
    var fd = Object.getOwnPropertyDescriptor(HTMLIFrameElement.prototype, "src");
    Object.defineProperty(HTMLIFrameElement.prototype, "src", { configurable: true, enumerable: fd.enumerable, get: fd.get,
      set: function (v) { if (!frameOK(v)) { refuse(v, "frame"); v = "about:blank"; } fd.set.call(this, v); } });
    var sd = Object.getOwnPropertyDescriptor(HTMLIFrameElement.prototype, "srcdoc");
    if (sd) Object.defineProperty(HTMLIFrameElement.prototype, "srcdoc", { configurable: true, enumerable: sd.enumerable, get: sd.get,
      set: function () { refuse("about:srcdoc", "frame"); } });
    var sa = Element.prototype.setAttribute;
    Element.prototype.setAttribute = function (n, v) {
      if (this instanceof HTMLIFrameElement) {
        var name = String(n).toLowerCase();
        if (name === "srcdoc") { refuse("about:srcdoc", "frame"); return; }
        if (name === "src" && !frameOK(v)) { refuse(v, "frame"); v = "about:blank"; }
      }
      return sa.call(this, n, v);
    };
    var wo = window.open;
    window.open = function (u) {
      if (u == null || String(u).trim() === "" || !pageOK(u)) { refuse(u == null ? "about:blank" : u, "window"); return null; }
      return wo.apply(window, arguments);
    };

    window.COZ_TEST_ASSETS = "/Demo/";
    try { console.log("[COZ TEST] storage isolated under " + P + "; reading servers and the model are refused"); } catch (e) {}
  } catch (err) {
    /* ---------- 5. fail closed: no storage, no requests, and the page stops here ---------- */
    try { console.error("[COZ TEST] the test guard could not start, so this page stopped: " + (err && err.message)); } catch (e) {}
    try { ["getItem", "setItem", "removeItem", "key", "clear"].forEach(function (m) { Storage.prototype[m] = function () { throw new Error("The CozAlyze test page stopped."); }; }); } catch (e) {}
    try { window.fetch = function () { return Promise.reject(new TypeError("The CozAlyze test page stopped.")); }; } catch (e) {}
    try { XMLHttpRequest.prototype.open = function () { throw new TypeError("The CozAlyze test page stopped."); }; } catch (e) {}
    try { window.open = function () { return null; }; } catch (e) {}
    try { window.stop(); } catch (e) {}
    try { document.documentElement.innerHTML = '<body style="margin:0;padding:48px 24px;background:#02040c;color:#EEE7D8;font:16px/1.5 -apple-system,Helvetica,Arial,sans-serif">This test page stopped because its safety check couldn’t start. Nothing was changed.</body>'; } catch (e) {}
    throw err;
  }
})();
</script>

<title>Vedic Birth Chart</title>
<!--
  COZALYZE · VEDIC BIRTH CHART · BC2.7 presentation fixes P1 (Oct 6 2026, local build for review)
  BC2.7: a single body in house 9 sits at the mirror of house 5 (x 273), clear of the sign numeral; the
  location adds the country when this chart run's own birth record (same run ID and fingerprint) names the
  same place (display only).
  BC2.6: ?saved=1&id=<compare record>&in=compare renders the chart only, inside the saved comparison
  (saved-compare-document.html): no toolbar, no Saved Readings links, no footer nav, no build stamp,
  transparent page. Data path unchanged (the record's own snapshot chart); saved-vedic-library.js is
  read-only in this mode (SL1.6). Every other mode unchanged.
  BC2.5 top-level print
  BC2.5: Print / Save PDF opens the page at top level when framed (iOS ignores print() in a frame).
  BC2.4: ?saved=1&id=<record> renders the selected cozSavedCharts record (Vedic Saved
  Library landing page): same renderer, data from the saved snapshot, toolbar becomes
  "Saved Charts" + Print / Save PDF, bottom Saved Readings links, no footer nav. Without
  ?saved=1 the page behaves exactly as before.
  Single-document port of CozAlyze-Vedic-Birth-Chart-Claude-Handoff for the
  NEWEST-MASTER-File architecture (GitHub Pages, no build step).

  DATA CONTRACT (localStorage key "cozChartJSON", written by the master
  sidereal-reveal exporter — renderer only, this page never calculates
  astronomy):
  {
    version: 1,
    generatedAt: ISO string,
    reportId: string,
    person?: { name: string, note?: string },   // optional: master stores no person record yet; identity block omitted cleanly when absent
    birth: { date: string, time: string, location: string, timezone: string },
    calculation: { ayanamsha: string, houses: "Whole Sign", nodes: "Mean Rahu & Ketu" },
    ascendantSignNumber: 1-12,
    planets: [ { name, signNumber (1-12), degrees, minutes, house (1-12),
                 nakshatra, pada (1-4), retrograde? } x10,
               order: Ascendant, Sun, Moon, Mars, Mercury, Jupiter, Venus,
               Saturn, Rahu, Ketu ],
    panchanga?: [ { label, value, explanation?, meta? } ],   // rows omitted when absent
    mahadasha?: [ { label, value, explanation?, meta? } ],   // major periods only
    alignments?: [ { label, value, explanation?, meta?, swatches? } ] // approved layer only
  }
  Rows without an approved explanation render as static lines (answer visible,
  no accordion). Sections with no rows are omitted entirely. Demo data renders
  ONLY via ?chart=demo (explicit non-production preview) or ?chart=stellium
  (collision QA), never as a fallback for a real visitor.
-->

<style>
:root{
  --background:#061326; --foreground:#f7f1e7;
  --coz-paper:#f7f1e7; --coz-ink:#07162b; --coz-ink-soft:#314456;
  --coz-gold:#b88a55; --coz-rose:#a66559; --coz-rule:#d6c4a7;
  --font-sans:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html{background:var(--background)}
body{
  min-width:320px; margin:0;
  background:
    radial-gradient(circle at 50% 10%, rgb(37 74 111 / .5), transparent 38rem),
    linear-gradient(180deg,#061326 0%,#020914 100%);
  color:var(--foreground); font-family:var(--font-sans);
}
button{font:inherit}
.report-shell{width:100%; min-height:100vh; padding:2rem 1rem 4rem}
.report-toolbar{display:flex; align-items:center; justify-content:space-between; gap:1rem; width:min(100%,56rem); margin:0 auto 1rem}
.report-toolbar p{margin:0; color:#d8c4a4; font-size:.8rem; letter-spacing:.11em; text-transform:uppercase}
.toolbar-left{display:flex; align-items:center; gap:1rem; min-width:0}
.back-button svg{width:1.1rem; height:1.1rem}
.print-button{
  display:inline-flex; align-items:center; gap:.5rem;
  min-height:2.75rem; padding:.45rem 1rem; cursor:pointer;
  border:1px solid rgb(217 184 129 / .6); border-radius:.4rem;
  background:rgb(4 17 34 / .84); color:#f7f1e7; font-size:.88rem;
}
.print-button:hover{background:#122b48; color:#fffaf2}
.print-button:focus-visible{outline:2px solid var(--coz-gold); outline-offset:2px}
.print-button svg{width:1rem; height:1rem}
.sample-banner{
  width:min(100%,56rem); margin:0 auto .8rem; padding:.55rem .9rem;
  border:1px solid rgb(184 138 85 / .55); border-radius:.4rem;
  background:rgb(184 138 85 / .14); color:#e8d5b4;
  font-size:.74rem; letter-spacing:.09em; text-transform:uppercase; text-align:center;
}
.empty-card{
  width:min(100%,34rem); margin:4rem auto; padding:2rem 1.6rem; text-align:center;
  border:1px solid rgb(217 184 129 / .5); background:rgb(4 17 34 / .7); color:#e9ddc8;
  font-size:.95rem; line-height:1.6;
}
.empty-card h2{margin:0 0 .6rem; font-family:Georgia,"Times New Roman",serif; font-weight:400; font-size:1.35rem; color:#f7f1e7}
.birth-report{
  position:relative; width:min(100%,56rem); margin:0 auto; overflow:hidden;
  border:1px solid var(--coz-rule);
  background:linear-gradient(rgb(184 138 85 / .035) 1px, transparent 1px), var(--coz-paper);
  background-size:100% 1.55rem;
  box-shadow:0 2rem 5rem rgb(0 0 0 / .38);
  color:var(--coz-ink);
}
.birth-report::before{position:absolute; inset:.75rem; border:1px solid rgb(184 138 85 / .48); content:""; pointer-events:none}
.report-inner{position:relative; padding:2.5rem 3rem 2rem}
.report-header,.section-heading,.report-footer{display:flex; align-items:flex-end; justify-content:space-between; gap:1rem}
.wordmark{margin:0; color:var(--coz-gold); font-family:Georgia,"Times New Roman",serif; font-size:.85rem; letter-spacing:.18em}
.report-header h1{margin:.45rem 0 0; font-family:Georgia,"Times New Roman",serif; font-size:clamp(2rem,5vw,3.25rem); font-weight:400; letter-spacing:-.03em; line-height:1}
.chart-type{margin:0; color:var(--coz-gold); font-size:.8rem; letter-spacing:.14em; text-transform:uppercase}
.birth-identity{display:grid; grid-template-columns:minmax(12rem,.8fr) 1.7fr; gap:2rem; margin-top:1.75rem; padding:1.2rem 0; border-block:1px solid var(--coz-rule)}
.birth-identity.no-person{grid-template-columns:1fr}
.birth-identity h2{margin:0; font-family:Georgia,"Times New Roman",serif; font-size:1.45rem; font-weight:400}
.birth-identity p{margin:.35rem 0 0; color:var(--coz-ink-soft); font-size:.78rem}
.birth-identity dl{display:grid; grid-template-columns:1fr .8fr 1.4fr; gap:1rem; margin:0}
.birth-identity dl div{min-width:0}
.birth-identity dt,.calculation-strip span{color:var(--coz-gold); font-size:.72rem; letter-spacing:.1em; text-transform:uppercase}
.birth-identity dd{margin:.35rem 0 0; font-size:.9rem; line-height:1.45}
.birth-timezone{display:block; margin-top:.12rem; color:var(--coz-ink-soft); font-size:.72rem}
.ornamental-rule{width:100%; height:1px; margin:1.75rem 0; background:linear-gradient(90deg,transparent,var(--coz-gold),transparent)}
.report-section{margin-top:2rem}
.chart-section{margin-top:0}
.section-heading{margin-bottom:.8rem; padding-bottom:.65rem; border-bottom:1px solid var(--coz-rule)}
.section-heading h2{margin:.18rem 0 0; font-family:Georgia,"Times New Roman",serif; font-size:1.55rem; font-weight:400}
.section-heading > p,.section-kicker{margin:0; color:var(--coz-gold); font-size:.72rem; letter-spacing:.1em; text-transform:uppercase}
.chart-frame{position:relative; width:min(100%,31rem); margin:1.35rem auto 0; padding:1rem; border:1px solid rgb(184 138 85 / .72); background:rgb(255 252 246 / .46)}
.chart-frame::before,.chart-frame::after{position:absolute; top:-.3rem; width:.55rem; height:.55rem; transform:rotate(45deg); border:1px solid var(--coz-gold); background:var(--coz-paper); content:""}
.chart-frame::before{left:1.5rem}
.chart-frame::after{right:1.5rem}
.north-indian-chart{display:block; width:100%; color:var(--coz-ink)}
.chart-line{fill:none; stroke:currentColor; stroke-width:1.05; opacity:.67}
.chart-sign,.chart-planet,.chart-degree{text-anchor:middle; dominant-baseline:middle; font-family:var(--font-sans)}
.chart-sign{fill:rgb(7 22 43 / .74); font-size:.58rem; font-weight:600; paint-order:stroke; stroke:var(--coz-paper); stroke-linejoin:round; stroke-width:2.5px}
.chart-planet{fill:var(--coz-ink); font-size:.61rem; font-weight:600}
.chart-degree{fill:rgb(7 22 43 / .66); font-size:.46rem}
.chart-ascendant{fill:var(--coz-gold)}
.chart-planet.compact{font-size:5.8px} /* SVG user units: stable against the viewBox at every width */
.chart-degree.compact{font-size:4.4px}
.accordion-heading{margin-bottom:0}
.insight-list{border-bottom:1px solid var(--coz-rule)}
.insight-item{border-top:1px solid var(--coz-rule)}
.insight-h{margin:0}
.insight-trigger{
  display:grid; grid-template-columns:minmax(10rem,.65fr) minmax(0,1.35fr) 1rem;
  align-items:center; gap:1rem; width:100%; min-height:4.25rem; padding:.85rem .25rem;
  border:0; background:none; text-align:left; color:var(--coz-ink); cursor:pointer;
}
.insight-trigger.insight-static{cursor:default}
.insight-trigger:focus-visible{outline:2px solid var(--coz-gold); outline-offset:-2px}
.insight-trigger > svg{width:1rem; height:1rem; color:var(--coz-gold); transition:transform .2s ease}
.insight-trigger[aria-expanded="true"] > svg{transform:rotate(180deg)}
.insight-label{color:var(--coz-gold); font-size:.75rem; font-weight:500; letter-spacing:.09em; line-height:1.35; text-transform:uppercase}
.insight-answer{display:flex; align-items:center; flex-wrap:wrap; gap:.5rem; font-family:Georgia,"Times New Roman",serif; font-size:1.18rem; font-weight:400; line-height:1.3}
.color-swatches{display:inline-flex; gap:.25rem}
.color-swatch{width:.9rem; height:.9rem; border:1px solid rgb(7 22 43 / .16); border-radius:999px}

.insight-content span{display:block; margin-top:.45rem; color:rgb(49 68 86 / .74); font-size:.76rem}

  .insight-content[hidden]{display:none}
}
.positions-scroll{width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch}
.positions-table{width:100%; min-width:39rem; border-collapse:collapse; font-size:.86rem}

      var chev = svgEl("svg",{viewBox:"0 0 24 24",fill:"none",stroke:"currentColor","stroke-width":"2","aria-hidden":"true"});
      chev.appendChild(svgEl("path",{d:"M6 9l6 6 6-6"}));
      btn.appendChild(chev);
      h3.appendChild(btn);
      wrap.appendChild(h3);
      var content = el("div","insight-content");
      content.id = cid;
      content.hidden = true;
      if (item.explanation) content.appendChild(el("p",null,item.explanation));
      if (item.meta) content.appendChild(el("span",null,item.meta));
      wrap.appendChild(content);
      btn.addEventListener("click",function(){
        var open = btn.getAttribute("aria-expanded") === "true";
        /* single-open per section */
        list.querySelectorAll('.insight-trigger[aria-expanded="true"]').forEach(function(other){
          other.setAttribute("aria-expanded","false");
          document.getElementById(other.getAttribute("aria-controls")).hidden = true;
        });
        if (!open){
          btn.setAttribute("aria-expanded","true");
          content.hidden = false;
        }
      });
    } else {
      var row = el("div","insight-trigger insight-static");
      row.appendChild(el("span","insight-label",item.label));
      row.appendChild(answer);
      row.appendChild(el("span"));
      wrap.appendChild(row);
    }
    list.appendChild(wrap);
  });
  return list;
}

function renderReport(chart){
  var article = el("article","birth-report");
  article.setAttribute("aria-label","Vedic birth chart report");
  var inner = el("div","report-inner");

  var header = el("header","report-header");
  var hl = el("div");
  hl.appendChild(el("p","wordmark","COZALYZE"));
  hl.appendChild(el("h1",null,"Vedic Birth Chart"));
  header.appendChild(hl);
  header.appendChild(el("p","chart-type","D1 \u00B7 Rashi"));
  inner.appendChild(header);

  var hasPerson = !!(chart.person && chart.person.name);
  var identity = el("section","birth-identity" + (hasPerson ? "" : " no-person"));
  identity.setAttribute("aria-label","Verified birth information");
  if (hasPerson){
    var who = el("div");
    who.appendChild(el("h2",null,chart.person.name));
    if (chart.person.note) who.appendChild(el("p",null,chart.person.note));
    identity.appendChild(who);
  }
  var dl = el("dl");
  [["Date",chart.birth.date,null],["Time",chart.birth.time,chart.birth.timezone],["Location",fullLocation(chart),null]].forEach(function(row){
    var d = el("div");
    d.appendChild(el("dt",null,row[0]));
    var dd = el("dd",null,row[1]);
    if (row[2]) dd.appendChild(el("span","birth-timezone",row[2]));
    d.appendChild(dd);
    dl.appendChild(d);
  });
  identity.appendChild(dl);
  inner.appendChild(identity);

  inner.appendChild(el("div","ornamental-rule"));

  var chartSec = el("section","chart-section report-section");
  chartSec.setAttribute("aria-labelledby","chart-heading");
  chartSec.appendChild(sectionHeading("Your celestial blueprint","Rashi Chart","chart-heading","North Indian format",false));
  chartSec.appendChild(renderChartSVG(chart));
  inner.appendChild(chartSec);

  if (chart.panchanga && chart.panchanga.length){
    var pan = el("section","report-section");
    pan.setAttribute("aria-labelledby","panchanga-heading");
    pan.appendChild(sectionHeading("The quality of your birth moment","Birth Panchanga","panchanga-heading","Select a line for its meaning",true));
    pan.appendChild(renderInsightList(chart.panchanga,"panchanga"));
    inner.appendChild(pan);
  }
  if (chart.mahadasha && chart.mahadasha.length){
    var md = el("section","report-section");
    md.setAttribute("aria-labelledby","mahadasha-heading");
    md.appendChild(sectionHeading("Your major timing cycle","Vimshottari Mahadasha","mahadasha-heading","Major periods only",true));
    md.appendChild(renderInsightList(chart.mahadasha,"mahadasha"));
    inner.appendChild(md);
  }
  if (chart.alignments && chart.alignments.length){
    var al = el("section","report-section");
    al.setAttribute("aria-labelledby","alignments-heading");
    al.appendChild(sectionHeading("Traditional correspondences","Personal Alignments","alignments-heading","Your answers remain visible",true));
    al.appendChild(renderInsightList(chart.alignments,"alignment"));
    inner.appendChild(al);
  }

  var pos = el("section","report-section positions-section");
  pos.setAttribute("aria-labelledby","positions-heading");
  pos.appendChild(sectionHeading("Reference data","Planetary Positions","positions-heading","D1 only",false));
  var scroll = el("div","positions-scroll");
  var table = el("table","positions-table");
  var thead = el("thead"); var trh = el("tr");
  ["Graha","Sign & degree","House","Nakshatra","Pada"].forEach(function(t){
    var th = el("th",null,t); th.setAttribute("scope","col"); trh.appendChild(th);
  });
  thead.appendChild(trh); table.appendChild(thead);
  var tbody = el("tbody");
  chart.planets.forEach(function(p){
    var tr = el("tr");
    var th = el("th",null,p.name); th.setAttribute("scope","row"); tr.appendChild(th);
    tr.appendChild(el("td",null,SIGN_NAMES[p.signNumber-1] + " " + fmtDegree(p.degrees,p.minutes)));
    tr.appendChild(el("td",null,String(p.house)));
    tr.appendChild(el("td",null,p.nakshatra));
    tr.appendChild(el("td",null,String(p.pada)));
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  scroll.appendChild(table);
  pos.appendChild(scroll);
  inner.appendChild(pos);

  var calc = el("section","calculation-strip report-section");
  calc.setAttribute("aria-label","Calculation settings");
  [["Ayanamsha",chart.calculation.ayanamsha],["Houses",chart.calculation.houses],["Nodes",chart.calculation.nodes],["Time zone",chart.birth.timezone]].forEach(function(row){
    var d = el("div");
    d.appendChild(el("span",null,row[0]));
    d.appendChild(el("strong",null,row[1]));
    calc.appendChild(d);
  });
  inner.appendChild(calc);

  var footer = el("footer","report-footer");
  footer.appendChild(el("p",null,DISCLOSURE));
  footer.appendChild(el("p",null,"Generated by CozAlyze \u00B7 " + chart.reportId));
  inner.appendChild(footer);

  article.appendChild(inner);
  return article;
}

/* BC2.4: the Saved Readings links, appended in saved mode only. Each link opens the
   clean document for material that was captured when the chart was saved; the Vedic
   Reading is offered only when the complete six-section reading was saved. */
function renderSavedReadings(lib){
  var sec = el("section","report-section saved-readings");
  sec.setAttribute("aria-labelledby","saved-readings-heading");
  sec.appendChild(sectionHeading("Quick access to other views for this chart","Saved Readings","saved-readings-heading","",false));
  var grid = el("div","saved-readings-links");
  [["Your Vedic Reading","reading",lib.has.reading,"Not finished when saved"],
   ["Your Ascendant \u2013 Lagna","lagna",lib.has.lagna,"Not saved with this chart"],
   ["Your Current Life Cycle","life-cycle",lib.has.lifeCycle,"Not saved with this chart"]].forEach(function(row){
    var a = el("a", row[2] ? null : "unavailable");
    a.appendChild(el("span",null,row[0])); a.firstChild.style.color = "";
    if (row[2]){ a.href = "saved-vedic-document.html?view=" + row[1] + "&id=" + encodeURIComponent(lib.id); a.appendChild(el("span",null,"\u203A")); }
    else { a.setAttribute("aria-disabled","true"); a.appendChild(el("small",null,row[3])); }
    grid.appendChild(a);
  });
  sec.appendChild(grid);
  return sec;
}

function renderEmptyState(){
  var card = el("div","empty-card");
  card.appendChild(el("h2",null,"No saved birth chart yet"));
  card.appendChild(el("p",null,"Your chart is saved to this device when your reading is prepared. Open your reading first, then return here for your printable birth chart."));
  return card;
}

/* Print / Save PDF: iOS Safari ignores window.print() from inside the app frame, so a
   framed page opens itself at top level with ?print=1 and prints there. */
function cozPrint(){
  var framed = false; try { framed = window.top !== window; } catch (e) { framed = true; }
  if (framed) { var u = new URL(location.href); u.searchParams.set("print", "1"); window.open(u.href, "_blank"); return; }
  window.print();
}
function cozAutoPrint(){
  if (!/[?&]print=1\b/.test(location.search)) return;
  var go = function(){ setTimeout(function(){ window.print(); }, 250); };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(go); else go();
}

/* ---------- Boot ---------- */
(function(){
  var mount = document.getElementById("reportMount");
  var banner = document.getElementById("sampleBanner");
  document.getElementById("printBtn").addEventListener("click",cozPrint);
  document.getElementById("backBtn").addEventListener("click",function(){ location.href = /\bsaved=1\b/.test(location.search) ? "saved-charts.html" : (/\bfrom=compare\b/.test(location.search) ? "compare-birth-charts.html" : "vedic-reading.html"); });
  /* v20.1: the top Back button is gone; the footer Home link returns to the reading */

  var qp = new URLSearchParams(location.search);
  var chart = null, isSample = false;

  /* BC2.4 saved mode: data from the selected saved record, never from the live keys */
  var savedLib = null;
  if (qp.get("saved") === "1"){
    document.body.classList.add("saved-mode");
    if (qp.get("in") === "compare"){ document.body.classList.add("embed-compare"); document.documentElement.classList.add("embed-compare"); }   /* BC2.6 */
    var bb = document.getElementById("backBtn");
    bb.lastChild.textContent = " Saved Charts";
    savedLib = window.CozSavedVedic ? window.CozSavedVedic.load() : null;
    if (!savedLib || !savedLib.chart){
      var card = el("div","empty-card");
      card.appendChild(el("h2",null,"This saved chart could not be opened"));
      card.appendChild(el("p",null,"It may have been removed from this device. Open Saved Charts to choose another."));
      mount.appendChild(card); return;
    }
    chart = savedLib.chart;
  }
  else if (qp.get("chart") === "demo"){ chart = DEMO_BIRTH_CHART; isSample = true; }
  else if (qp.get("chart") === "stellium"){ chart = STELLIUM_QA; isSample = true; }
  else {
    var raw = null;
    try { raw = localStorage.getItem("cozChartJSON"); } catch(e){}
    if (raw){
      try {
        var parsed = JSON.parse(raw);
        var errs = validatePayload(parsed);
        if (errs.length === 0) chart = parsed;
        else if (window.console) console.warn("cozChartJSON rejected: " + errs.join("; "));
      } catch(e){ if (window.console) console.warn("cozChartJSON unreadable"); }
    }
  }

  if (!chart){
    if (!isSample && !qp.get("chart")){ mount.appendChild(renderEmptyState()); return; }
    mount.appendChild(renderEmptyState()); return;
  }
  var errsFinal = validatePayload(chart);
  if (errsFinal.length){ mount.appendChild(renderEmptyState()); return; }
  if (isSample) banner.hidden = false;
  var report = renderReport(chart);
  if (savedLib && qp.get("in") !== "compare"){ var innerEl = report.querySelector(".report-inner"); innerEl.insertBefore(renderSavedReadings(savedLib), innerEl.querySelector(".report-footer")); }
  mount.appendChild(report);
  cozAutoPrint();
})();
