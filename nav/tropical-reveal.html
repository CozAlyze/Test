<!-- NAV TEST N2.0 (CozAlyze/Test only): the test storage guard (test-storage.js), pasted first so it runs before
     any other script: storage under cozTEST:, no reading servers, art and data from /Demo/ -->
<script>
/* COZ TEST STORAGE · NAV TEST N2.0 (Oct 15 2026; N1.1 r2's guard, hardened after the N2 isolation review)
   CozAlyze/Test/nav only, never the Demo.
   The build pastes this file, unchanged, as the first script inside every page in this folder except
   test-setup.html, so it cannot fail to load (a missing or late separate file would let a page run on the
   Demo's own storage). This copy is the readable source; no page loads it as a separate file.
   The Test and the Demo are on the same site (cozalyze.github.io), so they share the phone's storage.
   This keeps the test pages away from the Demo's data and from the reading servers.

   1. STORAGE. Every localStorage and sessionStorage read and write made on a test page, including by
      the scripts these pages load, goes to keys that start with "cozTEST:". A test page never sees or
      changes a Demo key (saved charts, the current chart, readings, the tester password). The build
      refuses any page or script that uses storage any other way (property-style access, another
      window's or frame's storage, IndexedDB, cookies, workers) and every script is a pinned copy in
      this folder. Storage events from Demo writes (another tab) never reach the test pages.
   2. ROOM FOR THE DEMO. A test write that would take the site's stored data past about 4 MB is refused
      (QuotaExceededError, which the pages already handle as "not enough space"), so the test can never
      crowd the Demo out of the phone's storage.
   3. NETWORK. A test page may request files from this site and from the font and script hosts the pages
      already use. Anything else is refused before it is sent: the reading servers (*.netlify.app) and the
      model (api.anthropic.com) included. No reading can be started, continued or paid for from a test page.
      The build refuses any page or script that names another host.
   4. FRAMES AND WINDOWS. A frame or a new window may only open one of this folder's own pages (PAGES
      below; a refused frame shows a blank page). Never a Demo page, the setup page, a missing page, or
      an inline (srcdoc) frame, any of which could run without this guard.
   5. FAIL CLOSED. If any part of this guard cannot be installed, the page stops before anything else runs
      and says so.

   Art, video, styles and data files load from the Demo folder on the same site (window.COZ_TEST_ASSETS).
   Anything refused is listed in window.__cozTestBlocked and the console. */
(function () {
  if (window.__cozTestStorage) return;
  window.__cozTestStorage = "N2.0";
  var P = "cozTEST:";
  /* this folder's own pages (the build checks this list against the pages it builds) */
  var PAGES = ["account.html", "saved-charts.html",
    "vedic-reading.html", "vedic-birth-chart.html", "saved-vedic-document.html", "current-life-cycle.html",
    "current-season.html", "key-time-windows.html", "what-comes-next.html",
    "tropical-reading.html", "tropical-birth-chart.html", "tropical-current-transits.html", "saved-tropical-document.html",
    "compare-reading.html", "combined-reading.html", "your-ascendants.html", "ascendant-reading.html",
    "compare-current-timing.html", "compare-current-timing-reading.html", "compare-birth-charts.html",
    "compare-system.html", "saved-compare-document.html",
    "tropical-reveal.html", "sidereal-reveal.html"];                   /* the two chart engines: hidden calculation frames only */
  try {
    /* ---------- 1. storage ---------- */
    var proto = Storage.prototype;
    var g = proto.getItem, s = proto.setItem, r = proto.removeItem, k = proto.key;
    var lenDesc = Object.getOwnPropertyDescriptor(proto, "length");
    var rawLen = function (st) { return lenDesc.get.call(st); };
    var testKeys = function (st) {
      var out = [], n = rawLen(st), i, key;
      for (i = 0; i < n; i++) { key = k.call(st, i); if (key && key.indexOf(P) === 0) out.push(key.slice(P.length)); }
      return out;
    };
    /* ---------- 2. room for the Demo (localStorage is shared with it; sessionStorage is per tab) ---------- */
    var CAP = 4.0 * 1048576;                                          /* estimated bytes, 2 per character */
    var LOCAL = null; try { LOCAL = window.localStorage; } catch (e) {}
    var usedBytes = function (st) {
      var n = rawLen(st), t = 0, i, key, v;
      for (i = 0; i < n; i++) { key = k.call(st, i); v = key == null ? null : g.call(st, key); t += ((key ? key.length : 0) + (v ? v.length : 0)) * 2; }
      return t;
    };
    proto.getItem = function (key) { return g.call(this, P + key); };
    proto.setItem = function (key, v) {
      var pk = P + key;
      if (this === LOCAL) {
        var old = g.call(this, pk), add = (pk.length + String(v).length) * 2 - (old != null ? (pk.length + old.length) * 2 : 0);
        if (add > 0 && usedBytes(this) + add > CAP) {
          try { console.warn("[COZ TEST] write refused: it would crowd the Demo's storage (" + key + ")"); } catch (e) {}
          throw new DOMException("The CozAlyze test keeps room free for the Demo.", "QuotaExceededError");
        }
      }
      return s.call(this, pk, v);
    };
    proto.removeItem = function (key) { return r.call(this, P + key); };
    proto.key = function (i) { var a = testKeys(this); i = Math.floor(Number(i)); return i >= 0 && i < a.length ? a[i] : null; };
    proto.clear = function () { var st = this; testKeys(st).forEach(function (key) { r.call(st, P + key); }); };
    Object.defineProperty(proto, "length", { configurable: true, enumerable: true, get: function () { return testKeys(this).length; } });
    /* a Demo page writing in another tab fires "storage" events here; they never reach the test pages */
    window.addEventListener("storage", function (ev) { if (!ev.key || ev.key.indexOf(P) !== 0) ev.stopImmediatePropagation(); }, true);

    /* ---------- 3. network ---------- */
    var blocked = window.__cozTestBlocked = [];
    var HOSTS = /^https:\/\/(fonts\.googleapis\.com|fonts\.gstatic\.com|cdn\.jsdelivr\.net|cdnjs\.cloudflare\.com|unpkg\.com)\//;
    var abs = function (u) { try { return new URL(String(u), location.href); } catch (e) { return null; } };
    var allowed = function (u) {
      var a = abs(u); if (!a) return false;
      if (a.protocol === "data:" || a.protocol === "blob:") return true;
      return a.origin === location.origin || HOSTS.test(a.href);
    };
    var refuse = function (u, via) {
      var a = abs(u), where = a ? a.origin + a.pathname : String(u);
      blocked.push({ via: via, url: where, at: new Date().toISOString() });
      try { console.warn("[COZ TEST] refused " + via + " to " + where + " (test pages never contact the reading servers or open a Demo page)"); } catch (e) {}
      return new TypeError("The CozAlyze test refused a request to " + where + ".");
    };
    if (window.fetch) {
      var nf = window.fetch;
      window.fetch = function (input, init) {
        var u = typeof input === "string" ? input : (input && input.url) || String(input);
        if (!allowed(u)) return Promise.reject(refuse(u, "fetch"));
        return nf.apply(this, arguments);
      };
    }
    if (window.XMLHttpRequest) {
      var xo = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function (m, u) { if (!allowed(u)) throw refuse(u, "xhr"); return xo.apply(this, arguments); };
    }
    if (window.EventSource) {
      var ES = window.EventSource;
      var ESW = function (u, o) { if (!allowed(u)) throw refuse(u, "eventsource"); return new ES(u, o); };
      ESW.prototype = ES.prototype; window.EventSource = ESW;
    }
    if (window.WebSocket) {
      var WS = window.WebSocket;
      var WSW = function (u) { throw refuse(u, "websocket"); };
      WSW.prototype = WS.prototype; window.WebSocket = WSW;
    }
    if (navigator.sendBeacon) {
      var sb = navigator.sendBeacon.bind(navigator);
      navigator.sendBeacon = function (u, d) { if (!allowed(u)) { refuse(u, "beacon"); return false; } return sb(u, d); };
    }

    /* ---------- 4. frames and windows: this folder's own pages only ---------- */
    var DIR = location.pathname.replace(/[^\/]*$/, "");              /* this test folder, /Test/nav/ */
    var pageOK = function (u) {
      var a = abs(u); if (!a || a.origin !== location.origin || a.pathname.indexOf(DIR) !== 0) return false;
      return PAGES.indexOf(a.pathname.slice(DIR.length)) >= 0;
    };
    var frameOK = function (u) { var a = abs(u); return !!a && (a.href === "about:blank" || pageOK(u)); };
    var fd = Object.getOwnPropertyDescriptor(HTMLIFrameElement.prototype, "src");
    Object.defineProperty(HTMLIFrameElement.prototype, "src", { configurable: true, enumerable: fd.enumerable, get: fd.get,
      set: function (v) { if (!frameOK(v)) { refuse(v, "frame"); v = "about:blank"; } fd.set.call(this, v); } });
    var sd = Object.getOwnPropertyDescriptor(HTMLIFrameElement.prototype, "srcdoc");
    if (sd) Object.defineProperty(HTMLIFrameElement.prototype, "srcdoc", { configurable: true, enumerable: sd.enumerable, get: sd.get,
      set: function () { refuse("about:srcdoc", "frame"); } });
    var sa = Element.prototype.setAttribute;
    Element.prototype.setAttribute = function (n, v) {
      if (this instanceof HTMLIFrameElement) {
        var name = String(n).toLowerCase();
        if (name === "srcdoc") { refuse("about:srcdoc", "frame"); return; }
        if (name === "src" && !frameOK(v)) { refuse(v, "frame"); v = "about:blank"; }
      }
      return sa.call(this, n, v);
    };
    var wo = window.open;
    window.open = function (u) {
      if (u == null || String(u).trim() === "" || !pageOK(u)) { refuse(u == null ? "about:blank" : u, "window"); return null; }
      return wo.apply(window, arguments);
    };

    window.COZ_TEST_ASSETS = "/Demo/";
    try { console.log("[COZ TEST] storage isolated under " + P + "; reading servers and the model are refused"); } catch (e) {}
  } catch (err) {
    /* ---------- 5. fail closed: no storage, no requests, and the page stops here ---------- */
    try { console.error("[COZ TEST] the test guard could not start, so this page stopped: " + (err && err.message)); } catch (e) {}
    try { ["getItem", "setItem", "removeItem", "key", "clear"].forEach(function (m) { Storage.prototype[m] = function () { throw new Error("The CozAlyze test page stopped."); }; }); } catch (e) {}
    try { window.fetch = function () { return Promise.reject(new TypeError("The CozAlyze test page stopped.")); }; } catch (e) {}
    try { XMLHttpRequest.prototype.open = function () { throw new TypeError("The CozAlyze test page stopped."); }; } catch (e) {}
    try { window.open = function () { return null; }; } catch (e) {}
    try { window.stop(); } catch (e) {}
    try { document.documentElement.innerHTML = '<body style="margin:0;padding:48px 24px;background:#02040c;color:#EEE7D8;font:16px/1.5 -apple-system,Helvetica,Arial,sans-serif">This test page stopped because its safety check couldn’t start. Nothing was changed.</body>'; } catch (e) {}
    throw err;
  }
})();

/* ============================================================

   Sky scan -> birth coordinates -> the Western wheel template
   revealed from darkness -> zodiac ring -> house numbers ->
   calculation -> twelve bodies onto the wheel.
   The wheel is permanent: house 1 opens at 9 o'clock, houses
   run counterclockwise and never move. The zodiac ring rotates
   to the rising sign (whole-sign houses: 1H = the entire
   Ascendant sign). Planets populate their calculated houses.
   The wheel is the destination. The journey is art;
   the arrival is fact.
   ============================================================ */
(function(){

var fatal = document.getElementById('fatal');
function die(m){ fatal.textContent = m; fatal.style.display = 'block'; }
if (typeof THREE === 'undefined'){ die('three.js failed to load. Check network / CDN.'); return; }
if (typeof Astronomy === 'undefined'){ die('astronomy-engine failed to load. Check network / CDN.'); return; }

/* the locate beat names the user's actual birthplace (QA text kept as fallback) */
(function(){
  var S = null;
  try { S = JSON.parse(localStorage.getItem('emergeBirthData') || 'null'); } catch(e){}
  if (!S || !S.location || !isFinite(Number(S.location.latitude))) return;
  var lat = Number(S.location.latitude), lon = Number(S.location.longitude);
  var la = Math.abs(lat).toFixed(4) + '\u00B0 ' + (lat >= 0 ? 'N' : 'S');
  var lo = Math.abs(lon).toFixed(4) + '\u00B0 ' + (lon >= 0 ? 'E' : 'W');
  var place = [S.location.name, S.location.country].filter(Boolean).join(' \u00B7 ').toUpperCase();
  document.getElementById('coords').innerHTML =
    la + ' \u00A0\u00B7\u00A0 ' + lo + (place ? '<br><span class="place">' + place + '</span>' : '');
})();

/* ---------------- birth data (QA profile) ---------------- */
/* the one data spine: saved by index.html when Scene 1 completes */
var SAVED = null;
try { SAVED = JSON.parse(localStorage.getItem('emergeBirthData') || 'null'); } catch(e){}

/* NEW: hard system guard. This page renders the TROPICAL system only.
   If the saved birth record was written by the Sidereal door, stop with a
   visible error instead of rendering a mislabeled chart. No silent fallback. */
var PAGE_SYSTEM = 'tropical';
/* Compare Ascendants (Sep 18): ?cozExport=1 loads this engine silently in a hidden
   frame to calculate this system for the SAME birth record the other door used.
   Only the door guard is skipped; no calculation line changes. */
var COZ_EXPORT_ONLY = /[?&]cozExport=1(&|$)/.test(location.search);
if (!COZ_EXPORT_ONLY && SAVED && SAVED.system && SAVED.system !== PAGE_SYSTEM){
  console.log('[EMERGE FLOW] guard: SYSTEM MISMATCH — page renders', PAGE_SYSTEM,

  fatal.innerHTML = 'System mismatch.<br><br>This page renders the <b>Western Tropical</b> chart, '

    + '<a href="test-setup.html" style="color:#E6C887">Return to the beginning and choose again</a>';   /* NAV TEST N2.0 */
  fatal.style.display = 'block';
  return;
}

/* NEW: launch guard. Flip to true before launch so a visitor with no
   stored birth data is sent to the entry flow instead of seeing the
   QA fallback chart. Leave false while testing standalone uploads. */
var REQUIRE_BIRTH_DATA = false;
var GUARD_REDIRECT = 'test-setup.html';   /* NAV TEST N2.0 */
if (REQUIRE_BIRTH_DATA && !(SAVED && SAVED.utc && SAVED.location)){
  console.log('[EMERGE FLOW] guard: no birth data in storage, redirecting to entry flow');
  location.replace(GUARD_REDIRECT);
  return;
}
var __lat = SAVED && SAVED.location ? Number(SAVED.location.latitude)  : NaN;
var __lon = SAVED && SAVED.location ? Number(SAVED.location.longitude) : NaN;
var __utc = SAVED && SAVED.utc ? new Date(SAVED.utc) : null;
var __ok  = !!(__utc && isFinite(__utc.getTime()) && isFinite(__lat) && isFinite(__lon));
var BIRTH = __ok ? {
  utc: __utc,
  localLabel: (SAVED.birthDate || '') + ', ' + (SAVED.birthTime || ''),
  lat: __lat, lon: __lon, elev: 0
} : {
  utc: new Date('1990-01-01T17:00:00Z'),          // v18.53: synthetic, non-personal regression profile
  localLabel: 'Jan 1 1990, 12:00 PM EST, New York (synthetic fixture)',
  lat: 40.7128, lon: -74.0060, elev: 0
};

/* ============================================================

function texCanvas(w, h, draw){
  var c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  return c;
}
function speckle(g, w, h, n, colors, rMin, rMax, alpha){
  for (var i = 0; i < n; i++){
    g.fillStyle = colors[(Math.random()*colors.length)|0];
    g.globalAlpha = alpha*(0.4 + Math.random()*0.6);
    var r = rMin + Math.random()*(rMax - rMin);
    g.beginPath(); g.arc(Math.random()*w, Math.random()*h, r, 0, Math.PI*2); g.fill();
  }
  g.globalAlpha = 1;
}
function banded(palette, wobble){
  return texCanvas(512, 256, function(g,w,h){
    var y = 0, i = 0;
    while (y < h){
      var bh = 8 + Math.random()*26;
      g.fillStyle = palette[i % palette.length];
      g.fillRect(0, y, w, bh + 2);
      y += bh; i++;
    }
    if (wobble){
      g.globalAlpha = 0.22;
      for (var k = 0; k < 40; k++){
        g.strokeStyle = palette[(Math.random()*palette.length)|0];
        g.lineWidth = 2 + Math.random()*5;
        g.beginPath();
        var yy = Math.random()*h; g.moveTo(0, yy);
        for (var x = 0; x <= w; x += 32) g.lineTo(x, yy + Math.sin(x*0.02 + k)*6);
        g.stroke();
      }
      g.globalAlpha = 1;
    }
    speckle(g, w, h, 260, palette, 1, 3, 0.25);
  });
}

/* shaded sphere impostor */
function discURL(name, px){
  var pad = name === 'Sun' ? 0.9 : 0.25;
  var W = Math.round(px*(1 + pad*2)), H = W;
  var c = texCanvas(W, H, function(g){
    var cx = W/2, cy = H/2, r = px/2;
    if (name === 'Sun'){
      var halo = g.createRadialGradient(cx,cy,r*0.5, cx,cy,r*2.6);
      halo.addColorStop(0,'rgba(255,190,90,0.55)');
      halo.addColorStop(0.4,'rgba(255,160,60,0.18)');
      halo.addColorStop(1,'rgba(255,150,50,0)');
      g.fillStyle = halo; g.fillRect(0,0,W,H);
    }
    g.save();
    g.beginPath(); g.arc(cx,cy,r,0,Math.PI*2); g.clip();
    g.drawImage(SURF[name], cx-r, cy-r, r*2, r*2);
    var sh = g.createRadialGradient(cx - r*0.45, cy - r*0.45, r*0.1, cx, cy, r*1.15);
    sh.addColorStop(0, 'rgba(255,255,245,0.16)');
    sh.addColorStop(0.55, 'rgba(0,0,0,0)');
    sh.addColorStop(1, 'rgba(2,3,10,0.88)');
    g.fillStyle = sh; g.fillRect(0,0,W,H);
    g.restore();
    g.strokeStyle = 'rgba(224,180,100,0.22)';
    g.lineWidth = 1;
    g.beginPath(); g.arc(cx,cy,r,0,Math.PI*2); g.stroke();
  });
  return c.toDataURL('image/png');
}
function saturnURL(px){
  var W = Math.round(px*2.1), H = Math.round(px*1.35);
  var c = texCanvas(W, H, function(g){
    var cx = W/2, cy = H/2, r = px/2;
    var tilt = -16*DEG;
    g.translate(cx, cy); g.rotate(tilt); g.translate(-cx, -cy);
    function ringArc(a0, a1){
      for (var i = 0; i < 3; i++){
        var rr = r*(1.45 + i*0.22), rh = rr*0.30;
        g.strokeStyle = 'rgba(224,203,158,' + (0.55 - i*0.14) + ')';
        g.lineWidth = r*0.11;
        g.beginPath(); g.ellipse(cx, cy, rr, rh, 0, a0, a1); g.stroke();
      }
    }
    ringArc(Math.PI*0.02, Math.PI*0.98);
    g.translate(cx, cy); g.rotate(-tilt); g.translate(-cx, -cy);
    g.save();
    g.beginPath(); g.arc(cx,cy,r,0,Math.PI*2); g.clip();
    g.drawImage(SURF.Saturn, cx-r, cy-r, r*2, r*2);
    var sh = g.createRadialGradient(cx - r*0.45, cy - r*0.45, r*0.1, cx, cy, r*1.15);
    sh.addColorStop(0, 'rgba(255,255,245,0.15)');
    sh.addColorStop(0.55, 'rgba(0,0,0,0)');
    sh.addColorStop(1, 'rgba(2,3,10,0.88)');
    g.fillStyle = sh; g.fillRect(0,0,W,H);
    g.restore();
    g.translate(cx, cy); g.rotate(tilt); g.translate(-cx, -cy);
    ringArc(-Math.PI*0.98, -Math.PI*0.02);
  });

}
function nodeURL(px, tint){
  var W = Math.round(px*1.5), H = W;

    var cx = W/2, cy = H/2, r = px/2;
    g.shadowColor = 'rgba(' + tint + ',0.8)'; g.shadowBlur = px*0.12;

      g.lineWidth = 1.4 + Math.random()*1.6;

/* the Rising emblem: the EMERGE four-pointed spark, gold, softly haloed */
function risingURL(px){
  var W = Math.round(px*1.5), H = W;
  var c = texCanvas(W, H, function(g){
    var cx = W/2, cy = H/2, r = px/2;
    var halo = g.createRadialGradient(cx,cy,0, cx,cy,r*1.35);
    halo.addColorStop(0,'rgba(255,228,155,0.55)');
    halo.addColorStop(0.5,'rgba(242,200,110,0.18)');
    halo.addColorStop(1,'rgba(242,200,110,0)');
    g.fillStyle = halo; g.fillRect(0,0,W,H);
    g.fillStyle = '#F2DFAE';
    g.shadowColor = 'rgba(240,209,138,0.9)'; g.shadowBlur = px*0.16;
    g.beginPath();
    g.moveTo(cx, cy - r);
    g.quadraticCurveTo(cx + r*0.10, cy - r*0.10, cx + r, cy);
    g.quadraticCurveTo(cx + r*0.10, cy + r*0.10, cx, cy + r);
    g.quadraticCurveTo(cx - r*0.10, cy + r*0.10, cx - r, cy);
    g.quadraticCurveTo(cx - r*0.10, cy - r*0.10, cx, cy - r);
    g.fill();
    g.shadowBlur = 0;
  });
  return c.toDataURL('image/png');

/* ============================================================
   THE CHART — Western tropical wheel, exact template
   Outer house ring with numerals, graduated degree band,
   inner circle, faint spokes to center, crosshair axes.
   Fixed geometry. Only the bodies change.
   ============================================================ */
var NS = 'http://www.w3.org/2000/svg';
var VB = 1000;
var CX = VB/2, CY = VB/2;
var R_OUT  = 468;   // outer circle
var R_RING = 400;   // inner edge of house-number ring / outer tick circle
var R_TIN  = 366;   // inner tick circle
var R_NUM  = 434;   // house numerals radius
var R_PL   = 256;   // planet placement radius
function el(tag, attrs, parent){
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(e);
  return e;
}
var svg = document.createElementNS(NS, 'svg');
svg.setAttribute('viewBox', '0 0 ' + VB + ' ' + VB);
document.getElementById('chartWrap').appendChild(svg);

/* glow filter */
var defs = el('defs', {});
var filt = el('filter', { id:'gold', x:'-40%', y:'-40%', width:'180%', height:'180%' }, defs);
el('feGaussianBlur', { 'in':'SourceGraphic', stdDeviation:'2.6', result:'b' }, filt);
var fm = el('feMerge', {}, filt);
el('feMergeNode', { 'in':'b' }, fm);
el('feMergeNode', { 'in':'SourceGraphic' }, fm);

/* longitude -> screen point. House 1 opens at 9 o'clock; houses run
   counterclockwise. The wheel anchors to the first degree of the rising
   sign so every house sector holds exactly one whole sign. */
function pt(lonDeg, r){
  var a = Math.PI + (lonDeg - SIGN0)*DEG;
  return { x: CX + r*Math.cos(a), y: CY - r*Math.sin(a) };
}

/* --- crosshair axes (like the template: extend past the wheel) --- */
/* v18.57 (Jason's ruling): the crosshair axes are removed from the visual entirely.
   The group stays in the DOM hidden so every animation index below is untouched. */
var axisGroup = el('g', { stroke:'rgba(217,180,91,0.28)', 'stroke-width':'1.2', display:'none' });
var axisEls = [
  el('line', { x1:0,   y1:CY, x2:VB, y2:CY }, axisGroup),
  el('line', { x1:CX,  y1:0,  x2:CX, y2:VB }, axisGroup)
];
for (var ax = 0; ax < axisEls.length; ax++){
  axisEls[ax].style.strokeDasharray = VB;
  axisEls[ax].style.strokeDashoffset = VB;
}

/* --- the four circles, drawn from darkness --- */
var circleGroup = el('g', { stroke:'#e0b464', fill:'none', filter:'url(#gold)' });
var CIRCLES = [
  { r:R_OUT,  w:2.4 },
  { r:R_RING, w:2.0 },
  { r:R_TIN,  w:1.6 }
];
var circleEls = [];
for (var ci = 0; ci < CIRCLES.length; ci++){
  var cc = CIRCLES[ci];
  var ce = el('circle', { cx:CX, cy:CY, r:cc.r, 'stroke-width':cc.w }, circleGroup);
  var len = 2*Math.PI*cc.r;
  ce.style.strokeDasharray = len;
  ce.style.strokeDashoffset = len;
  ce.setAttribute('transform', 'rotate(180 ' + CX + ' ' + CY + ')'); // draw starts at Asc side
  circleEls.push({ e:ce, len:len });
}

/* --- house cusp dividers (heavy, across the outer ring) --- */
var cuspGroup = el('g', { stroke:'#e0b464', 'stroke-width':'2', 'stroke-linecap':'round', filter:'url(#gold)' });
var cuspEls = [];
for (var hcu = 0; hcu < 12; hcu++){
  var lon = norm360(SIGN0 + hcu*30);
  var p1 = pt(lon, R_RING), p2 = pt(lon, R_OUT);
  var le = el('line', { x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y }, cuspGroup);
  var ll = Math.hypot(p2.x-p1.x, p2.y-p1.y);
  le.style.strokeDasharray = ll;
  le.style.strokeDashoffset = ll;
  cuspEls.push({ e:le, len:ll });
}

/* --- faint spokes to the center (like the template's light rays) --- */
var R_CEN = 108;   // the center circle where the chart names itself
/* v18.56 (Jason's ruling): Placidus is CALCULATION ONLY. The wheel's visual is the
   original v18.51 composition, byte for byte: equal spokes, equal sectors, numbers at
   sector midpoints. The unequal cusps live in the math (g.house, readings, QA panel,
   calculation trace) and are never drawn. */
var spokeGroup = el('g', { stroke:'rgba(224,180,100,0.22)', 'stroke-width':'1.1' });
var spokeEls = [];
for (var sp = 0; sp < 12; sp++){
  var slon = norm360(SIGN0 + sp*30);
  var sPt = pt(slon, R_TIN);
  var sPt0 = pt(slon, R_CEN);
  var se = el('line', { x1:sPt0.x, y1:sPt0.y, x2:sPt.x, y2:sPt.y }, spokeGroup);
  var sl = Math.hypot(sPt.x-sPt0.x, sPt.y-sPt0.y);
  se.style.strokeDasharray = sl;
  se.style.strokeDashoffset = sl;
  spokeEls.push({ e:se, len:sl });

/* --- graduated degree band between R_TIN and R_RING --- */
var tickGroup = el('g', { 'stroke-linecap':'butt' });
var tickEls = [];
for (var td = 0; td < 360; td += 2){
  var tlon = norm360(SIGN0 + td);
  var major = td % 10 === 0;
  var cusp30 = td % 30 === 0;
  var rA = cusp30 ? R_TIN + 2 : (major ? R_TIN + 5 : R_TIN + 9);
  var rB = cusp30 ? R_RING - 2 : (major ? R_RING - 5 : R_RING - 9);
  var q1 = pt(tlon, rA), q2 = pt(tlon, rB);
  var te = el('line', {
    x1:q1.x, y1:q1.y, x2:q2.x, y2:q2.y,
    stroke: cusp30 ? '#e8c67a' : '#c9a45e',
    'stroke-width': cusp30 ? 2.6 : (major ? 1.9 : 1.1),
    opacity: 0
  }, tickGroup);
  tickEls.push({ e:te, off:td, op: cusp30 ? 0.9 : (major ? 0.55 : 0.3) });

/* --- house numbers: "1H"…"12H", floating inside their fixed sectors --- */
var R_HNUM = 320;
var numGroup = el('g', { 'font-family':'Georgia, serif', fill:'#d9a94f', 'text-anchor':'middle' });
var numEls = [];
for (var hn = 1; hn <= 12; hn++){
  var nlon = norm360(SIGN0 + (hn - 1)*30 + 15);      /* v18.56: original position, visual unchanged */
  var np = pt(nlon, R_HNUM);
  var t = el('text', { x:np.x, y:np.y + 11, 'font-size':'34', opacity:'0' }, numGroup);
  var tnum = document.createElementNS(NS, 'tspan');
  tnum.textContent = hn;
  t.appendChild(tnum);
  var tH = document.createElementNS(NS, 'tspan');
  tH.setAttribute('font-size', '23');
  tH.textContent = 'H';
  t.appendChild(tH);

}

/* --- the zodiac ring: sign names on the outer band, rotated so the
   rising sign fills house 1. The band turns; the wheel never does. --- */
var signGroup = el('g', { 'font-family':'Georgia, serif', fill:'#e8c67a', 'text-anchor':'middle' });
var signEls = [];
for (var zs = 0; zs < 12; zs++){
  var zlon = norm360(SIGN0 + zs*30 + 15);
  var zp = pt(zlon, R_NUM);
  var rot = Math.atan2(zp.y - CY, zp.x - CX)*RAD + 90;
  rot = ((rot % 360) + 360) % 360;
  if (rot > 90 && rot < 270) rot += 180;   // keep every name right-side up
  var zt = el('text', { x:zp.x, y:zp.y, dy:'0.34em', 'font-size':'30', opacity:'0',
    transform:'rotate(' + rot.toFixed(2) + ' ' + zp.x.toFixed(2) + ' ' + zp.y.toFixed(2) + ')' }, signGroup);
  zt.textContent = SIGNS[(ascSign + zs) % 12];

/* --- the center: the chart names itself --- */
var cenCircle = el('circle', { cx:CX, cy:CY, r:R_CEN, stroke:'#e0b464', 'stroke-width':'1.4',
  fill:'rgba(4,6,13,0.55)', opacity:'0', filter:'url(#gold)' });
var cenT1 = el('text', { x:CX, y:CY - 8, 'text-anchor':'middle',
  'font-family':'Georgia, serif', 'font-size':'26', fill:'#f0e0b4', opacity:'0' });

var cenT2 = el('text', { x:CX, y:CY + 26, 'text-anchor':'middle',

/* per-house placement: a body is ALWAYS displayed inside its own
   whole-sign house sector — it can never drift across a cusp.
   Singles sit at their true degree within the sign; crowds spread
   across the sector and step inward on staggered radii, so a
   stellium stacks rather than spills into the next house.
   The gold pointer always marks the exact degree on the band.
   The Rising is pinned to the eastern horizon — the 9 o'clock
   horizontal — permanently. It is the wheel's anchor, not a body. */
(function(){
  var groups = {};
  for (var i = 0; i < BODIES.length; i++){
    var b = BODIES[i];
    if (b.key === 'Rising'){
      b.disp = 0;                 // exactly on the eastern horizon
      b.rad = R_PL;
      b.crowd = 1;
      continue;
    }
    (groups[b.wsHouse] = groups[b.wsHouse] || []).push(b);
  }
  for (var h in groups){
    var list = groups[h].sort(function(a, b2){ return (a.trop % 30) - (b2.trop % 30); });
    var n = list.length;
    var sectorStart = (h - 1)*30;
    if (n === 1){
      var d = list[0].trop % 30;
      list[0].disp = sectorStart + Math.min(24, Math.max(6, d));
      list[0].rad = R_PL;
      list[0].crowd = 1;
      continue;
    }
    var sp = Math.min(22/(n - 1), 12);
    var base = 15 - sp*(n - 1)/2;
    for (var j = 0; j < n; j++){
      list[j].disp = sectorStart + base + j*sp;
      list[j].rad = n >= 5 ? [R_PL + 26, R_PL - 44, R_PL - 112][j % 3]
                  : (j % 2 ? R_PL - 62 : R_PL + 14);
      list[j].crowd = n >= 5 ? 0.62 : (n >= 3 ? 0.8 : 0.92);
    }
  }
})();

   ============================================================ */
(function runOpeningSequence(){
// whisper home: this page owns its whole opening — the index only routes
  // here. Whisper in ~0.9s, out ~4.2s, tap-to-reveal arms at 5.6s. The void
  // is this page's waiting bed (starts on the page's first touch — iPhone

function frame(now){
  requestAnimationFrame(frame);
  var t = (t0 === null) ? 0 : (now - t0)/1000*SPEED;
  if (window.__numPulsed === undefined) window.__numPulsed = 0;
  while (window.__numPulsed < 12 && t >= T.numsA + window.__numPulsed * T.numStep) {
    window.__numPulsed++;
    try { EMERGE_SOUND.numpulse(); } catch(_){}
  }
  try { EMERGE_SOUND.tick({ drawbed: T.coordsIn, construction: T.axes, sweep: T.sweepA, tokens: T.bodyA }, t); } catch(_){}

  /* background drifts forever */
  camera.rotation.y = 0.35 + t*0.0045;
  camera.rotation.x = 0.14 + 0.05*Math.sin(t*0.021);

  /* whisper beat moved before the tap gate; timeline slot retired,
     all later beats keep their original times */

  /* locate beat */
  var lIn = sstep((t - T.locA)/0.9);
  var lOut = 1 - sstep((t - T.locHold - 0.9)/0.7);
  var lop = Math.min(lIn, Math.max(0, lOut));
  locH.style.opacity = lop*0.8;
  locV.style.opacity = lop*0.8;
  locRing.style.opacity = lop*0.9;
  locRing.style.transform = 'scale(' + (2.4 - 1.9*sstep((t - T.locA)/1.4)) + ')';
  if (t > T.coordsIn && t < T.coordsOut) coords.classList.add('show');
  else coords.classList.remove('show');

  /* crosshair axes */
  for (var a2 = 0; a2 < axisEls.length; a2++){
    var pa = easeOut((t - T.axes - a2*0.25)/T.axesDur);
    axisEls[a2].style.strokeDashoffset = VB*(1 - pa);
  }

  /* circles drawn from darkness */
  for (var i = 0; i < circleEls.length; i++){
    var pc = easeOut((t - T.circ - i*T.circStep)/T.circDur);
    circleEls[i].e.style.strokeDashoffset = circleEls[i].len*(1 - pc);
  }

  /* house cusp dividers */
  for (var c2 = 0; c2 < cuspEls.length; c2++){
    var pcu = easeOut((t - T.cusp - c2*T.cuspStep)/T.cuspDur);
    cuspEls[c2].e.style.strokeDashoffset = cuspEls[c2].len*(1 - pcu);
  }

  /* faint spokes */
  for (var s2 = 0; s2 < spokeEls.length; s2++){
    var ps = easeOut((t - T.spoke - s2*T.spokeStep)/T.spokeDur);
    spokeEls[s2].e.style.strokeDashoffset = spokeEls[s2].len*(1 - ps);
  }

  /* degree band sweeps around from the Ascendant */
  var tp = clamp01((t - T.ticks)/T.tickDur);
  var reach = tp*372;   // slight overshoot so the last ticks land
  for (var td2 = 0; td2 < tickEls.length; td2++){
    var tk = tickEls[td2];
    var vis = reach > tk.off ? sstep((reach - tk.off)/14) : 0;
    tk.e.setAttribute('opacity', tk.op*vis);
  }

  /* the center names the chart */
  var cp = sstep((t - T.cenA)/1.2);
  cenCircle.setAttribute('opacity', cp*0.9);
  cenT1.setAttribute('opacity', cp*0.95);
  cenT2.setAttribute('opacity', cp*0.85);

  /* the zodiac ring takes the outer band, house 1 first */
  for (var z2 = 0; z2 < 12; z2++)
    signEls[z2].setAttribute('opacity', 0.95*sstep((t - T.signsA - z2*T.signStep)/0.8));

  /* house numbers */
  for (var n = 0; n < 12; n++)
    numEls[n].setAttribute('opacity', 0.85*sstep((t - T.numsA - n*T.numStep)/0.8));

  /* calculation: one pass of light */
  var sp2 = (t - T.sweepA)/T.sweepDur;
  if (sp2 > 0 && sp2 < 1){
    sweep.setAttribute('opacity', Math.sin(sp2*Math.PI));
    sweep.setAttribute('x', -380 + (VB + 760)*sp2);
  } else sweep.setAttribute('opacity', 0);

  /* the twelve bodies take the wheel */
  for (var g2 = 0; g2 < bodyEls.length; g2++){
    var ge = bodyEls[g2];
    var dly = g2 === 0 ? 0 : 0.7 + g2*T.bodyStep;   // the Rising leads; a breath; then the procession
    var pg = sstep((t - T.bodyA - dly)/T.bodyDur);
    ge.node.setAttribute('opacity', pg);
    ge.leader.setAttribute('opacity', pg*0.9);
    ge.pointer.setAttribute('opacity', pg);
    var sc = 0.7 + 0.3*easeOut(pg);
    var dy = 26*(1 - easeOut(pg));
    ge.node.setAttribute('transform', 'translate(' + ge.x + ' ' + (ge.y + dy) + ') scale(' + sc + ')');
  }

  /* NEW: 3D CHART SUMMARY REVEAL — completion watch + animation hook */
  if (!chartRevealFired && t > CHART_DONE_T){ chartRevealFired = true; onChartRevealComplete(); }
  if (summaryTick) summaryTick(now);

  renderer.render(scene, camera);
}

/* ============================================================
   STEP 2 + 3 — rank, merge overlaps, resolve redundancy
   ============================================================ */
function selectThemes(T){
  /* merge: if two themes share a tag, keep the stronger, absorb sources */
  var byTag = {};
  T.forEach(function(t){ t.tags.forEach(function(tag){ (byTag[tag] = byTag[tag] || []).push(t); }); });
  Object.keys(byTag).forEach(function(tag){
    if (tag === 'integration' || tag === 'edge') return;
    var cats = {};
    byTag[tag].forEach(function(t){ (cats[t.category] = cats[t.category] || []).push(t); });
    Object.keys(cats).forEach(function(cat){
      var group = cats[cat].slice().sort(function(a,b){ return b.strength - a.strength; });
      for (var k = 1; k < group.length; k++){
        group[0].sources = group[0].sources.concat(group[k].sources);
        group[k].dropped = true;
      }
    });
  });
  /* merge gifts that live in the same house so the arena is named once */
  var giftPlanets = T.filter(function(t){ return /^gift-(mercury|venus|jupiter|mars|saturn)$/.test(t.id) && !t.dropped; });
  var byHouse = {};
  giftPlanets.forEach(function(t){
    var m = t.sources[0].match(/house (\d+)/);
    if (m) (byHouse[m[1]] = byHouse[m[1]] || []).push(t);
  });
  var GIFT_QUALITY = { mercury:'clear words and quick understanding', venus:'warmth and a feel for beauty',
    jupiter:'wisdom and encouragement', mars:'drive and courage', saturn:'steadiness and follow-through' };
  Object.keys(byHouse).forEach(function(h){
    if (byHouse[h].length >= 2){
      var g = byHouse[h].sort(function(a,b){ return b.strength - a.strength; });
      var quals = g.map(function(t){ return GIFT_QUALITY[t.id.replace('gift-','')]; });
      g[0].statement = 'You bring ' + (quals.length === 2 ? quals[0] + ' together with ' + quals[1]
        : quals.slice(0,-1).join(', ') + ', together with ' + quals[quals.length-1]) +
        ' into ' + ARENA_HUMAN[+h - 1] + ', a combination people remember.';
      for (var k = 1; k < g.length; k++){ g[0].sources = g[0].sources.concat(g[k].sources); g[k].dropped = true; }
      g[0].strength += 0.08;
    }
  });

  var pick = function(cat, n){
    return T.filter(function(t){ return t.category === cat && !t.dropped; })
            .sort(function(a,b){ return b.strength - a.strength; })
            .slice(0, n);
  };
  return {
    identity:  pick('identity', 6),
    innerWorld:pick('innerWorld', 6),
    gifts:     pick('gifts', 4),
    direction: pick('direction', 6)
  };
}

/* ============================================================
   STEP 4 — write the visible summary + hidden trace
   ============================================================ */
function buildHumanSummary(MODE){
  var T = deriveThemes(MODE);
  var S = selectThemes(T);
  var trace = [];
  var usedArenas = {};

  function compose(sectionName, themes, order){
    var ordered = order
      ? order.map(function(id){ return themes.filter(function(t){ return t.id === id; })[0]; }).filter(Boolean)
        .concat(themes.filter(function(t){ return order.indexOf(t.id) === -1; }))
      : themes;
    var text = ordered.map(function(t){
      var s = t.statement;
      for (var ai = 0; ai < 12; ai++){
        if (s.indexOf(ARENA_HUMAN[ai]) >= 0){
          if (usedArenas[ai]) s = s.split(ARENA_HUMAN[ai]).join(ARENA_ALIAS[ai]);
          usedArenas[ai] = true;
        }
      }
      return s;
    }).join(' ');
    trace.push({ section: sectionName,
      themesUsed: ordered.map(function(t){ return t.id; }),
      sourcePlacements: ordered.reduce(function(a,t){ return a.concat(t.sources); }, []) });
    return { text: text, themes: ordered };
  }

  var one   = compose('WHO YOU ARE', S.identity, ['temperament','as-others-see-you','core-drive','vitality-arena','life-emphasis','engagement','temperament-edge']);
  var two   = compose('YOUR INNER WORLD', S.innerWorld,
                ['emotional-nature','emotional-need','integration-harmony-honesty','emotional-arena','emotional-style','emotional-texture']);
  var three = compose('YOUR NATURAL GIFTS', S.gifts, ['gift-lead']);
  var four  = compose('YOUR DIRECTION AND GROWTH', S.direction,
                ['growth-familiar','growth-direction','integration-private-public','concentration','relationship-pattern','career-focus','direction-contribution','growth-takeaway']);

  /* word budget 450-650: trim the lowest-strength optional themes first */
  function words(s){ return s.split(/\s+/).filter(Boolean).length; }
  var total = words(one.text) + words(two.text) + words(three.text) + words(four.text);
  var optional = ['emotional-texture','core-drive','engagement'];
  var sections = [one, two, three, four];
  for (var oi = 0; oi < optional.length && total > 650; oi++){
    for (var si = 0; si < sections.length; si++){
      var idx = sections[si].themes.findIndex(function(t){ return t.id === optional[oi]; });
      if (idx >= 0){
        total -= words(sections[si].themes[idx].statement);
        sections[si].themes.splice(idx, 1);
        sections[si].text = sections[si].themes.map(function(t){ return t.statement; }).join(' ');
      }
    }
  }
  try { console.log('[EMERGE TRACE]', JSON.stringify(trace)); } catch(e){}
  return { one: one.text, two: two.text, three: three.text, four: four.text, __trace: trace };
}

/* ---------- particles: a small 2d canvas, no second WebGL renderer ---------- */
var fx = document.getElementById('fx');
var fxc = null, dots = [], DOT_MAX = (window.innerWidth < 700 ? 42 : 90);
var fieldPt = { x:0, y:0 };
function fxResize(){
  var d = Math.min(window.devicePixelRatio || 1, 2);
  fx.width = window.innerWidth * d;
  fx.height = window.innerHeight * d;
  fx.getContext('2d').setTransform(d, 0, 0, d, 0, 0);
  fieldPt.x = window.innerWidth/2;
  fieldPt.y = window.innerHeight * (window.innerWidth < 700 ? 0.63 : 0.61);
}
function spawnDot(gather){
  var a = Math.random()*Math.PI*2;
  var r = (Math.min(window.innerWidth, 440)*0.42) * (0.55 + Math.random()*0.5);
  var x = fieldPt.x + Math.cos(a)*r;
  var y = fieldPt.y + Math.sin(a)*r*0.28;
  return {
    x:x, y:y,
    vx: gather ? (fieldPt.x - x)*0.006 : (Math.random()-0.5)*0.12,
    vy: gather ? (fieldPt.y - y)*0.006 - 0.15 : -0.12 - Math.random()*0.2,
    life: 0, span: 2.4 + Math.random()*3.2,
    r: 0.6 + Math.random()*1.3
  };
}

/* per-frame work, driven by the existing render loop */
function tickReveal(now){
  var s = (now - phaseT0)/1000;

  /* Ascendant star awakens as the chart begins its tilt */
  var g = sstep((s - 0.55)/1.4);
  var breathe = phase === 'resting' ? 0.86 + 0.1*Math.sin(now*0.0012) : 1;
  ascGlow.setAttribute('opacity', String(0.95*g*breathe));

  /* particles */
  if (fxc){
    var gather = phase !== 'resting';
    if (dots.length < DOT_MAX && Math.random() < (gather ? 0.7 : 0.25)) dots.push(spawnDot(gather));
    fxc.clearRect(0, 0, window.innerWidth, window.innerHeight);
    fxc.globalCompositeOperation = 'lighter';
    for (var i = dots.length - 1; i >= 0; i--){
      var d = dots[i];
      d.life += 1/60;
      d.x += d.vx; d.y += d.vy;
      d.vx *= 0.985; d.vy *= 0.992;
      var a = Math.sin(Math.PI*clamp01(d.life/d.span)) * 0.55;
      if (d.life >= d.span){ dots.splice(i, 1); continue; }
      fxc.beginPath();
      fxc.arc(d.x, d.y, d.r, 0, Math.PI*2);
      fxc.fillStyle = 'rgba(240, 210, 140,' + a.toFixed(3) + ')';
      fxc.fill();
    }
    fxc.globalCompositeOperation = 'source-over';
  }

  /* restrained dimensional response on the card */
  if (bodyEl.classList.contains('cardUp')){
    var rx, ry;
    if (IS_COARSE){
      ry = 2.0*Math.sin(now*0.00023);
      rx = 1.2*Math.sin(now*0.00017 + 1.4);
    } else {
      ry = parallax.ty; rx = parallax.tx;
      parallax.ry += (ry - parallax.ry)*0.06;
      parallax.rx += (rx - parallax.rx)*0.06;
      ry = parallax.ry; rx = parallax.rx;
    }
    cardEl.style.transform = 'rotateY(' + ry.toFixed(2) + 'deg) rotateX(' + rx.toFixed(2) + 'deg)';
  }
}

if (!IS_COARSE){
  window.addEventListener('pointermove', function(e){
    parallax.ty = ((e.clientX / window.innerWidth) - 0.5) * 5;    /* max ±2.5deg */
    parallax.tx = (0.5 - (e.clientY / window.innerHeight)) * 3;   /* max ±1.5deg */
  });
}

/* v18.50: the result page owns its own zoom.
   v18.49 turned on BROWSER pinch by rewriting the viewport meta. That is what
   made the page disappear: #chartResultPage is position:fixed inside a fixed
   parent, and iOS does not pan fixed layers with the visual viewport, so the
   first pinch pushed the reading off screen with no way back. The viewport
   stays locked at scale 1 in both documents; instead the page transforms its
   own content, so a zoom holds until the reader ends it — nothing times out,
   nothing scrolls away, and the reading stays exactly where they put it.
   Pinch to scale 1x-4x, one finger to pan while zoomed, pinch back to 1x to
   return to normal scrolling. */
var TR_ZMIN = 1, TR_ZMAX = 4;
var trZ = 1, trTX = 0, trTY = 0;
var trPinch = null, trPan = null;

function trZoomApply(){
  var page = document.getElementById('chartResultPage');
  var inner = page && page.querySelector('.tr-page');
  if (!inner) return;
  if (trZ <= 1.001){
    trZ = 1;
    inner.style.transform = '';                    /* clean at 1x so position:sticky keeps working */
    inner.style.transformOrigin = '';
    page.style.overflowY = 'auto';
    page.style.touchAction = 'pan-y';
    if (trTY){ page.scrollTop = -trTY; trTX = 0; trTY = 0; }
  } else {
    inner.style.transformOrigin = '0 0';
    inner.style.transform = 'translate(' + trTX.toFixed(2) + 'px,' + trTY.toFixed(2) + 'px) scale(' + trZ.toFixed(4) + ')';
    page.style.overflowY = 'hidden';
    page.style.touchAction = 'none';
  }
}
function trZoomClamp(){
  var page = document.getElementById('chartResultPage');
  var inner = page && page.querySelector('.tr-page');
  if (!inner) return;
  var vw = page.clientWidth, vh = page.clientHeight;
  var cw = inner.offsetWidth * trZ, ch = inner.offsetHeight * trZ;
  var left = inner.offsetLeft * trZ;
  trTX = (cw <= vw) ? (vw - cw)/2 - left : Math.min(-left, Math.max(vw - cw - left, trTX));
  trTY = (ch <= vh) ? 0 : Math.min(0, Math.max(vh - ch, trTY));
}
function trTouchMid(t0, t1, page){
  var r = page.getBoundingClientRect();
  return { x:(t0.clientX + t1.clientX)/2 - r.left, y:(t0.clientY + t1.clientY)/2 - r.top };
}
function trTouchDist(t0, t1){
  return Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY) || 1;
}
function trZoomWire(){
  var page = document.getElementById('chartResultPage');
  if (!page || page.__zoomWired) return;
  page.__zoomWired = true;

  page.addEventListener('touchstart', function(e){
    if (e.touches.length === 2){
      if (trZ === 1){ trTY = -page.scrollTop; trTX = 0; }   /* fold the current scroll into the transform */
      var m = trTouchMid(e.touches[0], e.touches[1], page);
      trPinch = { d:trTouchDist(e.touches[0], e.touches[1]), z:trZ, tx:trTX, ty:trTY, m:m };
      trPan = null;
      e.preventDefault();
    } else if (e.touches.length === 1 && trZ > 1){
      trPan = { x:e.touches[0].clientX, y:e.touches[0].clientY, tx:trTX, ty:trTY };
    }
  }, { passive:false });

  page.addEventListener('touchmove', function(e){
    if (trPinch && e.touches.length === 2){
      var k = trTouchDist(e.touches[0], e.touches[1]) / trPinch.d;
      var nz = Math.max(TR_ZMIN, Math.min(TR_ZMAX, trPinch.z * k));
      var cx = (trPinch.m.x - trPinch.tx) / trPinch.z;      /* content point under the first midpoint */
      var cy = (trPinch.m.y - trPinch.ty) / trPinch.z;
      var m = trTouchMid(e.touches[0], e.touches[1], page);
      trZ = nz; trTX = m.x - cx*nz; trTY = m.y - cy*nz;
      trZoomClamp(); trZoomApply();
      e.preventDefault();
    } else if (trPan && e.touches.length === 1 && trZ > 1){
      trTX = trPan.tx + (e.touches[0].clientX - trPan.x);
      trTY = trPan.ty + (e.touches[0].clientY - trPan.y);
      trZoomClamp(); trZoomApply();
      e.preventDefault();
    }
  }, { passive:false });

  function end(e){
    if (e.touches.length < 2) trPinch = null;
    if (e.touches.length === 0) trPan = null;
    trZoomClamp(); trZoomApply();
  }
  page.addEventListener('touchend', end);
  page.addEventListener('touchcancel', end);
  window.addEventListener('resize', function(){ trZoomClamp(); trZoomApply(); });
}

   compare-reading.html C1.3). Every checkout goes through the same living-page seam
   the Vedic door already used: ask index.html to swap the frame in place so the sound
   engine survives; fall back to a top-window navigation only when there is no parent. */
function cozHandoff(kind, href){
  var handed = false;
  try {
    if (window.parent !== window) {
      window.parent.postMessage({ coz: 'GOTO_' + kind, href: href }, '*');
      handed = true;
    }
  } catch(_){}
  if (!handed) { try { (window.top || window).location.href = href; } catch(_) { location.href = href; } }
}
function cozAscendants(){
  /* returns { sidereal, tropical } sign names in lowercase, from THIS file's calculation */
  var sid = ascSign;
  try {
    var jd   = BIRTH.utc.getTime()/86400000 + 2440587.5;
    var t19  = (jd - 2415020.0)/36525.0;
    var ayan = 22.4881406 + 1.2025810*t19 + 0.2622463*t19*t19 - 0.1101570*t19*t19*t19;
    sid = Math.floor((((ASC - ayan) % 360) + 360) % 360 / 30);
  } catch(_){}
  return { sidereal: SIGNS[sid].toLowerCase(), tropical: SIGNS[ascSign].toLowerCase() };
}

/* FULL PICTURE INTRO (Sep 3 ruling): the page enters as the whole picture, holds
   ~3s, then zooms in to the readable view — the same pattern as the reading
   pages. Runs on .dash-scale so it can never fight the pinch zoom (.dash-art). */
function dashIntroZoom(ov){
  if (REDUCED) return;
  var sc = ov.querySelector('.dash-scale'); if (!sc || sc.__introDone) return;
  sc.__introDone = true;
  var run = function(){
    var full = sc.offsetHeight, vh = window.innerHeight;
    if (!full || full <= vh * 1.05) return;
    var s = vh / full;
    /* Sep 21 fix: the intro is decorative only. Buttons stay tappable the whole
       time (no pointer-events lock; transformed hotspots still hit-test
       correctly). Pinch waits for the intro via __introLock, and a failsafe
       restores everything even if a timer or transition is lost. */
    var restored = false, restore = function(){
      if (restored) return; restored = true;
      sc.style.transition = ''; sc.style.transform = ''; sc.style.pointerEvents = '';
      ov.style.overflow = ''; ov.__introLock = false;
      try { ov.scrollTop = 0; } catch(_){}
    };
    try {
      ov.__introLock = true;
      sc.style.transition = 'none';
      sc.style.transform = 'scale(' + s.toFixed(4) + ')';
      ov.style.overflow = 'hidden';
      window.setTimeout(function(){
        try {
          sc.style.transition = 'transform 1.8s cubic-bezier(0.22,0.61,0.36,1)';
          sc.style.transform = 'scale(1)';
        } catch(_){ restore(); }
        window.setTimeout(restore, 1950);
      }, 3000);
      window.setTimeout(restore, 6000);          /* failsafe */
    } catch(e){ restore(); }
  };
  var imgs = Array.prototype.slice.call(sc.querySelectorAll('img'));
  var pending = imgs.filter(function(i){ return !i.complete; }).length;
  if (!pending){ run(); return; }
  imgs.forEach(function(i){
    if (i.complete) return;
    var done = function(){ if (--pending === 0) run(); };
    i.addEventListener('load', done, { once:true });
    i.addEventListener('error', done, { once:true });
  });
}

/* ============================================================
   PRICING PAGE ZOOM (Sep 1 ruling): two fingers scale the pricing art 1x-3x
   about the pinch point, one finger pans while zoomed, pinch back to 1x for
   normal scrolling. The tap targets live inside the art, so they scale with it.
   ============================================================ */
(function(){
  var z = 1, tx = 0, ty = 0, pinch = null, pan = null;
  function wrapEl(){ var d = document.getElementById('unlockDash'); return d && d.querySelector('.dash-art'); }
  function dist(a, b){ return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); }
  function mid(a, b){ return { x:(a.clientX + b.clientX)/2, y:(a.clientY + b.clientY)/2 }; }
  function apply(){
    var d = document.getElementById('unlockDash'), w = wrapEl(); if (!d || !w) return;
    if (z <= 1.001){ z = 1; tx = 0; ty = 0; w.style.transform = ''; w.style.transformOrigin = ''; d.style.overflowY = 'auto'; }
    else { w.style.transformOrigin = '0 0'; w.style.transform = 'translate(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px) scale(' + z.toFixed(4) + ')'; d.style.overflowY = 'hidden'; }
  }
  function clamp(){
    var d = document.getElementById('unlockDash'), w = wrapEl(); if (!d || !w) return;
    var vw = d.clientWidth, vh = d.clientHeight, cw = w.offsetWidth * z, ch = w.offsetHeight * z;
    tx = Math.min(0, Math.max(vw - cw, tx));
    ty = Math.min(0, Math.max(vh - ch, ty));
  }
  function wire(){
    var d = document.getElementById('unlockDash'); if (!d || d.__pzWired) return; d.__pzWired = true;
    d.addEventListener('touchstart', function(e){
      var w = wrapEl(); if (!w || d.__introLock) return;
      if (e.touches.length === 2){
        if (z === 1){ ty = -d.scrollTop; tx = 0; }
        var m = mid(e.touches[0], e.touches[1]);
        pinch = { d:dist(e.touches[0], e.touches[1]) || 1, z:z, tx:tx, ty:ty, m:m }; pan = null;
        e.preventDefault();
      } else if (e.touches.length === 1 && z > 1){
        pan = { x:e.touches[0].clientX, y:e.touches[0].clientY, tx:tx, ty:ty, moved:false };
      }
    }, { passive:false });
    d.addEventListener('touchmove', function(e){
      if (pinch && e.touches.length === 2){
        var k = dist(e.touches[0], e.touches[1]) / pinch.d;
        var nz = Math.max(1, Math.min(3, pinch.z * k));
        var cx = (pinch.m.x - pinch.tx) / pinch.z, cy = (pinch.m.y - pinch.ty) / pinch.z;
        var m = mid(e.touches[0], e.touches[1]);
        z = nz; tx = m.x - cx * nz; ty = m.y - cy * nz;
        if (z <= 1.001){ z = 1; }
        clamp(); apply(); e.preventDefault();
      } else if (pan && e.touches.length === 1 && z > 1){
        tx = pan.tx + (e.touches[0].clientX - pan.x); ty = pan.ty + (e.touches[0].clientY - pan.y);
        if (Math.abs(e.touches[0].clientX - pan.x) + Math.abs(e.touches[0].clientY - pan.y) > 8) pan.moved = true;
        clamp(); apply(); e.preventDefault();
      }
    }, { passive:false });
    function end(e){ if (e.touches.length < 2) pinch = null; if (e.touches.length === 0){ if (pan && pan.moved) d.__pzSwallow = true; pan = null; } clamp(); apply(); }
    d.addEventListener('touchend', end); d.addEventListener('touchcancel', end);
    /* a pan must not fire the button underneath when the finger lifts */
    d.addEventListener('click', function(e){ if (d.__pzSwallow){ d.__pzSwallow = false; e.stopPropagation(); e.preventDefault(); } }, true);
  }
  window.addEventListener('EMERGE_UNLOCK_READING_REQUESTED', function(){ setTimeout(wire, 50); });
  var mo = new MutationObserver(function(){ if (document.getElementById('unlockDash')) { wire(); mo.disconnect(); } });
  mo.observe(document.body, { childList:true });
})();

/* ============================================================
   RESULT PAGE ZOOM, reflow version (Sep 1): replaces the transform zoom, which
   could slide the page into black. Two fingers scale the text 1x-2.2x with CSS
   zoom, so it reflows to the screen width and the page keeps scrolling normally.
   ============================================================ */
function trZoomWire(){
  var page = document.getElementById('chartResultPage');
  if (!page || page.__zoomWired) return;
  page.__zoomWired = true;
  var inner = page.querySelector('.tr-page');
  var z = 1, pinch = null;
  function dist(a, b){ return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); }
  page.addEventListener('touchstart', function(e){
    if (e.touches.length === 2){ pinch = { d:dist(e.touches[0], e.touches[1]) || 1, z:z }; e.preventDefault(); }
  }, { passive:false });
  page.addEventListener('touchmove', function(e){
    if (!pinch || e.touches.length !== 2 || !inner) return;
    z = Math.max(1, Math.min(2.2, pinch.z * dist(e.touches[0], e.touches[1]) / pinch.d));
    inner.style.zoom = z.toFixed(3);
    e.preventDefault();
  }, { passive:false });
  function end(e){ if (e.touches.length < 2) pinch = null; }
  page.addEventListener('touchend', end); page.addEventListener('touchcancel', end);
}

</script>
