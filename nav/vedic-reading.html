<!DOCTYPE html>

<head>
<meta charset="utf-8">
<!-- NAV TEST N2.0 (CozAlyze/Test only): the test storage guard (test-storage.js), pasted first so it runs before
     any other script: storage under cozTEST:, no reading servers, art and data from /Demo/ -->
<script>
/* COZ TEST STORAGE · NAV TEST N2.0 (Oct 15 2026; N1.1 r2's guard, hardened after the N2 isolation review)
   CozAlyze/Test/nav only, never the Demo.
   The build pastes this file, unchanged, as the first script inside every page in this folder except
   test-setup.html, so it cannot fail to load (a missing or late separate file would let a page run on the
   Demo's own storage). This copy is the readable source; no page loads it as a separate file.
   The Test and the Demo are on the same site (cozalyze.github.io), so they share the phone's storage.
   This keeps the test pages away from the Demo's data and from the reading servers.

   1. STORAGE. Every localStorage and sessionStorage read and write made on a test page, including by
      the scripts these pages load, goes to keys that start with "cozTEST:". A test page never sees or
      changes a Demo key (saved charts, the current chart, readings, the tester password). The build
      refuses any page or script that uses storage any other way (property-style access, another
      window's or frame's storage, IndexedDB, cookies, workers) and every script is a pinned copy in
      this folder. Storage events from Demo writes (another tab) never reach the test pages.
   2. ROOM FOR THE DEMO. A test write that would take the site's stored data past about 4 MB is refused
      (QuotaExceededError, which the pages already handle as "not enough space"), so the test can never
      crowd the Demo out of the phone's storage.
   3. NETWORK. A test page may request files from this site and from the font and script hosts the pages
      already use. Anything else is refused before it is sent: the reading servers (*.netlify.app) and the
      model (api.anthropic.com) included. No reading can be started, continued or paid for from a test page.
      The build refuses any page or script that names another host.
   4. FRAMES AND WINDOWS. A frame or a new window may only open one of this folder's own pages (PAGES
      below; a refused frame shows a blank page). Never a Demo page, the setup page, a missing page, or
      an inline (srcdoc) frame, any of which could run without this guard.
   5. FAIL CLOSED. If any part of this guard cannot be installed, the page stops before anything else runs
      and says so.

   Art, video, styles and data files load from the Demo folder on the same site (window.COZ_TEST_ASSETS).
   Anything refused is listed in window.__cozTestBlocked and the console. */
(function () {
  if (window.__cozTestStorage) return;
  window.__cozTestStorage = "N2.0";
  var P = "cozTEST:";
  /* this folder's own pages (the build checks this list against the pages it builds) */
  var PAGES = ["account.html", "saved-charts.html",
    "vedic-reading.html", "vedic-birth-chart.html", "saved-vedic-document.html", "current-life-cycle.html",
    "current-season.html", "key-time-windows.html", "what-comes-next.html",
    "tropical-reading.html", "tropical-birth-chart.html", "tropical-current-transits.html", "saved-tropical-document.html",
    "compare-reading.html", "combined-reading.html", "your-ascendants.html", "ascendant-reading.html",
    "compare-current-timing.html", "compare-current-timing-reading.html", "compare-birth-charts.html",
    "compare-system.html", "saved-compare-document.html"];
  try {
    /* ---------- 1. storage ---------- */
    var proto = Storage.prototype;
    var g = proto.getItem, s = proto.setItem, r = proto.removeItem, k = proto.key;
    var lenDesc = Object.getOwnPropertyDescriptor(proto, "length");
    var rawLen = function (st) { return lenDesc.get.call(st); };
    var testKeys = function (st) {
      var out = [], n = rawLen(st), i, key;
      for (i = 0; i < n; i++) { key = k.call(st, i); if (key && key.indexOf(P) === 0) out.push(key.slice(P.length)); }
      return out;
    };
    /* ---------- 2. room for the Demo (localStorage is shared with it; sessionStorage is per tab) ---------- */
    var CAP = 4.0 * 1048576;                                          /* estimated bytes, 2 per character */
    var LOCAL = null; try { LOCAL = window.localStorage; } catch (e) {}
    var usedBytes = function (st) {
      var n = rawLen(st), t = 0, i, key, v;
      for (i = 0; i < n; i++) { key = k.call(st, i); v = key == null ? null : g.call(st, key); t += ((key ? key.length : 0) + (v ? v.length : 0)) * 2; }
      return t;
    };
    proto.getItem = function (key) { return g.call(this, P + key); };
    proto.setItem = function (key, v) {
      var pk = P + key;
      if (this === LOCAL) {
        var old = g.call(this, pk), add = (pk.length + String(v).length) * 2 - (old != null ? (pk.length + old.length) * 2 : 0);
        if (add > 0 && usedBytes(this) + add > CAP) {
          try { console.warn("[COZ TEST] write refused: it would crowd the Demo's storage (" + key + ")"); } catch (e) {}
          throw new DOMException("The CozAlyze test keeps room free for the Demo.", "QuotaExceededError");
        }
      }
      return s.call(this, pk, v);
    };
    proto.removeItem = function (key) { return r.call(this, P + key); };
    proto.key = function (i) { var a = testKeys(this); i = Math.floor(Number(i)); return i >= 0 && i < a.length ? a[i] : null; };
    proto.clear = function () { var st = this; testKeys(st).forEach(function (key) { r.call(st, P + key); }); };
    Object.defineProperty(proto, "length", { configurable: true, enumerable: true, get: function () { return testKeys(this).length; } });
    /* a Demo page writing in another tab fires "storage" events here; they never reach the test pages */
    window.addEventListener("storage", function (ev) { if (!ev.key || ev.key.indexOf(P) !== 0) ev.stopImmediatePropagation(); }, true);

    /* ---------- 3. network ---------- */
    var blocked = window.__cozTestBlocked = [];
    var HOSTS = /^https:\/\/(fonts\.googleapis\.com|fonts\.gstatic\.com|cdn\.jsdelivr\.net|cdnjs\.cloudflare\.com|unpkg\.com)\//;
    var abs = function (u) { try { return new URL(String(u), location.href); } catch (e) { return null; } };
    var allowed = function (u) {
      var a = abs(u); if (!a) return false;
      if (a.protocol === "data:" || a.protocol === "blob:") return true;
      return a.origin === location.origin || HOSTS.test(a.href);
    };
    var refuse = function (u, via) {
      var a = abs(u), where = a ? a.origin + a.pathname : String(u);
      blocked.push({ via: via, url: where, at: new Date().toISOString() });
      try { console.warn("[COZ TEST] refused " + via + " to " + where + " (test pages never contact the reading servers or open a Demo page)"); } catch (e) {}
      return new TypeError("The CozAlyze test refused a request to " + where + ".");
    };
    if (window.fetch) {
      var nf = window.fetch;
      window.fetch = function (input, init) {
        var u = typeof input === "string" ? input : (input && input.url) || String(input);
        if (!allowed(u)) return Promise.reject(refuse(u, "fetch"));
        return nf.apply(this, arguments);
      };
    }
    if (window.XMLHttpRequest) {
      var xo = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function (m, u) { if (!allowed(u)) throw refuse(u, "xhr"); return xo.apply(this, arguments); };
    }
    if (window.EventSource) {
      var ES = window.EventSource;
      var ESW = function (u, o) { if (!allowed(u)) throw refuse(u, "eventsource"); return new ES(u, o); };
      ESW.prototype = ES.prototype; window.EventSource = ESW;
    }
    if (window.WebSocket) {
      var WS = window.WebSocket;
      var WSW = function (u) { throw refuse(u, "websocket"); };
      WSW.prototype = WS.prototype; window.WebSocket = WSW;
    }
    if (navigator.sendBeacon) {
      var sb = navigator.sendBeacon.bind(navigator);
      navigator.sendBeacon = function (u, d) { if (!allowed(u)) { refuse(u, "beacon"); return false; } return sb(u, d); };
    }

    /* ---------- 4. frames and windows: this folder's own pages only ---------- */
    var DIR = location.pathname.replace(/[^\/]*$/, "");              /* this test folder, /Test/nav/ */
    var pageOK = function (u) {
      var a = abs(u); if (!a || a.origin !== location.origin || a.pathname.indexOf(DIR) !== 0) return false;
      return PAGES.indexOf(a.pathname.slice(DIR.length)) >= 0;
    };
    var frameOK = function (u) { var a = abs(u); return !!a && (a.href === "about:blank" || pageOK(u)); };
    var fd = Object.getOwnPropertyDescriptor(HTMLIFrameElement.prototype, "src");
    Object.defineProperty(HTMLIFrameElement.prototype, "src", { configurable: true, enumerable: fd.enumerable, get: fd.get,
      set: function (v) { if (!frameOK(v)) { refuse(v, "frame"); v = "about:blank"; } fd.set.call(this, v); } });
    var sd = Object.getOwnPropertyDescriptor(HTMLIFrameElement.prototype, "srcdoc");
    if (sd) Object.defineProperty(HTMLIFrameElement.prototype, "srcdoc", { configurable: true, enumerable: sd.enumerable, get: sd.get,
      set: function () { refuse("about:srcdoc", "frame"); } });
    var sa = Element.prototype.setAttribute;
    Element.prototype.setAttribute = function (n, v) {
      if (this instanceof HTMLIFrameElement) {
        var name = String(n).toLowerCase();
        if (name === "srcdoc") { refuse("about:srcdoc", "frame"); return; }
        if (name === "src" && !frameOK(v)) { refuse(v, "frame"); v = "about:blank"; }
      }
      return sa.call(this, n, v);
    };
    var wo = window.open;
    window.open = function (u) {
      if (u == null || String(u).trim() === "" || !pageOK(u)) { refuse(u == null ? "about:blank" : u, "window"); return null; }
      return wo.apply(window, arguments);
    };

    window.COZ_TEST_ASSETS = "/Demo/";
    try { console.log("[COZ TEST] storage isolated under " + P + "; reading servers and the model are refused"); } catch (e) {}
  } catch (err) {
    /* ---------- 5. fail closed: no storage, no requests, and the page stops here ---------- */
    try { console.error("[COZ TEST] the test guard could not start, so this page stopped: " + (err && err.message)); } catch (e) {}
    try { ["getItem", "setItem", "removeItem", "key", "clear"].forEach(function (m) { Storage.prototype[m] = function () { throw new Error("The CozAlyze test page stopped."); }; }); } catch (e) {}
    try { window.fetch = function () { return Promise.reject(new TypeError("The CozAlyze test page stopped.")); }; } catch (e) {}
    try { XMLHttpRequest.prototype.open = function () { throw new TypeError("The CozAlyze test page stopped."); }; } catch (e) {}
    try { window.open = function () { return null; }; } catch (e) {}
    try { window.stop(); } catch (e) {}
    try { document.documentElement.innerHTML = '<body style="margin:0;padding:48px 24px;background:#02040c;color:#EEE7D8;font:16px/1.5 -apple-system,Helvetica,Arial,sans-serif">This test page stopped because its safety check couldn’t start. Nothing was changed.</body>'; } catch (e) {}
    throw err;
  }
})();
</script>
<script>
/* Sep 22: pre-write mode is decided before any markup is parsed, so the dashboard art and
   the reveal clip are never requested in the hidden copy that only writes Sections 3 to 6.
   In normal use the same media loads at exactly the same point as before. */
window.COZ_PREGEN = /[?&]pregen=1\b/.test(location.search);
</script>
<script>
/* ============================================================
   READ-ONLY DIAGNOSTIC · VD1.2 (Sep 25 2026). Observes the existing Vedic flow and changes
   nothing it measures. Both copies of this page log: the hidden ?pregen=1 writer and the
   visible page, each with its own writer id. Every event carries the chart run and input
   key THIS writer bound to (fixed when its chart was accepted and its input key computed),
   never whichever chart becomes active later. Storage: one bounded namespace,
   localStorage "cozDiag:vedic" (last 300 events, 24 h). It never touches saved charts, job
   records, cached readings or in-flight markers; never records the API key, birth details,
   request or response bodies, or raw exception text (errors are classified); and a
   diagnostic failure can never interrupt the reading. Panel: tap the CozAlyze logo three
   times quickly on a reading or waiting screen; nothing reloads or restarts.
   ============================================================ */
(function(){
  var KEY = "cozDiag:vedic", MAX = 300, DAY = 86400000, T0 = Date.now();
  var WRITER = (window.COZ_PREGEN ? "hidden" : "visible") + "-" + Math.random().toString(36).slice(2, 6);
  var B = { run: "unbound", fp: "", input: "" };
  try { var b0 = JSON.parse(localStorage.getItem("emergeBirthData") || "null"); if (b0 && b0.runId) { B.run = b0.runId; B.fp = String(b0.fingerprint || "").slice(0, 12); } } catch (e) {}
  function log(stage, detail){
    try {
      var a = []; try { a = JSON.parse(localStorage.getItem(KEY) || "[]"); if (!Array.isArray(a)) a = []; } catch (e) { a = []; }
      var now = Date.now();
      a.push({ t: now, ms: now - T0, w: WRITER, run: B.run, fp: B.fp, k: B.input, s: String(stage).slice(0, 60), d: detail == null ? "" : String(detail).slice(0, 200) });
      a = a.filter(function (x) { return x && now - x.t < DAY; }).slice(-MAX);
      localStorage.setItem(KEY, JSON.stringify(a));
    } catch (e) {}
  }
  /* classified, never the raw message */
  function classify(e){
    try {
      if (!e) return "unknown failure";
      if (e.kind === "saved_no_regen") return "saved-chart guard refused the model request (reopened saved chart)";
      var m = String(e.message || "");
      var api = m.match(/^API (\d{3})/); if (api) return "API error HTTP " + api[1];
      if (/No API key/.test(m)) return "no test API key on this device";
      if (/Model did not return JSON/.test(m)) return "model output was not JSON";
      var ms = m.match(/missing section: ([a-z0-9-]+)/); if (ms) return "model output missing section " + ms[1];
      var ff = m.match(/fetch failed \((\d{3})\): ([A-Za-z0-9._-]+)/); if (ff) return "file load failed HTTP " + ff[1] + ": " + ff[2];
      var nj = m.match(/NOT JSON: ([A-Za-z0-9._-]+)/); if (nj) return "file was not JSON: " + nj[1];
      if (/dev-review-engine\.js did not load/.test(m)) return "dev-review-engine.js did not load";
      if (e.name === "TypeError") return "network or script failure (TypeError)";
      if (e.name === "SyntaxError") return "JSON parse error (SyntaxError)";
      return "other failure (" + (e.name || "Error") + ")";
    } catch (x) { return "unclassifiable failure"; }
  }
  window.COZ_DIAG = {
    log: log, classify: classify, writer: WRITER, key: KEY,
    bindRun: function (run){ try { if (run && run.runId) { B.run = run.runId; B.fp = String(run.fingerprint || "").slice(0, 12); } } catch (e) {} },
    bindInput: function (cacheKey){ try { B.input = String(cacheKey || "").slice(-8); } catch (e) {} }
  };
  var mode = "unknown"; try { var r = localStorage.getItem("cozRestoredRunId"); mode = r && r === B.run ? "SAVED CHART REOPENED (model requests are refused by the saved-chart guard)" : "fresh chart"; } catch (e) {}
  log("page loaded", "build R5.2+VD1.2 · " + (window.COZ_PREGEN ? "hidden pre-write" : "visible page") + " · " + mode + " · route " + (String(location.hash || "none").slice(0, 30)));
  window.addEventListener("error", function (ev) { log("page error", "script error at line " + ((ev && ev.lineno) || "?") + " in " + String((ev && ev.filename) || "?").split("/").pop().split("?")[0]); });
})();
</script>

<style>
/* ============================================================
   COZALYZE · COMPLETE VEDIC READING · R5.2 · quiet pre-write
   Paid dashboard + reveal + six reading sections in ONE document
   (standing rule: no iframe, no page navigation between them).
   Design tokens and structure follow the supplied spec verbatim.
   ============================================================ */
:root {
  --vedic-navy: #000f26;
  --vedic-gold: #d4a178;
  --vedic-gold-muted: rgba(212, 161, 120, 0.65);
  --vedic-ivory: #e5d4c5;
  --vedic-ivory-muted: rgba(229, 212, 197, 0.88);
  --display-font: "Cormorant Garamond", Georgia, serif;
  --body-font: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --side-pad: 28px;
  --dash-zoom: 1;            /* opens showing the whole art, then eases to --dash-zoom-in */
  --dash-zoom-in: 1.3;
}
@media (max-width: 374px) { :root { --side-pad: 20px; } }

* { box-sizing: border-box; }
html { background: var(--vedic-navy); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--vedic-navy);
  color: var(--vedic-ivory);
  font-family: var(--body-font);
  -webkit-font-smoothing: antialiased;
}

/* Fixed background layer: iOS ignores background-attachment on body,
   so the image lives on its own fixed layer behind the scrolling content. */
.vedic-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background-color: var(--vedic-navy);
  background-image: url("/Demo/vedic-moon-bg.png");
  background-size: cover;
  background-position: top center;
  background-repeat: no-repeat;
  pointer-events: none;
}

.vedic-reading-page {
  position: relative;
  z-index: 1;
  min-height: 100svh;
  padding:
    calc(env(safe-area-inset-top) + 24px)
    var(--side-pad)
    calc(env(safe-area-inset-bottom) + 24px);
}

.vedic-reading-content {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  animation: vedicFadeIn 240ms ease-out;
}
@keyframes vedicFadeIn {
  from { opacity: 0; transform: translateY(5px); }
  to   { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  .vedic-reading-content { animation: none; }
  .stage { transition: none; }
}

/* ---------- header ---------- */
.vedic-back-button {
  position: absolute;
  top: calc(env(safe-area-inset-top) + 10px);
  left: calc(var(--side-pad) - 10px);
  width: 44px;
  height: 44px;
  padding: 0;
  margin: 0;
  border: 0;
  background: transparent;
  color: var(--vedic-gold);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.vedic-back-button svg { width: 30px; height: 20px; display: block; }
.vedic-back-button:focus-visible { outline: 1px solid var(--vedic-gold-muted); outline-offset: 4px; border-radius: 4px; }

.vedic-header {
  text-align: center;
  padding-top: 6px;
}
/* His logo lockup (emblem + CozAlyze wordmark) as one image, white keyed out.
   Width is set so the wordmark reads at the spec's 28–30px display size. */
.vedic-logo {
  display: block;
  width: 140px;
  height: auto;
  margin: 0 auto;
}
.vedic-eyebrow {
  font-family: var(--body-font);
  font-size: clamp(13px, 3.5vw, 14.5px);
  font-weight: 500;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--vedic-ivory-muted);
  margin: 12px 0 0;
  padding-left: 0.28em; /* optical centre with the trailing tracking */
}
.vedic-counter {
  font-family: var(--display-font);
  font-size: clamp(27px, 7.2vw, 31px);
  font-weight: 500;
  letter-spacing: 0.06em;
  font-variant-numeric: lining-nums;
  color: var(--vedic-gold);
  margin: 40px 0 0;
}

/* ---------- ornamental divider ---------- */
.vedic-divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: min(100%, 420px);
  margin: 14px auto;
  color: var(--vedic-gold);
}
.vedic-divider::before,
.vedic-divider::after {
  content: "";
  flex: 1 1 auto;
  height: 1px;
  background: var(--vedic-gold-muted);
}
.vedic-divider svg { width: 16px; height: 16px; flex: 0 0 auto; display: block; }

/* ---------- title ---------- */
.vedic-title {

  text-wrap: balance;

}

}

  color: var(--vedic-gold);

  background: transparent;

  padding: 0;
  margin: 0;

.vedic-nav svg:not(.vedic-nav-rule svg) { width: 24px; height: 15px; flex: 0 0 auto; }

/* ============================================================
   PAID DASHBOARD  (his art = frame 0 of the reveal clip, so the
   dashboard and the video's first frame are pixel-identical)
   ============================================================ */
body[data-view="dashboard"] .vedic-reading-page,
body[data-view="dashboard"] .vedic-bg { display: none; }

.dash {
  position: fixed;
  inset: 0;
  z-index: 5;
  background: var(--vedic-navy);
  overflow: hidden;
}
/* one shared stage: contain-fit box with the clip's exact aspect, centred */
.stage {
  position: absolute;
  left: 50%;
  top: 50%;
  aspect-ratio: 1068 / 1940;
  width: min(100vw, calc(100svh * 1068 / 1940));   /* contain-fit: the whole art */
  /* --dash-zoom 1 = whole art; above 1 the stage scales up around its centre and

   pushes the bottom nav pill below the screen; two fingers now zoom the art between
   the whole frame (1) and the landing (--dash-zoom-in) so Home, Saved and Account can
   always be reached. Native browser zoom stays off. ---------- */
.dash { touch-action: none; }
.dash.pinching .stage { transition: none; }

  /* skip-ahead (Sep 1 ruling): subtle gold text, never a button. Appears only on
     a device that has already been through the experience once. */
  .coz-skip { position:fixed; top:calc(env(safe-area-inset-top) + 16px); right:18px; z-index:9999;
    font-family:-apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; font-size:11px; letter-spacing:0.16em;
    text-transform:uppercase; color:rgba(201,161,94,0.55); background:transparent; border:0; padding:10px 6px;
    opacity:0; pointer-events:none; transition:opacity 0.9s ease; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .coz-skip.on { opacity:1; pointer-events:auto; }
  .coz-skip:active { color:rgba(233,215,174,0.9); }
  /* NAV TEST N2.0: Save Chart, its own control (the bookmark no longer saves). Same gold text as Skip,
     same corner. Shown on the dashboard, the reading and the settled Ascendant; never during the reveal, the Ascendant swell, or while Skip is
     showing. Placement is Jason's call. */
  body[data-view="dashboard"] .coz-save, body[data-view="reading"] .coz-save,
  body[data-view="ascendant"].asq-done .coz-save { opacity:1; pointer-events:auto; }

/* one-finger pan (Sep 1): when the dashboard is zoomed in, dragging moves the art up

.stage { transform: translate(-50%, calc(-50% + var(--dash-pan, 0px))) scale(var(--dash-zoom, 1)); }
.dash.panning .stage { transition: none; }
@keyframes cozPageIn { from { opacity: 0; } to { opacity: 1; } }
body[data-view="reading"] .vedic-reading-page { animation: none; }
.reveal-curtain { transition: opacity 1400ms ease-in-out; }

/* through the sun (Sep 1 ruling): after the burst the camera keeps going, the sun
   fills the screen with light and the reading emerges out of it */
/* the sun sits at 40.6% of the clip height (measured on the last frame): the drive scales about it */
.reveal.is-through .stage { transform-origin: 50% 40.6%; transition: transform 3200ms cubic-bezier(0.42, 0, 0.9, 0.35), transform-origin 0s;
  /* the sun is carried to the exact screen centre while the stage grows about it */

#cozLight { position: fixed; inset: 0; z-index: 90; pointer-events: none; opacity: 0;

#cozLight.on { opacity: 1; transition: none; }
/* text zoom (Sep 1 ruling): wherever there is reading text, two fingers scale it up

function resolveAscendant() {
  const pick = v => { if (!v) return null; v = String(v).trim(); v = v.charAt(0).toUpperCase() + v.slice(1).toLowerCase(); return SIGNS.includes(v) ? v : null; };
  /* R4.5: the Lagna comes from the current run's verified chart record. A sign in the
     URL or stored separately is accepted only when it agrees; with no verified record
     the sign is unknown (null): never Leo, never a stale sign. */
  const c = verifiedChart();
  const asc = c && Array.isArray(c.planets) ? c.planets.find(p => p && p.name === "Ascendant") : null;
  const n = asc ? asc.signNumber : (c ? c.ascendantSignNumber : null);
  const verified = Number.isInteger(n) && n >= 1 && n <= 12 ? SIGNS[n - 1] : null;
  if (!verified) return null;
  const hinted = pick(params.get("asc")) || pick(window.EMERGE_ASCENDANT);
  if (hinted && hinted !== verified) { try { console.log("[VEDIC READING] ascendant hint " + hinted + " ignored; verified chart says " + verified); } catch (e) {} }
  return verified;
}

const revealEl = document.getElementById("reveal");

function lockScroll(on) { document.body.classList.toggle("scroll-locked", on); }

function startReveal() {
  if (revealActive || !readingReady()) return;
  revealActive = true; revealDone = false;
  document.getElementById("hotReading").disabled = true;
  lockScroll(true);
  try { window.dispatchEvent(new CustomEvent("COZ_VEDIC_REVEAL_START", { detail: { ascendant: ASC_SIGN } })); } catch (e) {}

  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  revealEl.classList.remove("is-closing", "asc-off");
  revealEl.classList.add("is-on");
  document.getElementById("revealLive").textContent = "Opening your Vedic reading";

  // if the clip cannot even start (no network, blocked), move on rather than trap anyone
  revealTimers.push(setTimeout(() => { if (!revealStarted) finishReveal(false); }, 2500));

  revealStarted = false;
  try { revealVideo.currentTime = 0; } catch (e) {}
  const p = revealVideo.play();
  if (p && p.catch) p.catch(() => finishReveal(false));
}

/* timers that depend on the clip actually running start only once it is playing */
let revealStarted = false;
revealVideo.addEventListener("playing", () => {
  if (revealStarted || !revealActive) return;
  revealStarted = true;
  // the live ascendant overlay stays while the buttons are still on screen, then lets go before the burst
  revealTimers.push(setTimeout(() => revealEl.classList.add("asc-off"), 1450));
  /* Sep 1 ruling: ONE motion. The drive into the sun begins while the burst is still
     blooming, the light takes the screen while the stage is still growing, the page
     lands under the light and the light clears. No hold anywhere. */
  revealTimers.push(setTimeout(() => revealEl.classList.add("is-through"), 1500));
  /* Sep 20: the reveal, the drive through the sun, the light and the space flight are now ONE clip
     (/Demo/vedic-reading-reveal-full.mp4). The page just plays it and lands when it ends. */
  // hard cap a little past the clip's 2.5s so a stalled clip never traps anyone
  revealTimers.push(setTimeout(() => finishReveal(false), 47000));   /* stall guard only: the clip runs 44.5s */
  /* stall watchdog (Sep 21): if the clip stops advancing for 4s (buffering on
     cellular), land on the reading instead of holding a black screen */
  let lastT = -1, stuckSince = Date.now();
  revealTimers.push(setInterval(() => {
    if (!revealActive || revealDone) return;
    const t = revealVideo.currentTime;
    if (t !== lastT) { lastT = t; stuckSince = Date.now(); return; }
    if (Date.now() - stuckSince > 4000) finishReveal(false);
  }, 500));
});

function finishReveal(immediate) {
  if (!revealActive || revealDone) return;   // ignore clip events while the reveal is not running
  revealDone = true;
  revealTimers.forEach(clearTimeout); revealTimers.forEach(clearInterval); revealTimers = [];
  const land = () => {
    const go = () => {
      location.hash = "#/essential-nature";          // its own history entry; renders via hashchange
      revealEl.classList.remove("is-on", "is-closing", "asc-off", "is-through");   /* full reset so a second tap starts clean */
      try { revealVideo.pause(); } catch (e) {}
      lockScroll(false);
      revealActive = false;
      syncReadyState();
    };
    /* dev-review generation is async (chart request + local claim-file fetches);
       the reveal already runs several seconds so this normally resolves long
       before we get here, but we wait for it rather than risk a race. */
    /* land immediately: showFromHash renders a waiting screen if generation is
       still running, so the reveal never stalls on a black screen. */
    go();
  };
  if (immediate === true) { land(); return; }
  /* Sep 1 ruling: through the sun. Hold on the burst, then the camera drives into it, the light
     fills the screen, the page lands underneath and the light clears to reveal the reading. */
  if (immediate === "through"){
    try { window.__cozLightIn(); } catch (e) {}
    land();
    revealEl.classList.remove("is-through");
    setTimeout(() => { try { window.__cozLightOut(); } catch (e) {} }, 350);
    return;
  }
  /* stall or error before the drive began: plain curtain */
  revealEl.classList.add("is-closing");
  setTimeout(land, 900);
}

function cancelReveal() {
  if (!revealActive || revealDone) return;
  revealDone = true;
  revealTimers.forEach(clearTimeout); revealTimers.forEach(clearInterval); revealTimers = [];
  try { revealVideo.pause(); revealVideo.currentTime = 0; } catch (e) {}
  revealEl.classList.remove("is-on", "is-closing", "is-through", "asc-off");
  lockScroll(false);
  revealActive = false;
  syncReadyState();
}

};

  window.COZ_LAGNA_BANK = { shared: SHARED.sidereal, signs: SIGNS };   /* SL1.1: the Saved Library snapshots this copy at save time */
  const MODE = "vedic";
  const key = ASC_SIGN ? String(ASC_SIGN).toLowerCase() : "";
  const S = SIGNS[key] || null;
  const veil = document.getElementById("asqVeil"), hero = document.getElementById("asqHero"),
        sVid = document.getElementById("asqVid"), content = document.getElementById("asqContent");
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let settled = false, entered = false;
  function once(fn){ let ran = false; return () => { if (!ran){ ran = true; fn(); } }; }
  function fill(id, paragraphs){ const el = document.getElementById(id); el.innerHTML = ""; paragraphs.forEach(t => { const p = document.createElement("p"); p.textContent = t; el.appendChild(p); }); }
  function buildCopy(){
    const host = document.getElementById("asqSections"); host.innerHTML = "";
    document.getElementById("asqTitle").textContent = S ? S.title : (key.charAt(0).toUpperCase() + key.slice(1) + " Rising").toUpperCase();
    if (MODE === "vedic"){
      document.getElementById("asqEyebrow").textContent = "Your Ascendant";
      document.getElementById("asqSub").textContent = "Your Inner Compass";
      host.innerHTML = '<section><h2>Sidereal Perspective</h2><div id="asqSecSidereal" class="reading-copy"></div></section><div class="divider"></div>' +
        '<section><h2>The Essence of You</h2><div id="asqSecEssence" class="reading-copy"></div></section><div class="divider"></div>' +
        '<section><h2>Your Dharmic Path</h2><div id="asqSecDharma" class="reading-copy"></div></section>';
      if (!S){
        document.getElementById("asqTitle").textContent = "NOT AVAILABLE";
        host.innerHTML = '<section><div id="asqSecMissing" class="reading-copy"></div></section>' +
          '<nav class="vedic-nav" aria-label="Ascendant navigation"><div class="vedic-nav-rule" aria-hidden="true">' + STAR_SVG + '</div>' +
          '<div class="vedic-nav-links"><a href="#/dashboard" id="asqNavBack">' + ARROW_L + ' Back to Your Vedic Reading</a></div></nav>';
        fill("asqSecMissing", ["Your Ascendant could not be verified for this chart. Run your chart again to see it here."]);
        return;
      }
      fill("asqSecSidereal", SHARED.sidereal);
      fill("asqSecEssence", S.essence); fill("asqSecDharma", S.dharma);
      /* item 3 (Sep 21): same pager as the reading pages. Back to the dashboard, Next to
         the dashboard's Current Life Cycle door (its existing data-href). */
      const lc = document.querySelector('.hot[data-dash="life-cycle"]');
      const nextHref = lc && lc.dataset.href ? lc.dataset.href : null;
      host.insertAdjacentHTML("beforeend",
        '<nav class="vedic-nav" aria-label="Ascendant navigation"><div class="vedic-nav-rule" aria-hidden="true">' + STAR_SVG + '</div>' +
        '<div class="vedic-nav-links"><a href="#/dashboard" id="asqNavBack">' + ARROW_L + ' Back to Your Vedic Reading</a>' +
        (nextHref ? '<a class="vedic-nav-next" href="' + nextHref + '">Next: Your Current Life Cycle ' + ARROW_R + '</a>' : '') + '</div></nav>');
    } else {
      /* tropical: the sign emergence and title only; the Rising Sign copy for this
         page is not written yet (his lane), so no Lagna text is shown here */
      document.getElementById("asqEyebrow").textContent = "Your Rising Sign";
      document.getElementById("asqSub").textContent = "Your Conscious Expression";
    }
  }
  /* Each opening gets a generation number and its own AbortController. Every timer,
     animation frame, listener and play() promise checks that it still belongs to the
     current opening, so an earlier opening can never settle or modify a later one. */
  let gen = 0, ac = null;
  const asqTimers = [], asqFrames = [];
  const alive = g => g === gen && entered;
  const later = (fn, ms) => { const g = gen; const t = setTimeout(() => { if (alive(g)) fn(); }, ms); asqTimers.push(t); return t; };
  const frame = fn => { const g = gen; const id = requestAnimationFrame(() => { if (alive(g)) fn(); }); asqFrames.push(id); return id; };
  const on = (el, ev, fn, opts) => { const g = gen; el.addEventListener(ev, e => { if (alive(g)) fn(e); }, Object.assign({}, opts || {}, { signal: ac.signal })); };
  function exit(){
    if (!entered) return;
    entered = false; settled = false; gen++;
    try { ac && ac.abort(); } catch(_){}
    asqTimers.splice(0).forEach(clearTimeout);
    asqFrames.splice(0).forEach(cancelAnimationFrame);
    try { sVid.pause(); sVid.removeAttribute("src"); sVid.load(); } catch(_){}
    document.body.classList.remove("asq-locked", "asq-done");
    veil.classList.remove("on");
    hero.classList.remove("bloom", "playing", "grown", "settling"); hero.style.height = "";
    content.classList.remove("rising"); content.style.transform = "";
    document.documentElement.style.removeProperty("--settled-h");
    document.querySelectorAll(".coz-skip.asq").forEach(el => el.classList.remove("on"));
  }
  window.COZ_ASQ = { enter: enter, exit: exit };
  function enter(){
    if (entered) return; entered = true; settled = false; gen++; ac = new AbortController();
    try { window.parent !== window && window.parent.EMERGE_SOUND && window.parent.EMERGE_SOUND.loop("ambient"); } catch(_){}
    buildCopy();
    document.body.dataset.view = "ascendant";
    window.scrollTo(0, 0);
    try { window.dispatchEvent(new CustomEvent("COZ_ASQ_ENTER")); } catch(_){}
    if (!key){                                   /* no verified sign: no clip, straight to the message */
      hero.classList.add("playing"); settle(); return;
    }
    sVid.src = "/Demo/" + (MODE === "vedic" ? "sidereal-ascendant-" : "") + key + ".mp4";
    /* v1.2 correction: the tropical branch here was guessed as "tropical-ascendant-"
       before confirming what actually exists in the repo. It turns out the original
       bare-named files (aries.mp4, leo.mp4, etc., already in master) ARE the tropical
       set — they only ever collided with Vedic because vedic-reading.html used to read
       those same bare names too. Now that Vedic reads sidereal-ascendant-<sign>.mp4
       exclusively, the bare names are safely tropical-only, unchanged, no re-upload
       needed. */
    if (S && S.loop) sVid.loop = true; sVid.load();
    document.body.classList.add("asq-locked");
    veil.classList.add("on");
    later(() => { playSign(); later(() => veil.classList.remove("on"), 150); }, 300);   // black beat, then the swell
  }
  function playSign(){
    hero.classList.add("bloom");
    void sVid.offsetWidth;                                    // commit scale .06 before growing
    frame(() => { hero.classList.add("playing"); hero.classList.add("grown"); });
    const arm = once(scheduleSettle);
    on(sVid, "loadedmetadata", arm);
    if (sVid.readyState >= 1) arm();
    on(sVid, "error", () => settle());
    const g = gen; sVid.play().catch(() => { if (alive(g)) settle(); });
    later(() => { if (!settled) settle(); }, 9000);
  }
  function scheduleSettle(){
    const dur = (sVid.duration && isFinite(sVid.duration)) ? sVid.duration : 5;
    if (S && S.loop){ later(settle, Math.max(1000, dur * 1000)); }
    else {
      on(sVid, "ended", settle, { once:true });
      on(sVid, "timeupdate", function(){ if (sVid.currentTime >= dur - 1.0) settle(); });
      later(() => { if (!settled) settle(); }, dur * 1000 + 1500);
    }
  }
  function settle(){
    if (settled) return; settled = true;
    const vw = document.documentElement.clientWidth;
    const ar = (sVid.videoWidth && sVid.videoHeight) ? sVid.videoWidth / sVid.videoHeight : 1.25;
    /* Sep 1 ruling: after the full-screen emergence the sign settles into the top third of the
       screen (never taller), so the reading beneath it is easy to read; the clip keeps playing */
    const settledH = Math.min(Math.round(vw / ar), Math.round(window.innerHeight * 0.36));
    document.documentElement.style.setProperty("--settled-h", settledH + "px");
    const finish = once(() => {
      document.body.classList.add("asq-done"); document.body.classList.remove("asq-locked");
      hero.classList.remove("settling"); content.classList.remove("rising");
      hero.style.height = ""; content.style.transform = "";
      if (key) { try { window.dispatchEvent(new CustomEvent("EMERGE_ASCENDANT_SETTLED", { detail:{ sign:key } })); } catch(_){} }   /* a real emergence only */
    });
    if (reduced){ finish(); return; }
    content.style.transform = "translateY(" + window.innerHeight + "px)";
    content.classList.add("rising");
    frame(() => frame(() => {
      hero.classList.add("settling"); hero.style.height = settledH + "px";
      content.style.transform = "translateY(" + settledH + "px)";
    }));
    on(content, "transitionend", finish, { once:true });
    later(finish, 3000);
  }
  document.querySelector('.hot[data-dash="ascendant"]').addEventListener("click", function(){ location.hash = "#/ascendant"; });   /* its own history entry */
  /* SKIP (Sep 1 ruling): from the second emergence on this device, a subtle Skip
     appears a moment into the swell and jumps to the settled reading */
  (function(){
    var KEY = "cozSeenAsc_" + MODE, seen = false;
    try { seen = localStorage.getItem(KEY) === "1"; } catch(_){}
    var el = document.createElement("button"); el.type = "button"; el.className = "coz-skip asq"; el.textContent = "Skip"; el.setAttribute("aria-label", "Skip to the reading");
    document.body.appendChild(el);
    window.addEventListener("EMERGE_ASCENDANT_SETTLED", function(){ seen = true; try { localStorage.setItem(KEY, "1"); } catch(_){} el.classList.remove("on"); });
    el.addEventListener("click", function(){ el.classList.remove("on"); hero.classList.remove("bloom"); hero.classList.add("playing"); settle(); });
    window.addEventListener("COZ_ASQ_ENTER", function(){ if (seen) later(function(){ if (!settled) el.classList.add("on"); }, 1800); });
  })();
  document.getElementById("asqHome").addEventListener("click", function(e){ e.preventDefault(); location.hash = "#/dashboard"; });
  /* DV2: a link in the Ascendant reading that leaves for another page (Next: Your Current Life Cycle)
     takes the first tap only; repeat taps while that page loads are ignored instead of restarting
     the load. The sign clip keeps playing. Reset when the page is shown again (back). */
  document.addEventListener("click", function(e){
    const a = e.target.closest && e.target.closest("#asqContent a[href]");
    if (!a || !/\.html(\?|#|$)/.test(a.getAttribute("href"))) return;
    if (a.dataset.cozLeaving === "1") { e.preventDefault(); return; }
    a.dataset.cozLeaving = "1";
  });
  window.addEventListener("pageshow", function(){ document.querySelectorAll('#asqContent a[data-coz-leaving="1"]').forEach(function(a){ a.dataset.cozLeaving = ""; }); });
  document.addEventListener("click", function(e){
    const back = e.target.closest && e.target.closest("#asqNavBack");
    if (!back) return;
    e.preventDefault(); location.hash = "#/dashboard";
  });
  if (window.__asqPending){ window.__asqPending = false; enter(); }   /* page opened directly on #/ascendant */
})();

/* ---------- dashboard pinch zoom (Sep 1) ---------- */
(function(){
  const dash = document.getElementById("dash"), root = document.documentElement;
  let active = false, startD = 0, startZ = 1, maxZ = 1.3;
  const cur = () => parseFloat(getComputedStyle(root).getPropertyValue("--dash-zoom")) || 1;
  const dist = e => Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  dash.addEventListener("touchstart", e => {
    if (e.touches.length !== 2) return;
    active = true; startD = dist(e) || 1; startZ = cur();
    maxZ = parseFloat(getComputedStyle(root).getPropertyValue("--dash-zoom-in")) || 1.3;
    dash.classList.add("pinching"); window.__dashZoomed = true;
  }, { passive:true });
  dash.addEventListener("touchmove", e => {
    if (!active || e.touches.length !== 2) return;
    e.preventDefault();
    const z = Math.min(maxZ, Math.max(1, startZ * (dist(e) / startD)));
    root.style.setProperty("--dash-zoom", z.toFixed(3));
  }, { passive:false });
  const end = () => { if (!active) return; active = false; dash.classList.remove("pinching"); };
  dash.addEventListener("touchend", end); dash.addEventListener("touchcancel", end);
})();

/* zoom lock (Sep 1): iOS lets a two-finger pinch zoom the whole page even with
   user-scalable=no, and that zoom survives a reload, which is what threw the globe
   off on the second run. Native page zoom is refused here; the dashboards keep
   their own two-finger art zoom. */
(function(){
  ['gesturestart','gesturechange','gestureend'].forEach(function(t){ document.addEventListener(t, function(e){ e.preventDefault(); }, { passive:false }); });
  document.addEventListener('touchmove', function(e){ if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive:false });
})();

/* ---------- one-finger pan on the zoomed dashboard (Sep 1) ---------- */
(function(){
  const dash = document.getElementById("dash"), stage = document.getElementById("dashStage"), root = document.documentElement;
  let panning = false, startY = 0, startPan = 0, moved = false;
  const zoom = () => parseFloat(getComputedStyle(root).getPropertyValue("--dash-zoom")) || 1;
  const pan = () => parseFloat(getComputedStyle(root).getPropertyValue("--dash-pan")) || 0;
  const limit = () => Math.max(0, (stage.offsetHeight * zoom() - window.innerHeight) / 2);
  dash.addEventListener("touchstart", e => {
    if (e.touches.length !== 1 || zoom() <= 1.001) return;
    panning = true; moved = false; startY = e.touches[0].clientY; startPan = pan();
  }, { passive:true });
  dash.addEventListener("touchmove", e => {
    if (!panning || e.touches.length !== 1) return;
    const dy = e.touches[0].clientY - startY;
    if (Math.abs(dy) > 6) moved = true;
    if (!moved) return;
    e.preventDefault(); dash.classList.add("panning");
    const L = limit(); const y = Math.max(-L, Math.min(L, startPan + dy));
    root.style.setProperty("--dash-pan", y.toFixed(1) + "px");
  }, { passive:false });
  const end = () => { panning = false; dash.classList.remove("panning"); };
  dash.addEventListener("touchend", end); dash.addEventListener("touchcancel", end);
  /* a real drag must not count as a tap on the hotspot underneath */
  dash.addEventListener("click", e => { if (moved){ e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
})();


/* ---------- through the sun + text zoom (Sep 1) ---------- */

(function(){

  const inText = () => document.body.dataset.view === "reading" || document.body.dataset.view === "ascendant";
  const cur = () => parseFloat(getComputedStyle(root).getPropertyValue("--coz-text-zoom")) || 1;

  document.addEventListener("touchstart", e => { if (!inText() || e.touches.length !== 2) return; active = true; startD = dist(e) || 1; startZ = cur(); }, { passive:true });
  document.addEventListener("touchmove", e => {
    if (!active || e.touches.length !== 2) return;
    e.preventDefault();
    const z = Math.min(2, Math.max(1, startZ * (dist(e) / startD)));
    root.style.setProperty("--coz-text-zoom", z.toFixed(3));
  }, { passive:false });
  const end = () => { active = false; };
  document.addEventListener("touchend", end); document.addEventListener("touchcancel", end);
})();

/* Sep 20: un-zoom the reveal stage during the gold light (3.6s in), restore on exit. */
(function () {
  var st = document.querySelector(".reveal .stage");
  if (!st) return;
  var t = null;
  var vid = document.querySelector(".reveal video");
  if (!vid) return;
  function unzoom() {
    var w = st.offsetWidth, h = st.offsetHeight;
    if (!w || !h) return;
    /* Sep 22: the whole clip frame stays visible during the flight (no cropping of the
       planets), so the stage returns to exactly 1 rather than a screen-covering scale */
    st.style.setProperty("--reveal-zoom", "1");
  }
  function reset() { clearTimeout(t); st.style.removeProperty("--reveal-zoom"); }
  vid.addEventListener("playing", function () { clearTimeout(t); t = setTimeout(unzoom, 3600); });
  vid.addEventListener("ended", reset);
  vid.addEventListener("error", reset);
  vid.addEventListener("pause", function () { if (vid.currentTime === 0) reset(); });
})();
