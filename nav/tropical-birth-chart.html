<!-- NAV TEST N2.0 (CozAlyze/Test only): the test storage guard (test-storage.js), pasted first so it runs before
     any other script: storage under cozTEST:, no reading servers, art and data from /Demo/ -->
<script>
/* COZ TEST STORAGE · NAV TEST N2.0 (Oct 15 2026; N1.1 r2's guard, hardened after the N2 isolation review)
   CozAlyze/Test/nav only, never the Demo.
   The build pastes this file, unchanged, as the first script inside every page in this folder except
   test-setup.html, so it cannot fail to load (a missing or late separate file would let a page run on the
   Demo's own storage). This copy is the readable source; no page loads it as a separate file.
   The Test and the Demo are on the same site (cozalyze.github.io), so they share the phone's storage.
   This keeps the test pages away from the Demo's data and from the reading servers.

   1. STORAGE. Every localStorage and sessionStorage read and write made on a test page, including by
      the scripts these pages load, goes to keys that start with "cozTEST:". A test page never sees or
      changes a Demo key (saved charts, the current chart, readings, the tester password). The build
      refuses any page or script that uses storage any other way (property-style access, another
      window's or frame's storage, IndexedDB, cookies, workers) and every script is a pinned copy in
      this folder. Storage events from Demo writes (another tab) never reach the test pages.
   2. ROOM FOR THE DEMO. A test write that would take the site's stored data past about 4 MB is refused
      (QuotaExceededError, which the pages already handle as "not enough space"), so the test can never
      crowd the Demo out of the phone's storage.
   3. NETWORK. A test page may request files from this site and from the font and script hosts the pages
      already use. Anything else is refused before it is sent: the reading servers (*.netlify.app) and the
      model (api.anthropic.com) included. No reading can be started, continued or paid for from a test page.
      The build refuses any page or script that names another host.
   4. FRAMES AND WINDOWS. A frame or a new window may only open one of this folder's own pages (PAGES
      below; a refused frame shows a blank page). Never a Demo page, the setup page, a missing page, or
      an inline (srcdoc) frame, any of which could run without this guard.
   5. FAIL CLOSED. If any part of this guard cannot be installed, the page stops before anything else runs
      and says so.

   Art, video, styles and data files load from the Demo folder on the same site (window.COZ_TEST_ASSETS).
   Anything refused is listed in window.__cozTestBlocked and the console. */
(function () {
  if (window.__cozTestStorage) return;
  window.__cozTestStorage = "N2.0";
  var P = "cozTEST:";
  /* this folder's own pages (the build checks this list against the pages it builds) */
  var PAGES = ["account.html", "saved-charts.html",
    "vedic-reading.html", "vedic-birth-chart.html", "saved-vedic-document.html", "current-life-cycle.html",
    "current-season.html", "key-time-windows.html", "what-comes-next.html",
    "tropical-reading.html", "tropical-birth-chart.html", "tropical-current-transits.html", "saved-tropical-document.html",
    "compare-reading.html", "combined-reading.html", "your-ascendants.html", "ascendant-reading.html",
    "compare-current-timing.html", "compare-current-timing-reading.html", "compare-birth-charts.html",
    "compare-system.html", "saved-compare-document.html"];
  try {
    /* ---------- 1. storage ---------- */
    var proto = Storage.prototype;
    var g = proto.getItem, s = proto.setItem, r = proto.removeItem, k = proto.key;
    var lenDesc = Object.getOwnPropertyDescriptor(proto, "length");
    var rawLen = function (st) { return lenDesc.get.call(st); };
    var testKeys = function (st) {
      var out = [], n = rawLen(st), i, key;
      for (i = 0; i < n; i++) { key = k.call(st, i); if (key && key.indexOf(P) === 0) out.push(key.slice(P.length)); }
      return out;
    };
    /* ---------- 2. room for the Demo (localStorage is shared with it; sessionStorage is per tab) ---------- */
    var CAP = 4.0 * 1048576;                                          /* estimated bytes, 2 per character */
    var LOCAL = null; try { LOCAL = window.localStorage; } catch (e) {}
    var usedBytes = function (st) {
      var n = rawLen(st), t = 0, i, key, v;
      for (i = 0; i < n; i++) { key = k.call(st, i); v = key == null ? null : g.call(st, key); t += ((key ? key.length : 0) + (v ? v.length : 0)) * 2; }
      return t;
    };
    proto.getItem = function (key) { return g.call(this, P + key); };
    proto.setItem = function (key, v) {
      var pk = P + key;
      if (this === LOCAL) {
        var old = g.call(this, pk), add = (pk.length + String(v).length) * 2 - (old != null ? (pk.length + old.length) * 2 : 0);
        if (add > 0 && usedBytes(this) + add > CAP) {
          try { console.warn("[COZ TEST] write refused: it would crowd the Demo's storage (" + key + ")"); } catch (e) {}
          throw new DOMException("The CozAlyze test keeps room free for the Demo.", "QuotaExceededError");
        }
      }
      return s.call(this, pk, v);
    };
    proto.removeItem = function (key) { return r.call(this, P + key); };
    proto.key = function (i) { var a = testKeys(this); i = Math.floor(Number(i)); return i >= 0 && i < a.length ? a[i] : null; };
    proto.clear = function () { var st = this; testKeys(st).forEach(function (key) { r.call(st, P + key); }); };
    Object.defineProperty(proto, "length", { configurable: true, enumerable: true, get: function () { return testKeys(this).length; } });
    /* a Demo page writing in another tab fires "storage" events here; they never reach the test pages */
    window.addEventListener("storage", function (ev) { if (!ev.key || ev.key.indexOf(P) !== 0) ev.stopImmediatePropagation(); }, true);

    /* ---------- 3. network ---------- */
    var blocked = window.__cozTestBlocked = [];
    var HOSTS = /^https:\/\/(fonts\.googleapis\.com|fonts\.gstatic\.com|cdn\.jsdelivr\.net|cdnjs\.cloudflare\.com|unpkg\.com)\//;
    var abs = function (u) { try { return new URL(String(u), location.href); } catch (e) { return null; } };
    var allowed = function (u) {
      var a = abs(u); if (!a) return false;
      if (a.protocol === "data:" || a.protocol === "blob:") return true;
      return a.origin === location.origin || HOSTS.test(a.href);
    };
    var refuse = function (u, via) {
      var a = abs(u), where = a ? a.origin + a.pathname : String(u);
      blocked.push({ via: via, url: where, at: new Date().toISOString() });
      try { console.warn("[COZ TEST] refused " + via + " to " + where + " (test pages never contact the reading servers or open a Demo page)"); } catch (e) {}
      return new TypeError("The CozAlyze test refused a request to " + where + ".");
    };
    if (window.fetch) {
      var nf = window.fetch;
      window.fetch = function (input, init) {
        var u = typeof input === "string" ? input : (input && input.url) || String(input);
        if (!allowed(u)) return Promise.reject(refuse(u, "fetch"));
        return nf.apply(this, arguments);
      };
    }
    if (window.XMLHttpRequest) {
      var xo = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function (m, u) { if (!allowed(u)) throw refuse(u, "xhr"); return xo.apply(this, arguments); };
    }
    if (window.EventSource) {
      var ES = window.EventSource;
      var ESW = function (u, o) { if (!allowed(u)) throw refuse(u, "eventsource"); return new ES(u, o); };
      ESW.prototype = ES.prototype; window.EventSource = ESW;
    }
    if (window.WebSocket) {
      var WS = window.WebSocket;
      var WSW = function (u) { throw refuse(u, "websocket"); };
      WSW.prototype = WS.prototype; window.WebSocket = WSW;
    }
    if (navigator.sendBeacon) {
      var sb = navigator.sendBeacon.bind(navigator);
      navigator.sendBeacon = function (u, d) { if (!allowed(u)) { refuse(u, "beacon"); return false; } return sb(u, d); };
    }

    /* ---------- 4. frames and windows: this folder's own pages only ---------- */
    var DIR = location.pathname.replace(/[^\/]*$/, "");              /* this test folder, /Test/nav/ */
    var pageOK = function (u) {
      var a = abs(u); if (!a || a.origin !== location.origin || a.pathname.indexOf(DIR) !== 0) return false;
      return PAGES.indexOf(a.pathname.slice(DIR.length)) >= 0;
    };
    var frameOK = function (u) { var a = abs(u); return !!a && (a.href === "about:blank" || pageOK(u)); };
    var fd = Object.getOwnPropertyDescriptor(HTMLIFrameElement.prototype, "src");
    Object.defineProperty(HTMLIFrameElement.prototype, "src", { configurable: true, enumerable: fd.enumerable, get: fd.get,
      set: function (v) { if (!frameOK(v)) { refuse(v, "frame"); v = "about:blank"; } fd.set.call(this, v); } });
    var sd = Object.getOwnPropertyDescriptor(HTMLIFrameElement.prototype, "srcdoc");
    if (sd) Object.defineProperty(HTMLIFrameElement.prototype, "srcdoc", { configurable: true, enumerable: sd.enumerable, get: sd.get,
      set: function () { refuse("about:srcdoc", "frame"); } });
    var sa = Element.prototype.setAttribute;
    Element.prototype.setAttribute = function (n, v) {
      if (this instanceof HTMLIFrameElement) {
        var name = String(n).toLowerCase();
        if (name === "srcdoc") { refuse("about:srcdoc", "frame"); return; }
        if (name === "src" && !frameOK(v)) { refuse(v, "frame"); v = "about:blank"; }
      }
      return sa.call(this, n, v);
    };
    var wo = window.open;
    window.open = function (u) {
      if (u == null || String(u).trim() === "" || !pageOK(u)) { refuse(u == null ? "about:blank" : u, "window"); return null; }
      return wo.apply(window, arguments);
    };

    window.COZ_TEST_ASSETS = "/Demo/";
    try { console.log("[COZ TEST] storage isolated under " + P + "; reading servers and the model are refused"); } catch (e) {}
  } catch (err) {
    /* ---------- 5. fail closed: no storage, no requests, and the page stops here ---------- */
    try { console.error("[COZ TEST] the test guard could not start, so this page stopped: " + (err && err.message)); } catch (e) {}
    try { ["getItem", "setItem", "removeItem", "key", "clear"].forEach(function (m) { Storage.prototype[m] = function () { throw new Error("The CozAlyze test page stopped."); }; }); } catch (e) {}
    try { window.fetch = function () { return Promise.reject(new TypeError("The CozAlyze test page stopped.")); }; } catch (e) {}
    try { XMLHttpRequest.prototype.open = function () { throw new TypeError("The CozAlyze test page stopped."); }; } catch (e) {}
    try { window.open = function () { return null; }; } catch (e) {}
    try { window.stop(); } catch (e) {}
    try { document.documentElement.innerHTML = '<body style="margin:0;padding:48px 24px;background:#02040c;color:#EEE7D8;font:16px/1.5 -apple-system,Helvetica,Arial,sans-serif">This test page stopped because its safety check couldn’t start. Nothing was changed.</body>'; } catch (e) {}
    throw err;
  }
})();
</script>

<!--
  COZALYZE · TROPICAL BIRTH CHART · TBC1.9 birth details (Oct 6 2026, presentation fixes P1, local build for review)
  TBC1.9: date and time shown as "August 20, 1977" and "9:30 PM" (display only, stored values unchanged).
  TBC1.8: ?saved=1&id=<compare record>&in=compare renders the chart only, inside the saved comparison
  (saved-compare-document.html): no toolbar, no Saved Readings links, no footer nav, no build stamp,
  transparent page. Data path unchanged (the record's own snapshot chart); saved-tropical-library.js
  is read-only in this mode (TL1.2). Every other mode unchanged.
  TBC1.7 saved mode
  TBC1.5: ?saved=1&id=<record> renders the selected cozSavedCharts record (Tropical Saved
  Library landing page): same renderer, data from the saved snapshot, toolbar becomes
  "Saved Charts" + Print / Save PDF, bottom Saved Readings links. Print opens at top level
  when framed. Without ?saved=1 the page behaves exactly as before.
  Direct Western/Tropical twin of vedic-birth-chart.html (BC2.1), same shell,
  tokens, accordion, print behavior. Only the astrology-specific chart,
  labels, fields and interpretations differ. See that file's own header
  comment for the shared-shell rationale; not repeated here.

  DATA CONTRACT (localStorage key "cozTropicalChartJSON", written by the
  master tropical-reveal exporter at TROPICAL v18.88 — renderer only, this
  page never calculates astronomy):
  {
    documentId, generatedAt,
    client: { displayName, birthDate, birthTime, locationLabel,
              timezoneAbbreviation, utcOffset },
    settings: { zodiac:"Tropical", requestedHouseSystem:"Placidus",
                resolvedHouseSystem:"Placidus"|"Whole Sign",
                usedHouseFallback: bool, nodeType:"Mean"|"True" },
    angles: { ascendant, descendant, midheaven, imumCoeli } (each a Position),
    bodies: [ { id, position, house, motion } ... ] (sun..pluto, northNode,
             southNode, chiron when present — Position = {longitude, sign,
             degree, minute} ),
    houseCusps: [ { house 1-12, position } ] (empty on whole-sign fallback),
    aspects: [ { bodyA, bodyB, type, orbDegrees, orbDisplay } ],
    balance: { element:{result,counts}, modality:{result,counts},
               emphasis:{labels,trace} } | null,
    interpretations: {}  // filled by the approved copy source, never here
  }
  FLAGGED, carried straight from the exporter: nodeType currently ships
  "Mean" — the engine has only mean-node math built, the handoff spec calls
  for True Node. Aspect orbs use a DEFAULT flat policy pending approval
  (see tropical-reveal.html v18.87 comment). Chart Emphasis has no approved
  vocabulary yet, so that row is omitted rather than invented.
  Demo data renders ONLY via ?chart=demo or ?chart=stellium, never as a
  fallback for a real visitor.
-->

    var truePt = wheelPoint$(it.trueAngle, cx, cy, rPlanetTrue);
    var labelPt = wheelPoint$(it.renderAngle, cx, cy, rPlanetLabel);
    var displaced = Math.abs(mod(it.renderAngle - it.trueAngle + 180, 360) - 180) > 0.5;
    svg.appendChild(svgEl("circle",{class:"wheel-tick", cx:truePt.x, cy:truePt.y, r:1.1}));
    if (displaced) svg.appendChild(svgEl("line",{class:"wheel-leader", x1:truePt.x, y1:truePt.y, x2:labelPt.x, y2:labelPt.y}));
    var g = svgEl("text",{class:"wheel-planet", x:labelPt.x, y:labelPt.y});
    g.textContent = BODY_GLYPH[it.id] || "?";
    svg.appendChild(g);
  });

  frame.appendChild(svg);
  return frame;

  /* local helper: same math as wheelPoint but takes a pre-computed theta-space
     angle (already the "180+offset" wheel angle) instead of a raw longitude */
  function wheelPoint$(wheelAngleDeg, cx, cy, r){
    var theta = wheelAngleDeg * Math.PI / 180;
    return { x: cx + r * Math.cos(theta), y: cy - r * Math.sin(theta) };
  }
}

function sectionHeading(kicker,title,id,side,sideScreenOnly){
  var head = el("div","section-heading" + (sideScreenOnly ? " accordion-heading" : ""));
  var left = el("div");
  left.appendChild(el("p","section-kicker",kicker));
  var h2 = el("h2",null,title); h2.id = id;
  left.appendChild(h2);
  head.appendChild(left);
  var p = el("p",sideScreenOnly ? "screen-only" : null,side);
  head.appendChild(p);
  return head;
}

var accordionSeq = 0;
function renderInsightList(items,prefix){
  var list = el("div","insight-list");
  items.forEach(function(item){
    var wrap = el("div","insight-item");
    var hasBody = !!(item.explanation || item.meta);
    var answer = el("span","insight-answer");
    if (item.answerNode) answer.appendChild(item.answerNode);
    else answer.appendChild(document.createTextNode(item.value));
    if (hasBody){
      var cid = prefix + "-c" + (++accordionSeq);
      var h3 = el("h3","insight-h");
      var btn = el("button","insight-trigger");
      btn.type = "button";
      btn.setAttribute("aria-expanded","false");
      btn.setAttribute("aria-controls",cid);
      btn.appendChild(el("span","insight-label",item.label));
      btn.appendChild(answer);
      var chev = svgEl("svg",{viewBox:"0 0 24 24",fill:"none",stroke:"currentColor","stroke-width":"2","aria-hidden":"true"});
      chev.appendChild(svgEl("path",{d:"M6 9l6 6 6-6"}));
      btn.appendChild(chev);
      h3.appendChild(btn);
      wrap.appendChild(h3);
      var content = el("div","insight-content");
      content.id = cid;
      content.hidden = true;
      if (item.explanation) content.appendChild(el("p",null,item.explanation));
      if (item.meta) content.appendChild(el("span",null,item.meta));
      wrap.appendChild(content);
      btn.addEventListener("click",function(){
        var open = btn.getAttribute("aria-expanded") === "true";
        list.querySelectorAll('.insight-trigger[aria-expanded="true"]').forEach(function(other){
          other.setAttribute("aria-expanded","false");
          document.getElementById(other.getAttribute("aria-controls")).hidden = true;
        });
        if (!open){
          btn.setAttribute("aria-expanded","true");
          content.hidden = false;
        }
      });
    } else {
      var row = el("div","insight-trigger insight-static");
      row.setAttribute("aria-label", item.label + ": " + (item.value || ""));
      row.appendChild(el("span","insight-label",item.label));
      row.appendChild(answer);
      row.appendChild(el("span"));
      wrap.appendChild(row);
    }
    list.appendChild(wrap);
  });
  return list;
}

function renderReport(chart){
  var article = el("article","birth-report");
  article.setAttribute("aria-label","Tropical birth chart report");
  var inner = el("div","report-inner");

  var header = el("header","report-header");
  var hl = el("div");
  hl.appendChild(el("p","wordmark","COZALYZE"));
  hl.appendChild(el("h1",null,"Tropical Birth Chart"));
  header.appendChild(hl);
  header.appendChild(el("p","chart-type","Western \u00B7 Natal"));
  inner.appendChild(header);

  var hasPerson = !!(chart.client && chart.client.displayName);
  var identity = el("section","birth-identity" + (hasPerson ? "" : " no-person"));
  identity.setAttribute("aria-label","Verified birth information");
  if (hasPerson){
    var who = el("div");
    who.appendChild(el("h2",null,chart.client.displayName));
    identity.appendChild(who);
  }
  var dl = el("dl");
  var tzLine = [chart.client.timezoneAbbreviation, chart.client.utcOffset].filter(Boolean).join(" \u00B7 ");
  var P1_MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var dm = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(chart.client.birthDate || ""));
  var dateShown = dm && +dm[2] >= 1 && +dm[2] <= 12 ? P1_MONTHS[+dm[2] - 1] + " " + (+dm[3]) + ", " + dm[1] : chart.client.birthDate;   /* TBC1.9 */
  var timeShown = String(chart.client.birthTime || "").replace(/^0(\d:\d\d)/, "$1");                                                 /* TBC1.9 */
  [["Date",dateShown,null],["Time",timeShown,tzLine],["Location",chart.client.locationLabel,null]].forEach(function(row){
    var d = el("div");
    d.appendChild(el("dt",null,row[0]));
    var dd = el("dd",null,row[1]);
    if (row[2]) dd.appendChild(el("span","birth-timezone",row[2]));
    d.appendChild(dd);
    dl.appendChild(d);
  });
  identity.appendChild(dl);
  inner.appendChild(identity);

  inner.appendChild(el("div","ornamental-rule"));

  var chartSec = el("section","chart-section report-section");
  chartSec.setAttribute("aria-labelledby","chart-heading");
  chartSec.appendChild(sectionHeading("Your celestial blueprint","Natal Chart","chart-heading","Circular Western format",false));
  chartSec.appendChild(renderWheel(chart));
  inner.appendChild(chartSec);

  /* Core Placements */
  var byId = {}; chart.bodies.forEach(function(b){ byId[b.id] = b; });
  var interp = chart.interpretations || {};
  var core = el("section","report-section");
  core.setAttribute("aria-labelledby","core-heading");
  core.appendChild(sectionHeading("The foundations of your chart","Core Placements","core-heading","Select a line for its meaning",true));
  var coreItems = [];
  if (byId.sun) coreItems.push({label:"Sun Sign", value:fmtPosition(byId.sun.position), explanation:interp.sun});
  if (byId.moon) coreItems.push({label:"Moon Sign", value:fmtPosition(byId.moon.position), explanation:interp.moon});
  coreItems.push({label:"Rising Sign", value:fmtPosition(chart.angles.ascendant), explanation:interp.rising});
  coreItems.push({label:"Midheaven", value:fmtPosition(chart.angles.midheaven), explanation:interp.midheaven});
  core.appendChild(renderInsightList(coreItems,"core"));
  inner.appendChild(core);

  /* Element & Modality Balance */
  if (chart.balance){
    var bal = el("section","report-section");
    bal.setAttribute("aria-labelledby","balance-heading");
    bal.appendChild(sectionHeading("The overall chart pattern","Element & Modality Balance","balance-heading","",true));
    var balItems = [
      {label:"Dominant Element", value:chart.balance.element.result, explanation:chart.balance.element.interpretation},
      {label:"Dominant Mode", value:chart.balance.modality.result, explanation:chart.balance.modality.interpretation}
    ];
    if (chart.balance.emphasis && chart.balance.emphasis.labels && chart.balance.emphasis.labels.length){
      balItems.push({label:"Chart Emphasis", value:chart.balance.emphasis.labels.join(" \u00B7 "), explanation:chart.balance.emphasis.interpretation});
    }
    bal.appendChild(renderInsightList(balItems,"balance"));
    inner.appendChild(bal);
  }

  /* Major Aspects */
  if (chart.aspects && chart.aspects.length){
    var asp = el("section","report-section");
    asp.setAttribute("aria-labelledby","aspects-heading");
    asp.appendChild(sectionHeading("Planetary relationships","Major Aspects","aspects-heading","Principal aspects only",true));
    var aspItems = chart.aspects.map(function(a){
      var A = byId[a.bodyA], B = byId[a.bodyB];
      var labelText = (BODY_LABEL[a.bodyA]||a.bodyA) + " " + ASPECT_LABEL[a.type] + " " + (BODY_LABEL[a.bodyB]||a.bodyB);
      var glyphSpan = el("span","aspect-glyphs");
      glyphSpan.textContent = (BODY_GLYPH[a.bodyA]||"") + " " + (ASPECT_GLYPH[a.type]||"") + " " + (BODY_GLYPH[a.bodyB]||"");
      var answerNode = document.createDocumentFragment();
      answerNode.appendChild(glyphSpan);
      answerNode.appendChild(document.createTextNode(" " + labelText + " (orb " + a.orbDisplay + ")"));
      return {label:"Aspect", value:labelText, answerNode:answerNode, explanation: (chart.interpretations && chart.interpretations["aspect_"+a.bodyA+"_"+a.bodyB]) || null};
    });
    asp.appendChild(renderInsightList(aspItems,"aspect"));
    inner.appendChild(asp);
  }

  /* Planetary Positions */
  var pos = el("section","report-section positions-section");
  pos.setAttribute("aria-labelledby","positions-heading");
  pos.appendChild(sectionHeading("Reference data","Planetary Positions","positions-heading","Natal positions",false));
  var scroll = el("div","positions-scroll");
  var table = el("table","positions-table");
  var thead = el("thead"); var trh = el("tr");
  ["Body","Sign & Degree","House","Motion"].forEach(function(t){
    var th = el("th",null,t); th.setAttribute("scope","col"); trh.appendChild(th);
  });
  thead.appendChild(trh); table.appendChild(thead);
  var tbody = el("tbody");
  var ascRow = el("tr");
  var ascTh = el("th",null,"Ascendant"); ascTh.setAttribute("scope","row"); ascRow.appendChild(ascTh);
  ascRow.appendChild(el("td",null,fmtPosition(chart.angles.ascendant)));
  ascRow.appendChild(el("td",null,"1"));
  ascRow.appendChild(el("td",null,"\u2014"));
  tbody.appendChild(ascRow);
  BODY_ORDER.forEach(function(id){
    if (id === "chiron" && !byId.chiron) return; /* Chiron only when the engine supplies it */
    var b = byId[id];
    if (!b) return;
    var tr = el("tr");
    var th = el("th",null,BODY_LABEL[id]); th.setAttribute("scope","row"); tr.appendChild(th);
    tr.appendChild(el("td",null,fmtPosition(b.position)));
    tr.appendChild(el("td",null,String(b.house)));
    tr.appendChild(el("td",null,MOTION_LABEL[b.motion] || "\u2014"));
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  scroll.appendChild(table);
  pos.appendChild(scroll);
  inner.appendChild(pos);

  /* House Cusps & Angles */
  if (chart.houseCusps && chart.houseCusps.length === 12){
    var hc = el("section","report-section");
    hc.setAttribute("aria-labelledby","cusps-heading");
    hc.appendChild(sectionHeading("House reference","House Cusps & Angles","cusps-heading","",false));
    var grid = el("div","cusps-grid");
    var ANGLE_LABEL = {1:"1 (Ascendant)", 4:"4 (Imum Coeli)", 7:"7 (Descendant)", 10:"10 (Midheaven)"};
    [[1,6],[7,12]].forEach(function(range){
      var t = el("table","cusps-table");
      var th = el("thead"); var tr0 = el("tr");
      ["House","Sign & Degree"].forEach(function(txt){ var thc = el("th",null,txt); thc.setAttribute("scope","col"); tr0.appendChild(thc); });
      th.appendChild(tr0); t.appendChild(th);
      var tb = el("tbody");
      var cuspByHouse = {}; chart.houseCusps.forEach(function(c){ cuspByHouse[c.house] = c.position; });
      for (var hh = range[0]; hh <= range[1]; hh++){
        var trr = el("tr");
        var rowTh = el("th",null, ANGLE_LABEL[hh] || String(hh)); rowTh.setAttribute("scope","row"); trr.appendChild(rowTh);
        trr.appendChild(el("td",null, cuspByHouse[hh] ? fmtPosition(cuspByHouse[hh]) : "\u2014"));
        tb.appendChild(trr);
      }
      t.appendChild(tb);
      grid.appendChild(t);
    });
    hc.appendChild(grid);
    inner.appendChild(hc);
  }

  var calc = el("section","calculation-strip report-section");
  calc.setAttribute("aria-label","Calculation settings");
  var houseLabel = chart.settings.usedHouseFallback ? (chart.settings.resolvedHouseSystem + " (fallback)") : chart.settings.resolvedHouseSystem;
  var nodeLabel = chart.settings.nodeType === "True" ? "True North & South Node" : "Mean North & South Node";
  [["Zodiac","Tropical"],["Houses",houseLabel],["Nodes",nodeLabel],["Time zone",tzLine || "\u2014"]].forEach(function(row){
    var d = el("div");
    d.appendChild(el("span",null,row[0]));
    d.appendChild(el("strong",null,row[1]));
    calc.appendChild(d);
  });
  inner.appendChild(calc);

  var footer = el("footer","report-footer");
  footer.appendChild(el("p",null,DISCLOSURE));
  footer.appendChild(el("p",null,"Generated by CozAlyze \u00B7 " + chart.documentId));
  inner.appendChild(footer);

  article.appendChild(inner);
  return article;
}

function renderEmptyState(){
  var card = el("div","empty-card");
  card.appendChild(el("h2",null,"No saved birth chart yet"));
  card.appendChild(el("p",null,"Your chart is saved to this device when your reading is prepared. Open your reading first, then return here for your printable birth chart."));
  return card;
}

/* Print / Save PDF: iOS Safari ignores window.print() from inside the app frame, so a
   framed page opens itself at top level with ?print=1 and prints there. */
function cozPrint(){
  var framed = false; try { framed = window.top !== window; } catch (e) { framed = true; }
  if (framed) { var u = new URL(location.href); u.searchParams.set("print", "1"); window.open(u.href, "_blank"); return; }
  window.print();
}
function cozAutoPrint(){
  if (!/[?&]print=1\b/.test(location.search)) return;
  var go = function(){ setTimeout(function(){ window.print(); }, 250); };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(go); else go();
}
/* TBC1.5: the Saved Readings links, appended in saved mode only.
   TBC1.7 (Sep 24): Your Current Transits opens the cream document
   (saved-tropical-document.html?view=transits), which recalculates the transits for this
   saved chart at that moment; a transit snapshot is never stored. */
function renderSavedReadings(lib){
  var sec = el("section","report-section saved-readings");
  sec.setAttribute("aria-labelledby","saved-readings-heading");
  sec.appendChild(sectionHeading("Quick access to other views for this chart","Saved Readings","saved-readings-heading","",false));
  var grid = el("div","saved-readings-links");
  [["Your Tropical Reading","reading",lib.has.reading,"Not finished when saved"],
   ["Your Ascendant","ascendant",lib.has.ascendant,"Not saved with this chart"],
   ["Your Current Transits","transits",lib.has.transits,"Chart not saved"]].forEach(function(row){
    var a = el("a", row[2] ? null : "unavailable");
    a.appendChild(el("span",null,row[0])); a.firstChild.style.color = "";
    if (row[2]){ a.href = "saved-tropical-document.html?view=" + row[1] + "&id=" + encodeURIComponent(lib.id); a.appendChild(el("span",null,"\u203A")); }
    else { a.setAttribute("aria-disabled","true"); a.appendChild(el("small",null,row[3])); }
    grid.appendChild(a);
  });
  sec.appendChild(grid);
  return sec;
}

/* ---------- Boot ---------- */
(function(){
  var mount = document.getElementById("reportMount");
  var banner = document.getElementById("sampleBanner");
  document.getElementById("printBtn").addEventListener("click",cozPrint);
  document.getElementById("backBtn").addEventListener("click",function(){ location.href = /\bsaved=1\b/.test(location.search) ? "saved-charts.html" : (/\bfrom=compare\b/.test(location.search) ? "compare-birth-charts.html" : "tropical-reading.html"); });
  /* Points at tropical-reveal.html for now — a confirmed-working page. Swap this
     one line if a dedicated tropical dashboard page (parallel to vedic-reading.html)
     turns out to exist or gets built under a different filename later. */

  var qp = new URLSearchParams(location.search);
  var chart = null, isSample = false;

  /* TBC1.5 saved mode: data from the selected saved record, never from the live keys */
  var savedLib = null;
  if (qp.get("saved") === "1"){
    document.body.classList.add("saved-mode");
    if (qp.get("in") === "compare"){ document.body.classList.add("embed-compare"); document.documentElement.classList.add("embed-compare"); }   /* TBC1.8 */
    document.getElementById("backBtn").lastChild.textContent = " Saved Charts";
    savedLib = window.CozSavedTropical ? window.CozSavedTropical.load() : null;
    if (!savedLib || !savedLib.chart){
      var card = el("div","empty-card");
      card.appendChild(el("h2",null,"This saved chart could not be opened"));
      card.appendChild(el("p",null,"It may have been removed from this device. Open Saved Charts to choose another."));
      mount.appendChild(card); return;
    }
    chart = savedLib.chart;
  }
  else if (qp.get("chart") === "demo"){ chart = DEMO_TROPICAL_CHART; isSample = true; }
  else if (qp.get("chart") === "stellium"){ chart = STELLIUM_QA; isSample = true; }
  else {
    var raw = null;
    try { raw = localStorage.getItem("cozTropicalChartJSON"); } catch(e){}
    if (raw){
      try {
        var parsed = JSON.parse(raw);
        var errs = validatePayload(parsed);
        if (errs.length === 0) chart = parsed;
        else if (window.console) console.warn("cozTropicalChartJSON rejected: " + errs.join("; "));
      } catch(e){ if (window.console) console.warn("cozTropicalChartJSON unreadable"); }
    }
  }

  if (!chart){ mount.appendChild(renderEmptyState()); return; }
  var errsFinal = validatePayload(chart);
  if (errsFinal.length){ mount.appendChild(renderEmptyState()); return; }
  if (isSample) banner.hidden = false;
  var report = renderReport(chart);
  if (savedLib && qp.get("in") !== "compare"){ var innerEl = report.querySelector(".report-inner"); innerEl.insertBefore(renderSavedReadings(savedLib), innerEl.querySelector(".report-footer")); }
  mount.appendChild(report);
  cozAutoPrint();
})();

</script>
